[project]
name = "islp"
version = "0.1.0"
description = "Rebuild the ISLP textbook PDF into a reflowable EPUB 3"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Govarthenan Rajadurai", email = "dev@dreamspace.tech" }]
dependencies = [
    "cairosvg>=2.9.0",
    "pillow>=12.3.0",
    "pymupdf>=1.28.2",
]

[dependency-groups]
dev = [
    "ruff>=0.16.3",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
# SIM108 turns a commented if/else into an unreadable one-liner; the comment is the point.
ignore = ["E501", "SIM108"]
