[project]
name = "islp"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "pillow>=12.3.0",
    "pymupdf>=1.28.2",
]

[dependency-groups]
dev = [
    "ruff>=0.16.3",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]
