  - heading "3.1.2 Assessing the Accuracy of the Coefficient Estimates" [level=3] [ref=f6e133]
  - paragraph [ref=f6e134]:
    - text: Recall from (
    - link "2.1" [ref=f6e135] [cursor=pointer]:
      - /url: ch03.xhtml#b5
    - text: ) that we assume that the
    - emphasis [ref=f6e136]: "true"
    - text: relationship between X and Y takes the form Y = f(X) + ϵ for some unknown function f, where ϵ is a mean-zero random error term. If f is to be approximated by a linear function, then we can write this relationship as
  - generic [ref=f6e137]:
    - img "Y = \\beta_0 + \\beta_1 X + \\epsilon." [ref=f6e138]
    - text: (3.5)
  - paragraph [ref=f6e139]:
    - text: Here β
    - subscript [ref=f6e140]: "0"
    - text: is the intercept term—that is, the expected value of Y when X = 0, and β
    - subscript [ref=f6e141]: "1"
    - text: "is the slope—the average increase in Y associated with a one-unit increase in X. The error term is a catch-all for what we miss with this simple model: the true relationship is probably not linear, there may be other variables that cause variation in Y , and there may be measurement error. We typically assume that the error term is independent of X."
  - generic [ref=f6e142]:
    - img "figure 3.2" [ref=f6e143]
    - paragraph [ref=f6e144]:
      - text: FIGURE 3.2.
      - emphasis [ref=f6e145]: Contour and three-dimensional plots of the RSS on the
      - code [ref=f6e146]: Advertising
      - emphasis [ref=f6e147]: data, using
      - code [ref=f6e148]: sales
      - emphasis [ref=f6e149]: as the response and
      - code [ref=f6e150]: TV
      - emphasis [ref=f6e151]: as the predictor. The red dots correspond to the least squares estimates
      - 'img "\\hat{\\beta}_{0}" [ref=f6e152]'
      - emphasis [ref=f6e153]: and
      - 'img "\\hat{\\beta}_{1}" [ref=f6e154]'
      - emphasis [ref=f6e155]: ", given by ("
