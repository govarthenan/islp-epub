    - code [ref=f6e2409]: medv
    - text: for given values of
    - code [ref=f6e2410]: lstat
    - text: .
  - paragraph [ref=f6e2411]:
    - code [ref=f6e2412]: .get_ prediction()
  - paragraph [ref=f6e2413]:
    - text: We first create a new data frame, in this case containing only the variable
