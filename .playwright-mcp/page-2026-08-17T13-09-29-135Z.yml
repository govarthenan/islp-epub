  - paragraph [ref=f6e1640]:
    - text: fit appears to be substantially better than the fit obtained when just the linear term is included. The R
    - superscript [ref=f6e1641]: "2"
    - text: of the quadratic fit is 0.688, compared to 0.606 for the linear fit, and the p-value in Table
    - link "3.10" [ref=f6e1642] [cursor=pointer]:
      - /url: ch04.xhtml#b244
    - text: for the quadratic term is highly significant.
  - paragraph [ref=f6e1643]:
    - text: If including
    - code [ref=f6e1644]: horsepower
    - superscript [ref=f6e1645]: "2"
    - text: led to such a big improvement in the model, why not include
    - code [ref=f6e1646]: horsepower
    - superscript [ref=f6e1647]: "3"
    - text: ","
    - code [ref=f6e1648]: horsepower
    - superscript [ref=f6e1649]: "4"
    - text: ", or even"
    - code [ref=f6e1650]: horsepower
    - superscript [ref=f6e1651]: "5"
    - text: "? The green curve in Figure"
    - link "3.8" [ref=f6e1652] [cursor=pointer]:
      - /url: ch04.xhtml#b243
    - text: displays the fit that results from including all polynomials up to fifth degree in the model (
    - link "3.36" [ref=f6e1653] [cursor=pointer]:
      - /url: ch04.xhtml#b242
    - text: ). The resulting fit seems unnecessarily wiggly—that is, it is unclear that including the additional terms really has led to a better fit to the data.
  - paragraph [ref=f6e1654]:
    - text: The approach that we have just described for extending the linear model to accommodate non-linear relationships is known as
    - emphasis [ref=f6e1655]: polynomial regression
    - text: ", since we have included polynomial functions of the predictors in the regression model. We further explore this approach and other non-linear extensions of the linear model in Chapter"
    - link "7" [ref=f6e1656] [cursor=pointer]:
      - /url: ch08.xhtml#b0
    - text: .
  - heading "3.3.3 Potential Problems" [level=3] [ref=f6e1657]
  - paragraph [ref=f6e1658]: "When we fit a linear regression model to a particular data set, many problems may occur. Most common among these are the following:"
  - paragraph [ref=f6e1659]:
    - text: "1."
    - emphasis [ref=f6e1660]: Non-linearity of the response-predictor relationships.
  - paragraph [ref=f6e1661]:
    - text: "2."
    - emphasis [ref=f6e1662]: Correlation of error terms.
  - paragraph [ref=f6e1663]:
    - text: "3."
    - emphasis [ref=f6e1664]: Non-constant variance of error terms.
  - paragraph [ref=f6e1665]:
    - text: "4."
    - emphasis [ref=f6e1666]: Outliers.
  - paragraph [ref=f6e1667]:
    - text: "5."
    - emphasis [ref=f6e1668]: High-leverage points.
  - paragraph [ref=f6e1669]:
    - text: "6."
    - emphasis [ref=f6e1670]: Collinearity.
  - paragraph [ref=f6e1671]: In practice, identifying and overcoming these problems is as much an art as a science. Many pages in countless books have been written on this topic. Since the linear regression model is not our primary focus here, we will provide only a brief summary of some key points.
  - generic [ref=f6e1672]:
    - img "figure 3.9" [ref=f6e1673]
    - paragraph [ref=f6e1674]:
      - text: FIGURE 3.9.
      - emphasis [ref=f6e1675]: Plots of residuals versus predicted (or fitted) values for the
      - code [ref=f6e1676]: Auto
      - emphasis [ref=f6e1677]: data set. In each plot, the red line is a smooth fit to the residuals, intended to make it easier to identify a trend.
      - text: "Left:"
      - emphasis [ref=f6e1678]: A linear regression of
      - code [ref=f6e1679]: mpg
      - emphasis [ref=f6e1680]: "on"
      - code [ref=f6e1681]: horsepower
      - emphasis [ref=f6e1682]: . A strong pattern in the residuals indicates non-linearity in the data.
      - text: "Right:"
      - emphasis [ref=f6e1683]: A linear regression of
      - code [ref=f6e1684]: mpg
      - emphasis [ref=f6e1685]: "on"
      - code [ref=f6e1686]: horsepower
      - emphasis [ref=f6e1687]: and
      - code [ref=f6e1688]: horsepower
      - superscript [ref=f6e1689]: "2"
      - emphasis [ref=f6e1690]: . There is little pattern in the residuals.
  - paragraph [ref=f6e1691]: The linear regression model assumes that there is a straight-line relationship between the predictors and the response. If the true relationship is far from linear, then virtually all of the conclusions that we draw from the fit are suspect. In addition, the prediction accuracy of the model can be significantly reduced.
  - paragraph [ref=f6e1692]:
    - emphasis [ref=f6e1693]: Residual plots
    - text: are a useful graphical tool for identifying non-linearity. Given a simple linear regression model, we can plot the residuals, e
    - subscript [ref=f6e1694]: i
    - text: =
    - 'img "y_{i} - \\hat{y}_{i}" [ref=f6e1695]'
    - text: ", versus the predictor x"
    - subscript [ref=f6e1696]: i
    - text: . In the case of a multiple regression model, since there are multiple predictors, we instead plot the residuals versus the predicted (or
    - emphasis [ref=f6e1697]: fitted
    - text: ) values
    - 'img "\\hat{y}_{i}" [ref=f6e1698]'
    - text: . Ideally, the residual plot will show no discernible pattern. The presence of a pattern may indicate a problem with some aspect of the linear model.
  - paragraph [ref=f6e1699]: residual plot · fitted
  - paragraph [ref=f6e1700]:
    - text: The left panel of Figure
    - link "3.9" [ref=f6e1701] [cursor=pointer]:
      - /url: ch04.xhtml#b257
    - text: displays a residual plot from the linear regression of
    - code [ref=f6e1702]: mpg
    - text: onto
    - code [ref=f6e1703]: horsepower
    - text: on the
    - code [ref=f6e1704]: Auto
    - text: data set that was illustrated in Figure
    - link "3.8" [ref=f6e1705] [cursor=pointer]:
      - /url: ch04.xhtml#b243
    - text: . The red line is a smooth fit to the residuals, which is displayed in order to make it easier to identify any trends. The residuals exhibit a clear U-shape, which provides a strong indication of non-linearity in the data. In contrast, the right-hand panel of Figure
    - link "3.9" [ref=f6e1706] [cursor=pointer]:
      - /url: ch04.xhtml#b257
    - text: displays the residual plot that results from the model (
    - link "3.36" [ref=f6e1707] [cursor=pointer]:
      - /url: ch04.xhtml#b242
    - text: ), which contains a quadratic term. There appears to be little pattern in the residuals, suggesting that the quadratic term improves the fit to the data.
  - paragraph [ref=f6e1708]:
    - text: If the residual plot indicates that there are non-linear associations in the data, then a simple approach is to use non-linear transformations of the predictors, such as log X,
    - 'img "\\sqrt{X}," [ref=f6e1709]'
    - text: ", and X"
    - superscript [ref=f6e1710]: "2"
    - text: ", in the regression model. In the later chapters of this book, we will discuss other more advanced non-linear approaches for addressing this issue."
  - heading "2. Correlation of Error Terms" [level=4] [ref=f6e1711]
  - paragraph [ref=f6e1712]:
    - text: An important assumption of the linear regression model is that the error terms, ϵ
    - subscript [ref=f6e1713]: "1"
    - text: ", ϵ"
    - subscript [ref=f6e1714]: "2"
    - text: ", . . . , ϵ"
    - subscript [ref=f6e1715]: "n"
    - text: ", are uncorrelated. What does this mean? For instance, if the errors are uncorrelated, then the fact that ϵ"
    - subscript [ref=f6e1716]: i
    - text: is positive provides little or no information about the sign of ϵ
    - subscript [ref=f6e1717]: i+1
    - text: . The standard errors that are computed for the estimated regression coefficients or the fitted values are based on the assumption of uncorrelated error terms. If in fact there is correlation among the error terms, then the estimated standard errors will tend to underestimate the true standard errors. As a result, confidence and prediction intervals will be narrower than they should be. For example, a 95 % confidence interval may in reality have a much lower probability than 0.95 of containing the true value of the parameter. In addition, pvalues associated with the model will be lower than they should be; this could cause us to erroneously conclude that a parameter is statistically significant. In short, if the error terms are correlated, we may have an unwarranted sense of confidence in our model.
  - paragraph [ref=f6e1718]:
    - text: As an extreme example, suppose we accidentally doubled our data, leading to observations and error terms identical in pairs. If we ignored this, our standard error calculations would be as if we had a sample of size 2n, when in fact we have only n samples. Our estimated parameters would be the same for the 2n samples as for the
    - img "n" [ref=f6e1719]
    - text: samples, but the confidence intervals would be narrower by a factor of
    - 'img "\\sqrt{2}" [ref=f6e1720]'
    - text: "!"
  - paragraph [ref=f6e1721]:
    - text: Why might correlations among the error terms occur? Such correlations frequently occur in the context of
    - emphasis [ref=f6e1722]: time series
    - text: data, which consists of observations for which measurements are obtained at discrete points in time. In many cases, observations that are obtained at adjacent time points will have positively correlated errors. In order to determine if this is the case for a given data set, we can plot the residuals from our model as a function of time. If the errors are uncorrelated, then there should be no discernible pat-
  - paragraph [ref=f6e1723]: time series
  - generic [ref=f6e1724]:
    - img "figure 3.10" [ref=f6e1725]
    - paragraph [ref=f6e1726]:
      - text: FIGURE 3.10.
      - emphasis [ref=f6e1727]: Plots of residuals from simulated time series data sets generated with differing levels of correlation
      - text: ρ
      - emphasis [ref=f6e1728]: between error terms for adjacent time points.
  - paragraph [ref=f6e1729]:
    - text: tern. On the other hand, if the error terms are positively correlated, then we may see
    - emphasis [ref=f6e1730]: tracking
    - text: in the residuals—that is, adjacent residuals may have similar values. Figure
    - link "3.10" [ref=f6e1731] [cursor=pointer]:
      - /url: ch04.xhtml#b266
    - text: provides an illustration. In the top panel, we see the residuals from a linear regression fit to data generated with uncorrelated errors. There is no evidence of a time-related trend in the residuals. In contrast, the residuals in the bottom panel are from a data set in which adjacent errors had a correlation of 0.9. Now there is a clear pattern in the residuals—adjacent residuals tend to take on similar values. Finally, the center panel illustrates a more moderate case in which the residuals had a correlation of 0.5. There is still evidence of tracking, but the pattern is less clear.
  - paragraph [ref=f6e1732]: tracking
  - paragraph [ref=f6e1733]: Many methods have been developed to properly take account of correlations in the error terms in time series data. Correlation among the error terms can also occur outside of time series data. For instance, consider a study in which individuals’ heights are predicted from their weights. The assumption of uncorrelated errors could be violated if some of the individuals in the study are members of the same family, eat the same diet, or have been exposed to the same environmental factors. In general, the assumption of uncorrelated errors is extremely important for linear regression as well as for other statistical methods, and good experimental design is crucial in order to mitigate the risk of such correlations.
  - generic [ref=f6e1734]:
    - img "figure 3.11" [ref=f6e1735]
    - paragraph [ref=f6e1736]:
      - text: FIGURE 3.11.
      - emphasis [ref=f6e1737]: Residual plots. In each plot, the red line is a smooth fit to the residuals, intended to make it easier to identify a trend. The blue lines track the outer quantiles of the residuals, and emphasize patterns.
      - text: "Left:"
      - emphasis [ref=f6e1738]: The funnel shape indicates heteroscedasticity.
      - text: "Right:"
      - emphasis [ref=f6e1739]: The response has been log transformed, and there is now no evidence of heteroscedasticity.
  - heading "3. Non-constant Variance of Error Terms" [level=4] [ref=f6e1740]
  - paragraph [ref=f6e1741]:
    - text: Another important assumption of the linear regression model is that the error terms have a constant variance, Var(ϵ
    - subscript [ref=f6e1742]: i
    - text: ) = σ
    - superscript [ref=f6e1743]: "2"
    - text: . The standard errors, confidence intervals, and hypothesis tests associated with the linear model rely upon this assumption.
  - paragraph [ref=f6e1744]:
    - text: Unfortunately, it is often the case that the variances of the error terms are non-constant. For instance, the variances of the error terms may increase with the value of the response. One can identify non-constant variances in the errors, or
    - emphasis [ref=f6e1745]: heteroscedasticity
    - text: ", from the presence of a"
    - emphasis [ref=f6e1746]: funnel shape
    - text: in the residual plot. An example is shown in the left-hand panel of Figure
    - link "3.11" [ref=f6e1747] [cursor=pointer]:
      - /url: ch04.xhtml#b269
    - text: ", in which the magnitude of the residuals tends to increase with the fitted values. When faced with this problem, one possible solution is to transform the response Y using a concave function such as log Y or Y . Such a transformation results in a greater amount of shrinkage of the larger responses, leading to a reduction in heteroscedasticity. The right-hand panel of Figure"
    - link "3.11" [ref=f6e1748] [cursor=pointer]:
      - /url: ch04.xhtml#b269
    - text: displays the residual plot after transforming the response using log Y . The residuals now appear to have constant variance, though there is some evidence of a slight non-linear relationship in the data.
  - paragraph [ref=f6e1749]: heteroscedasticity
  - paragraph [ref=f6e1750]:
    - text: Sometimes we have a good idea of the variance of each response. For example, the ith response could be an average of n
    - subscript [ref=f6e1751]: i
    - text: raw observations. If each of these raw observations is uncorrelated with variance σ
    - superscript [ref=f6e1752]: "2"
    - text: ", then their average has variance σ"
    - subscript [ref=f6e1753]: i
    - superscript [ref=f6e1754]: "2"
    - text: = σ
    - superscript [ref=f6e1755]: "2"
    - text: /n
    - subscript [ref=f6e1756]: i
    - text: . In this case a simple remedy is to fit our model by
    - emphasis [ref=f6e1757]: weighted least squares
    - text: ", with weights proportional to the inverse variances—i.e. w"
    - subscript [ref=f6e1758]: i
    - text: = n
    - subscript [ref=f6e1759]: i
    - text: in this case. Most linear regression software allows for observation weights.
  - paragraph [ref=f6e1760]: weighted least squares
  - heading "4. Outliers" [level=4] [ref=f6e1761]
  - paragraph [ref=f6e1762]:
    - text: An
    - emphasis [ref=f6e1763]: outlier
    - text: is a point for which y
    - subscript [ref=f6e1764]: i
    - text: is far from the value predicted by the
  - paragraph [ref=f6e1765]: outlier
  - generic [ref=f6e1766]:
    - img "figure 3.12" [ref=f6e1767]
    - paragraph [ref=f6e1768]:
      - text: "FIGURE 3.12. Left:"
      - emphasis [ref=f6e1769]: The least squares regression line is shown in red, and the regression line after removing the outlier is shown in blue.
      - text: "Center:"
      - emphasis [ref=f6e1770]: The residual plot clearly identifies the outlier.
      - text: "Right:"
      - emphasis [ref=f6e1771]: The outlier has a studentized residual of
      - text: "6"
      - emphasis [ref=f6e1772]: ; typically we expect values between
      - text: −3
      - emphasis [ref=f6e1773]: and
      - text: "3"
      - emphasis [ref=f6e1774]: .
  - paragraph [ref=f6e1775]: model. Outliers can arise for a variety of reasons, such as incorrect recording of an observation during data collection.
  - paragraph [ref=f6e1776]:
    - text: The red point (observation 20) in the left-hand panel of Figure
    - link "3.12" [ref=f6e1777] [cursor=pointer]:
      - /url: ch04.xhtml#b276
    - text: "illustrates a typical outlier. The red solid line is the least squares regression fit, while the blue dashed line is the least squares fit after removal of the outlier. In this case, removing the outlier has little effect on the least squares line: it leads to almost no change in the slope, and a miniscule reduction in the intercept. It is typical for an outlier that does not have an unusual predictor value to have little effect on the least squares fit. However, even if an outlier does not have much effect on the least squares fit, it can cause other problems. For instance, in this example, the RSE is 1.09 when the outlier is included in the regression, but it is only 0.77 when the outlier is removed. Since the RSE is used to compute all confidence intervals and p-values, such a dramatic increase caused by a single data point can have implications for the interpretation of the fit. Similarly, inclusion of the outlier causes the R"
    - superscript [ref=f6e1778]: "2"
    - text: to decline from 0.892 to 0.805.
  - paragraph [ref=f6e1779]:
    - text: Residual plots can be used to identify outliers. In this example, the outlier is clearly visible in the residual plot illustrated in the center panel of Figure
    - link "3.12" [ref=f6e1780] [cursor=pointer]:
      - /url: ch04.xhtml#b276
    - text: . But in practice, it can be difficult to decide how large a residual needs to be before we consider the point to be an outlier. To address this problem, instead of plotting the residuals, we can plot the
    - emphasis [ref=f6e1781]: studentized residuals
    - text: ", computed by dividing each residual e"
    - subscript [ref=f6e1782]: i
    - text: by its estimated standard error. Observations whose studentized residuals are greater than 3 in absolute value are possible outliers. In the right-hand panel of Figure
    - link "3.12" [ref=f6e1783] [cursor=pointer]:
      - /url: ch04.xhtml#b276
    - text: ", the outlier’s studentized residual exceeds 6, while all other observations have studentized residuals between −2 and 2."
  - paragraph [ref=f6e1784]: studentized residual
  - paragraph [ref=f6e1785]: If we believe that an outlier has occurred due to an error in data collection or recording, then one solution is to simply remove the observation. However, care should be taken, since an outlier may instead indicate a deficiency with the model, such as a missing predictor.
  - heading "5. High Leverage Points" [level=4] [ref=f6e1786]
  - paragraph [ref=f6e1787]:
    - text: We just saw that outliers are observations for which the response y
    - subscript [ref=f6e1788]: i
    - text: is unusual given the predictor x
    - subscript [ref=f6e1789]: i
    - text: . In contrast, observations with
    - emphasis [ref=f6e1790]: high leverage
    - text: have an unusual value for x
    - subscript [ref=f6e1791]: i
    - text: . For example, observation 41 in the left-hand
  - paragraph [ref=f6e1792]: high leverage
  - generic [ref=f6e1793]:
    - img "figure 3.13" [ref=f6e1794]
    - paragraph [ref=f6e1795]:
      - text: "FIGURE 3.13. Left:"
      - emphasis [ref=f6e1796]: Observation 41 is a high leverage point, while 20 is not. The red line is the fit to all the data, and the blue line is the fit with observation 41 removed.
      - text: "Center:"
      - emphasis [ref=f6e1797]: The red observation is not unusual in terms of its
      - text: X
      - subscript [ref=f6e1798]: "1"
      - emphasis [ref=f6e1799]: value or its
      - text: X
      - subscript [ref=f6e1800]: "2"
      - emphasis [ref=f6e1801]: value, but still falls outside the bulk of the data, and hence has high leverage.
      - text: "Right:"
      - emphasis [ref=f6e1802]: Observation
      - text: "41"
      - emphasis [ref=f6e1803]: has a high leverage and a high residual.
  - paragraph [ref=f6e1804]:
    - text: panel of Figure
    - link "3.13" [ref=f6e1805] [cursor=pointer]:
      - /url: ch04.xhtml#b283
    - text: has high leverage, in that the predictor value for this observation is large relative to the other observations. (Note that the data displayed in Figure
    - link "3.13" [ref=f6e1806] [cursor=pointer]:
      - /url: ch04.xhtml#b283
    - text: are the same as the data displayed in Figure
    - link "3.12" [ref=f6e1807] [cursor=pointer]:
      - /url: ch04.xhtml#b276
    - text: ", but with the addition of a single high leverage observation.) The red solid line is the least squares fit to the data, while the blue dashed line is the fit produced when observation 41 is removed. Comparing the left-hand panels of Figures"
    - link "3.12" [ref=f6e1808] [cursor=pointer]:
      - /url: ch04.xhtml#b276
    - text: and
    - link "3.13" [ref=f6e1809] [cursor=pointer]:
      - /url: ch04.xhtml#b283
    - text: ", we observe that removing the high leverage observation has a much more substantial impact on the least squares line than removing the outlier. In fact, high leverage observations tend to have a sizable impact on the estimated regression line. It is cause for concern if the least squares line is heavily affected by just a couple of observations, because any problems with these points may invalidate the entire fit. For this reason, it is important to identify high leverage observations."
  - paragraph [ref=f6e1810]:
    - text: In a simple linear regression, high leverage observations are fairly easy to identify, since we can simply look for observations for which the predictor value is outside of the normal range of the observations. But in a multiple linear regression with many predictors, it is possible to have an observation that is well within the range of each individual predictor’s values, but that is unusual in terms of the full set of predictors. An example is shown in the center panel of Figure
    - link "3.13" [ref=f6e1811] [cursor=pointer]:
      - /url: ch04.xhtml#b283
    - text: ", for a data set with two predictors, X"
    - subscript [ref=f6e1812]: "1"
    - text: and X
    - subscript [ref=f6e1813]: "2"
    - text: . Most of the observations’ predictor values fall within the blue dashed ellipse, but the red observation is well outside of this range. But neither its value for X
    - subscript [ref=f6e1814]: "1"
    - text: nor its value for X
    - subscript [ref=f6e1815]: "2"
    - text: is unusual. So if we examine just X
    - subscript [ref=f6e1816]: "1"
    - text: or just X
    - subscript [ref=f6e1817]: "2"
    - text: ", we will fail to notice this high leverage point. This problem is more pronounced in multiple regression settings with more than two predictors, because then there is no simple way to plot all dimensions of the data simultaneously."
  - paragraph [ref=f6e1818]:
    - text: In order to quantify an observation’s leverage, we compute the
    - emphasis [ref=f6e1819]: leverage statistic
    - text: . A large value of this statistic indicates an observation with high leverage. For a simple linear regression,
  - paragraph [ref=f6e1820]: leverage statistic
  - generic [ref=f6e1821]:
    - 'img "h_i = \\frac{1}{n} + \\frac{(x_i - \\bar{x})^2}{\\sum_{i''=1}^{n}(x_{i''} - \\bar{x})^2}." [ref=f6e1822]'
    - text: (3.37)
  - generic [ref=f6e1823]:
    - img "figure 3.14" [ref=f6e1824]
    - paragraph [ref=f6e1825]:
      - text: FIGURE 3.14.
      - emphasis [ref=f6e1826]: Scatterplots of the observations from the
      - code [ref=f6e1827]: Credit
      - emphasis [ref=f6e1828]: data set.
      - text: "Left:"
      - emphasis [ref=f6e1829]: A plot of
      - code [ref=f6e1830]: age
      - emphasis [ref=f6e1831]: versus
      - code [ref=f6e1832]: limit
      - emphasis [ref=f6e1833]: . These two variables are not collinear.
      - text: "Right:"
      - emphasis [ref=f6e1834]: A plot of
      - code [ref=f6e1835]: rating
      - emphasis [ref=f6e1836]: versus
      - code [ref=f6e1837]: limit
      - emphasis [ref=f6e1838]: . There is high collinearity.
  - paragraph [ref=f6e1839]:
    - text: It is clear from this equation that h
    - subscript [ref=f6e1840]: i
    - text: increases with the distance of x
    - subscript [ref=f6e1841]: i
    - text: from
    - 'img "\\bar{x}" [ref=f6e1842]'
    - text: . There is a simple extension of h
    - subscript [ref=f6e1843]: i
    - text: to the case of multiple predictors, though we do not provide the formula here. The leverage statistic h
    - subscript [ref=f6e1844]: i
    - text: is always between 1/n and 1, and the average leverage for all the observations is always equal to (p + 1)/n. So if a given observation has a leverage statistic that greatly exceeds (p+1)/n, then we may suspect that the corresponding point has high leverage.
  - paragraph [ref=f6e1845]:
    - text: The right-hand panel of Figure
    - link "3.13" [ref=f6e1846] [cursor=pointer]:
      - /url: ch04.xhtml#b283
    - text: provides a plot of the studentized residuals versus h
    - subscript [ref=f6e1847]: i
    - text: for the data in the left-hand panel of Figure
    - link "3.13" [ref=f6e1848] [cursor=pointer]:
      - /url: ch04.xhtml#b283
    - text: . Observation 41 stands out as having a very high leverage statistic as well as a high studentized residual. In other words, it is an outlier as well as a high leverage observation. This is a particularly dangerous combination! This plot also reveals the reason that observation 20 had relatively little effect on the least squares fit in Figure
    - link "3.12" [ref=f6e1849] [cursor=pointer]:
      - /url: ch04.xhtml#b276
    - text: ": it has low leverage."
  - heading "6. Collinearity" [level=4] [ref=f6e1850]
  - paragraph [ref=f6e1851]:
    - emphasis [ref=f6e1852]: Collinearity
    - text: refers to the situation in which two or more predictor variables are closely related to one another. The concept of collinearity is illustrated in Figure
    - link "3.14" [ref=f6e1853] [cursor=pointer]:
      - /url: ch04.xhtml#b288
    - text: using the
    - code [ref=f6e1854]: Credit
    - text: data set. In the left-hand panel of Figure
    - link "3.14" [ref=f6e1855] [cursor=pointer]:
      - /url: ch04.xhtml#b288
    - text: ", the two predictors"
    - code [ref=f6e1856]: limit
    - text: and
    - code [ref=f6e1857]: age
    - text: appear to have no obvious relationship. In contrast, in the right-hand panel of Figure
    - link "3.14" [ref=f6e1858] [cursor=pointer]:
      - /url: ch04.xhtml#b288
    - text: ", the predictors"
    - code [ref=f6e1859]: limit
    - text: and
    - code [ref=f6e1860]: rating
    - text: are very highly correlated with each other, and we say that they are
    - emphasis [ref=f6e1861]: collinear
    - text: . The presence of collinearity can pose problems in the regression context, since it can be difficult to separate out the individual effects of collinear variables on the response. In other words, since
    - code [ref=f6e1862]: limit
    - text: and
    - code [ref=f6e1863]: rating
    - text: tend to increase or decrease together, it can be difficult to determine how each one separately is associated with the response,
    - code [ref=f6e1864]: balance
    - text: .
  - paragraph [ref=f6e1865]: collinearity
  - paragraph [ref=f6e1866]:
    - text: Figure
    - link "3.15" [ref=f6e1867] [cursor=pointer]:
      - /url: ch04.xhtml#b294
    - text: illustrates some of the difficulties that can result from collinearity. The left-hand panel of Figure
    - link "3.15" [ref=f6e1868] [cursor=pointer]:
      - /url: ch04.xhtml#b294
    - text: is a contour plot of the RSS (
    - link "3.22" [ref=f6e1869] [cursor=pointer]:
      - /url: ch04.xhtml#b102
    - text: ) associated with different possible coefficient estimates for the regression of
    - code [ref=f6e1870]: balance
    - text: "on"
    - code [ref=f6e1871]: limit
    - text: and
    - code [ref=f6e1872]: age
    - text: . Each ellipse represents a set of coefficients
  - generic [ref=f6e1873]:
    - img "figure 3.15" [ref=f6e1874]
    - paragraph [ref=f6e1875]:
      - text: FIGURE 3.15.
      - emphasis [ref=f6e1876]: Contour plots for the RSS values as a function of the parameters
