    - text: opposite? In fact it does. Consider the correlation matrix for the three predictor variables and response variable, displayed in Table
    - link "3.5" [ref=f6e720] [cursor=pointer]:
      - /url: ch04.xhtml#b109
    - text: . Notice that the correlation between
    - code [ref=f6e721]: radio
    - text: and
    - code [ref=f6e722]: newspaper
    - text: is 0.35. This indicates that markets with high newspaper advertising tend to also have high radio advertising. Now suppose that the multiple regression is correct and newspaper advertising is not associated with sales, but radio advertising is associated with sales. Then in markets where we spend more on radio our sales will tend to be higher, and as our correlation matrix shows, we also tend to spend more on newspaper advertising in those same markets. Hence, in a simple linear regression which only examines
    - code [ref=f6e723]: sales
    - text: versus
    - code [ref=f6e724]: newspaper
    - text: ", we will observe that higher values of"
    - code [ref=f6e725]: newspaper
    - text: tend to be associated with higher values of
    - code [ref=f6e726]: sales
    - text: ", even though newspaper advertising is not directly associated with sales. So"
    - code [ref=f6e727]: newspaper
    - text: advertising is a surrogate for
    - code [ref=f6e728]: radio
    - text: advertising;
    - code [ref=f6e729]: newspaper
    - text: gets “credit” for the association between
    - code [ref=f6e730]: radio
    - text: "on"
    - code [ref=f6e731]: sales
    - text: .
  - paragraph [ref=f6e732]:
    - text: This slightly counterintuitive result is very common in many real life situations. Consider an absurd example to illustrate the point. Running a regression of shark attacks versus ice cream sales for data collected at a given beach community over a period of time would show a positive relationship, similar to that seen between
    - code [ref=f6e733]: sales
    - text: and
    - code [ref=f6e734]: newspaper
    - text: . Of course no one has (yet) suggested that ice creams should be banned at beaches to reduce shark attacks. In reality, higher temperatures cause more people to visit the beach, which in turn results in more ice cream sales and more shark attacks. A multiple regression of shark attacks onto ice cream sales and temperature reveals that, as intuition implies, ice cream sales is no longer a significant predictor after adjusting for temperature.
  - heading "3.2.2 Some Important Questions" [level=3] [ref=f6e735]
  - paragraph [ref=f6e736]: When we perform multiple linear regression, we usually are interested in answering a few important questions.
  - paragraph [ref=f6e737]:
    - text: "1."
    - emphasis [ref=f6e738]: Is at least one of the predictors
    - text: X
    - subscript [ref=f6e739]: "1"
    - text: ", X"
    - subscript [ref=f6e740]: "2"
    - text: ", . . . , X"
    - subscript [ref=f6e741]: p
    - emphasis [ref=f6e742]: useful in predicting the response?
  - paragraph [ref=f6e743]:
    - text: "2."
    - emphasis [ref=f6e744]: Do all the predictors help to explain
    - text: "Y"
    - emphasis [ref=f6e745]: ", or is only a subset of the predictors useful?"
  - paragraph [ref=f6e746]:
    - text: "3."
    - emphasis [ref=f6e747]: How well does the model fit the data?
  - paragraph [ref=f6e748]:
    - text: "4."
    - emphasis [ref=f6e749]: Given a set of predictor values, what response value should we predict, and how accurate is our prediction?
    - text: We now address each of these questions in turn.
  - 'heading "One: Is There a Relationship Between the Response and Predictors?" [level=4] [ref=f6e750]'
  - paragraph [ref=f6e751]:
    - text: Recall that in the simple linear regression setting, in order to determine whether there is a relationship between the response and the predictor we can simply check whether β
    - subscript [ref=f6e752]: "1"
    - text: = 0. In the multiple regression setting with p predictors, we need to ask whether all of the regression coefficients are zero, i.e. whether β
    - subscript [ref=f6e753]: "1"
    - text: = β
    - subscript [ref=f6e754]: "2"
    - text: = · · · = β
    - subscript [ref=f6e755]: p
    - text: = 0. As in the simple linear regression setting, we use a hypothesis test to answer this question. We test the null hypothesis,
  - 'img "H_0 : \\beta_1 = \\beta_2 = \\cdots = \\beta_p = 0" [ref=f6e757]'
  - paragraph [ref=f6e758]:
    - text: versus the alternative H
    - subscript [ref=f6e759]: a
    - text: ": at least one β"
    - subscript [ref=f6e760]: j
    - text: is non-zero. This hypothesis test is performed by computing the F
    - emphasis [ref=f6e761]: "-statistic"
    - text: ","
  - paragraph [ref=f6e762]: F-statistic
  - generic [ref=f6e763]:
    - 'img "F = \\frac{(\\mathrm{TSS} - \\mathrm{RSS})/p}{\\mathrm{RSS}/(n - p - 1)}," [ref=f6e764]'
    - text: (3.23)
  - paragraph [ref=f6e765]:
    - text: where, as with simple linear regression,
    - 'img "\\mathrm{TSS} = \\sum(y_i - \\bar{y})^2" [ref=f6e766]'
    - text: and RSS =
    - 'img "\\sum(y_i - \\hat{y}_i)^2" [ref=f6e767]'
    - text: . If the linear model assumptions are correct, one can show that
  - 'img "E\\{\\mathrm{RSS}/(n - p - 1)\\} = \\sigma^2" [ref=f6e769]'
  - paragraph [ref=f6e770]:
    - text: and that, provided H
    - subscript [ref=f6e771]: "0"
    - text: is true,
  - 'img "E\\{(\\mathrm{TSS} - \\mathrm{RSS})/p\\} = \\sigma^2." [ref=f6e773]'
  - paragraph [ref=f6e774]:
    - text: Hence, when there is no relationship between the response and predictors, one would expect the F-statistic to take on a value close to 1. On the other hand, if H
    - subscript [ref=f6e775]: a
    - text: "is true, then E{(TSS − RSS)/p} > σ"
    - superscript [ref=f6e776]: "2"
    - text: ", so we expect F to be greater than 1."
  - paragraph [ref=f6e777]:
    - text: The F-statistic for the multiple linear regression model obtained by regressing
    - code [ref=f6e778]: sales
    - text: onto
    - code [ref=f6e779]: radio
    - text: ","
    - code [ref=f6e780]: TV
    - text: ", and"
    - code [ref=f6e781]: newspaper
    - text: is shown in Table
    - link "3.6" [ref=f6e782] [cursor=pointer]:
      - /url: ch04.xhtml#b129
    - text: . In this example the F-statistic is 570. Since this is far larger than 1, it provides compelling evidence against the null hypothesis H
    - subscript [ref=f6e783]: "0"
    - text: . In other words, the large F-statistic suggests that at least one of the advertising media must be related to
    - code [ref=f6e784]: sales
    - text: . However, what if the F-statistic had been closer to 1? How large does the F-statistic need to be before we can reject H
    - subscript [ref=f6e785]: "0"
    - text: and
  - generic [ref=f6e786]:
    - table [ref=f6e787]:
      - rowgroup [ref=f6e788]:
        - row [ref=f6e789]:
          - columnheader "Quantity" [ref=f6e790]
          - columnheader "Value" [ref=f6e791]
      - rowgroup [ref=f6e792]:
        - row [ref=f6e793]:
          - rowheader "Residual standard error" [ref=f6e794]
          - cell "1.69" [ref=f6e795]
        - row [ref=f6e796]:
          - rowheader [ref=f6e797]:
            - text: R
            - superscript [ref=f6e798]: "2"
          - cell "0.897" [ref=f6e799]
        - row [ref=f6e800]:
          - rowheader "F-statistic" [ref=f6e801]
          - cell "570" [ref=f6e802]
    - paragraph [ref=f6e803]:
      - text: TABLE 3.6.
      - emphasis [ref=f6e804]: More information about the least squares model for the regression of number of units sold on TV, newspaper, and radio advertising budgets in the
      - code [ref=f6e805]: Advertising
      - emphasis [ref=f6e806]: data. Other information about this model was displayed in Table
      - link [ref=f6e807] [cursor=pointer]:
        - /url: ch04.xhtml#b108
        - emphasis [ref=f6e808]: "3.4"
      - emphasis [ref=f6e809]: .
  - paragraph [ref=f6e810]:
    - text: conclude that there is a relationship? It turns out that the answer depends on the values of n and p. When n is large, an F-statistic that is just a little larger than 1 might still provide evidence against H
    - subscript [ref=f6e811]: "0"
    - text: . In contrast, a larger F-statistic is needed to reject H
    - subscript [ref=f6e812]: "0"
    - text: if n is small. When H
    - subscript [ref=f6e813]: "0"
    - text: is true and the errors ϵ
    - subscript [ref=f6e814]: i
    - text: have a normal distribution, the F-statistic follows an F-distribution.
    - superscript [ref=f6e815]:
      - link "6" [ref=f6e816] [cursor=pointer]:
        - /url: ch04.xhtml#b137
    - text: For any given value of n and p, any statistical software package can be used to compute the p-value associated with the F-statistic using this distribution. Based on this p-value, we can determine whether or not to reject H
    - subscript [ref=f6e817]: "0"
    - text: . For the advertising data, the p-value associated with the F-statistic in Table
    - link "3.6" [ref=f6e818] [cursor=pointer]:
      - /url: ch04.xhtml#b129
    - text: is essentially zero, so we have extremely strong evidence that at least one of the media is associated with increased
    - code [ref=f6e819]: sales
    - text: .
  - paragraph [ref=f6e820]:
    - text: In (
    - link "3.23" [ref=f6e821] [cursor=pointer]:
      - /url: ch04.xhtml#b122
    - text: ) we are testing H
    - subscript [ref=f6e822]: "0"
    - text: that all the coefficients are zero. Sometimes we want to test that a particular subset of q of the coefficients are zero. This corresponds to a null hypothesis
  - 'img "H_0 : \\beta_{p-q+1} = \\beta_{p-q+2} = \\cdots = \\beta_p = 0," [ref=f6e824]'
  - paragraph [ref=f6e825]:
    - text: where for convenience we have put the variables chosen for omission at the end of the list. In this case we fit a second model that uses all the variables
    - emphasis [ref=f6e826]: except
    - text: those last q. Suppose that the residual sum of squares for that model is RSS
    - subscript [ref=f6e827]: "0"
    - text: . Then the appropriate F-statistic is
  - generic [ref=f6e828]:
    - 'img "F = \\frac{(\\mathrm{RSS}_0 - \\mathrm{RSS})/q}{\\mathrm{RSS}/(n-p-1)}." [ref=f6e829]'
    - text: (3.24)
  - paragraph [ref=f6e830]:
    - text: Notice that in Table
    - link "3.4" [ref=f6e831] [cursor=pointer]:
      - /url: ch04.xhtml#b108
    - text: ", for each individual predictor a t-statistic and a p-value were reported. These provide information about whether each individual predictor is related to the response, after adjusting for the other predictors. It turns out that each of these is exactly equivalent"
    - superscript [ref=f6e832]:
      - link "7" [ref=f6e833] [cursor=pointer]:
        - /url: ch04.xhtml#b137
    - text: to the Ftest that omits that single variable from the model, leaving all the others in—i.e. q=1 in (
    - link "3.24" [ref=f6e834] [cursor=pointer]:
      - /url: ch04.xhtml#b134
    - text: ). So it reports the
    - emphasis [ref=f6e835]: partial effect
    - text: of adding that variable to the model. For instance, as we discussed earlier, these p-values indicate that
    - code [ref=f6e836]: TV
    - text: and
    - code [ref=f6e837]: radio
    - text: are related to
    - code [ref=f6e838]: sales
    - text: ", but that there is no evidence that"
    - code [ref=f6e839]: newspaper
    - text: is associated with
    - code [ref=f6e840]: sales
    - text: ", when"
    - code [ref=f6e841]: TV
    - text: and
    - code [ref=f6e842]: radio
    - text: are held fixed.
  - paragraph [ref=f6e843]:
    - text: Given these individual p-values for each variable, why do we need to look at the overall F-statistic? After all, it seems likely that if any one of the p-values for the individual variables is very small, then
    - emphasis [ref=f6e844]: at least one of the predictors is related to the response
    - text: . However, this logic is flawed, especially when the number of predictors p is large.
  - complementary [ref=f6e845]:
    - superscript [ref=f6e846]: "6"
    - text: Even if the errors are not normally-distributed, the F-statistic approximately follows an F-distribution provided that the sample size n is large.
  - complementary [ref=f6e847]:
    - superscript [ref=f6e848]: "7"
    - text: The square of each t-statistic is the corresponding F-statistic.
  - paragraph [ref=f6e849]:
    - text: For instance, consider an example in which p = 100 and H
    - subscript [ref=f6e850]: "0"
    - text: ": β"
    - subscript [ref=f6e851]: "1"
    - text: = β
    - subscript [ref=f6e852]: "2"
    - text: = · · · = β
    - subscript [ref=f6e853]: p
    - text: = 0 is true, so no variable is truly associated with the response. In this situation, about 5 % of the p-values associated with each variable (of the type shown in Table
    - link "3.4" [ref=f6e854] [cursor=pointer]:
      - /url: ch04.xhtml#b108
    - text: ) will be below 0.05 by chance. In other words, we expect to see approximately five
    - emphasis [ref=f6e855]: small
    - text: p-values even in the absence of any true association between the predictors and the response.
    - superscript [ref=f6e856]:
      - link "8" [ref=f6e857] [cursor=pointer]:
        - /url: ch04.xhtml#b145
    - text: In fact, it is likely that we will observe at least one p-value below 0.05 by chance! Hence, if we use the individual t-statistics and associated p-values in order to decide whether or not there is any association between the variables and the response, there is a very high chance that we will incorrectly conclude that there is a relationship. However, the F-statistic does not suffer from this problem because it adjusts for the number of predictors. Hence, if H
    - subscript [ref=f6e858]: "0"
    - text: is true, there is only a 5 % chance that the F-statistic will result in a pvalue below 0.05, regardless of the number of predictors or the number of observations.
  - paragraph [ref=f6e859]:
    - text: The approach of using an F-statistic to test for any association between the predictors and the response works when p is relatively small, and certainly small compared to n. However, sometimes we have a very large number of variables. If p > n then there are more coefficients β
    - subscript [ref=f6e860]: j
    - text: to estimate than observations from which to estimate them. In this case we cannot even fit the multiple linear regression model using least squares, so the Fstatistic cannot be used, and neither can most of the other concepts that we have seen so far in this chapter. When p is large, some of the approaches discussed in the next section, such as
    - emphasis [ref=f6e861]: forward selection
    - text: ", can be used. This"
    - emphasis [ref=f6e862]: high-dimensional
    - text: setting is discussed in greater detail in Chapter
    - link "6" [ref=f6e863] [cursor=pointer]:
      - /url: ch07.xhtml#b0
    - text: .
  - paragraph [ref=f6e864]: highdimensional
  - 'heading "Two: Deciding on Important Variables" [level=4] [ref=f6e865]'
  - paragraph [ref=f6e866]:
    - text: As discussed in the previous section, the first step in a multiple regression analysis is to compute the F-statistic and to examine the associated pvalue. If we conclude on the basis of that p-value that at least one of the predictors is related to the response, then it is natural to wonder
    - emphasis [ref=f6e867]: which
    - text: are the guilty ones! We could look at the individual p-values as in Table
    - link "3.4" [ref=f6e868] [cursor=pointer]:
      - /url: ch04.xhtml#b108
    - text: ", but as discussed (and as further explored in Chapter"
    - link "13" [ref=f6e869] [cursor=pointer]:
      - /url: ch14.xhtml#b0
    - text: ), if p is large we are likely to make some false discoveries.
  - paragraph [ref=f6e870]:
    - text: It is possible that all of the predictors are associated with the response, but it is more often the case that the response is only associated with a subset of the predictors. The task of determining which predictors are associated with the response, in order to fit a single model involving only those predictors, is referred to as
    - emphasis [ref=f6e871]: variable selection
    - text: . The variable selection problem is studied extensively in Chapter
    - link "6" [ref=f6e872] [cursor=pointer]:
      - /url: ch07.xhtml#b0
    - text: ", and so here we will provide only a brief outline of some classical approaches."
  - paragraph [ref=f6e873]: variable selection
  - paragraph [ref=f6e874]:
    - text: "Ideally, we would like to perform variable selection by trying out a lot of different models, each containing a different subset of the predictors. For instance, if p = 2, then we can consider four models: (1) a model containing no variables, (2) a model containing X"
    - subscript [ref=f6e875]: "1"
    - text: only, (3) a model containing
  - complementary [ref=f6e876]:
    - superscript [ref=f6e877]: "8"
    - text: This is related to the important concept of
    - emphasis [ref=f6e878]: multiple testing
    - text: ", which is the focus of Chapter"
    - link "13" [ref=f6e879] [cursor=pointer]:
      - /url: ch14.xhtml#b0
    - text: .
  - paragraph [ref=f6e880]:
    - text: X
    - subscript [ref=f6e881]: "2"
    - text: only, and (4) a model containing both X
    - subscript [ref=f6e882]: "1"
    - text: and X
    - subscript [ref=f6e883]: "2"
    - text: . We can then select the
    - emphasis [ref=f6e884]: best
    - text: model out of all of the models that we have considered. How do we determine which model is best? Various statistics can be used to judge the quality of a model. These include
    - emphasis [ref=f6e885]: Mallow’s
    - text: C
    - subscript [ref=f6e886]: p
    - text: ","
    - emphasis [ref=f6e887]: Akaike information criterion
    - text: (AIC),
    - emphasis [ref=f6e888]: Bayesian information criterion
    - text: (BIC), and
    - emphasis [ref=f6e889]: adjusted
    - text: R
    - superscript [ref=f6e890]: "2"
    - text: . These are discussed in more detail in Chapter
    - link "6" [ref=f6e891] [cursor=pointer]:
      - /url: ch07.xhtml#b0
    - text: . We can also determine which model is best by plotting various model outputs, such as the residuals, in order to search for patterns.
  - paragraph [ref=f6e892]:
    - text: Mallow’s C
    - subscript [ref=f6e893]: p
    - text: · Akaike information criterion Bayesian information criterion adjusted R
    - superscript [ref=f6e894]: "2"
  - paragraph [ref=f6e895]:
    - text: Unfortunately, there are a total of 2
    - superscript [ref=f6e896]: p
    - text: models that contain subsets of p variables. This means that even for moderate p, trying out every possible subset of the predictors is infeasible. For instance, we saw that if p = 2, then there are 2
    - superscript [ref=f6e897]: "2"
    - text: = 4 models to consider. But if p = 30, then we must consider 2
    - superscript [ref=f6e898]: "30"
    - text: = 1,073,741,824 models! This is not practical. Therefore, unless p is very small, we cannot consider all 2
    - superscript [ref=f6e899]: p
    - text: "models, and instead we need an automated and efficient approach to choose a smaller set of models to consider. There are three classical approaches for this task: •"
    - emphasis [ref=f6e900]: Forward selection
    - text: . We begin with the
    - emphasis [ref=f6e901]: null model
    - text: —a model that contains an intercept but no predictors. We then fit p simple linear regressions and add to the null model the variable that results in the lowest RSS. We then add to that model the variable that results in the lowest RSS for the new two-variable model. This approach is continued until some stopping rule is satisfied. •
    - emphasis [ref=f6e902]: Backward selection
    - text: . We start with all variables in the model, and remove the variable with the largest p-value—that is, the variable that is the least statistically significant. The new (p − 1)-variable model is fit, and the variable with the largest p-value is removed. This procedure continues until a stopping rule is reached. For instance, we may stop when all remaining variables have a p-value below some threshold. •
    - emphasis [ref=f6e903]: Mixed selection
    - text: . This is a combination of forward and backward selection. We start with no variables in the model, and as with forward selection, we add the variable that provides the best fit. We continue to add variables one-by-one. Of course, as we noted with the
    - code [ref=f6e904]: Advertising
    - text: example, the p-values for variables can become larger as new predictors are added to the model. Hence, if at any point the p-value for one of the variables in the model rises above a certain threshold, then we remove that variable from the model. We continue to perform these forward and backward steps until all variables in the model have a sufficiently low p-value, and all variables outside the model would have a large p-value if added to the model. Backward selection cannot be used if p > n, while forward selection can always be used. Forward selection is a greedy approach, and might include variables early that later become redundant. Mixed selection can remedy this.
  - paragraph [ref=f6e905]: forward selection null model · backward selection · mixed selection
  - 'heading "Three: Model Fit" [level=4] [ref=f6e906]'
  - paragraph [ref=f6e907]:
    - text: Two of the most common numerical measures of model fit are the RSE and R
    - superscript [ref=f6e908]: "2"
    - text: ", the fraction of variance explained. These quantities are computed and interpreted in the same fashion as for simple linear regression."
  - paragraph [ref=f6e909]:
    - text: Recall that in simple regression, R
    - superscript [ref=f6e910]: "2"
    - text: is the square of the correlation of the response and the variable. In multiple linear regression, it turns out that it equals Cor
    - 'img "(Y, \\hat{Y} )^{2}" [ref=f6e911]'
    - text: ", the square of the correlation between the response and the fitted linear model; in fact one property of the fitted linear model is that it maximizes this correlation among all possible linear models."
  - paragraph [ref=f6e912]:
    - text: An R
    - superscript [ref=f6e913]: "2"
    - text: value close to 1 indicates that the model explains a large portion of the variance in the response variable. As an example, we saw in Table
    - link "3.6" [ref=f6e914] [cursor=pointer]:
      - /url: ch04.xhtml#b129
    - text: that for the
    - code [ref=f6e915]: Advertising
    - text: data, the model that uses all three advertising media to predict
    - code [ref=f6e916]: sales
    - text: has an R
    - superscript [ref=f6e917]: "2"
    - text: of 0.8972. On the other hand, the model that uses only
    - code [ref=f6e918]: TV
    - text: and
    - code [ref=f6e919]: radio
    - text: to predict
    - code [ref=f6e920]: sales
    - text: has an R
    - superscript [ref=f6e921]: "2"
    - text: value of 0.89719. In other words, there is a
    - emphasis [ref=f6e922]: small
    - text: increase in R
    - superscript [ref=f6e923]: "2"
    - text: if we include newspaper advertising in the model that already contains TV and radio advertising, even though we saw earlier that the p-value for newspaper advertising in Table
    - link "3.4" [ref=f6e924] [cursor=pointer]:
      - /url: ch04.xhtml#b108
    - text: is not significant. It turns out that R
    - superscript [ref=f6e925]: "2"
    - text: will always increase when more variables are added to the model, even if those variables are only weakly associated with the response. This is due to the fact that adding another variable always results in a decrease in the residual sum of squares on the training data (though not necessarily the testing data). Thus, the R
    - superscript [ref=f6e926]: "2"
    - text: statistic, which is also computed on the training data, must increase. The fact that adding newspaper advertising to the model containing only TV and radio advertising leads to just a tiny increase in R
    - superscript [ref=f6e927]: "2"
    - text: provides additional evidence that
    - code [ref=f6e928]: newspaper
    - text: can be dropped from the model. Essentially,
    - code [ref=f6e929]: newspaper
    - text: provides no real improvement in the model fit to the training samples, and its inclusion will likely lead to poor results on independent test samples due to overfitting.
  - paragraph [ref=f6e930]:
    - text: By contrast, the model containing only
    - code [ref=f6e931]: TV
    - text: as a predictor had an R
    - superscript [ref=f6e932]: "2"
    - text: of 0.61 (Table
    - link "3.2" [ref=f6e933] [cursor=pointer]:
      - /url: ch04.xhtml#b70
    - text: ). Adding
    - code [ref=f6e934]: radio
    - text: to the model leads to a substantial improvement in R
    - superscript [ref=f6e935]: "2"
    - text: . This implies that a model that uses TV and radio expenditures to predict sales is substantially better than one that uses only TV advertising. We could further quantify this improvement by looking at the p-value for the
    - code [ref=f6e936]: radio
    - text: coefficient in a model that contains only
    - code [ref=f6e937]: TV
    - text: and
    - code [ref=f6e938]: radio
    - text: as predictors.
  - paragraph [ref=f6e939]:
    - text: The model that contains only
    - code [ref=f6e940]: TV
    - text: and
    - code [ref=f6e941]: radio
    - text: as predictors has an RSE of 1.681, and the model that also contains
    - code [ref=f6e942]: newspaper
    - text: as a predictor has an RSE of 1.686 (Table
    - link "3.6" [ref=f6e943] [cursor=pointer]:
      - /url: ch04.xhtml#b129
    - text: ). In contrast, the model that contains only
    - code [ref=f6e944]: TV
    - text: has an RSE of 3.26 (Table
    - link "3.2" [ref=f6e945] [cursor=pointer]:
      - /url: ch04.xhtml#b70
    - text: ). This corroborates our previous conclusion that a model that uses TV and radio expenditures to predict sales is much more accurate (on the training data) than one that only uses TV spending. Furthermore, given that TV and radio expenditures are used as predictors, there is no point in also using newspaper spending as a predictor in the model. The observant reader may wonder how RSE can increase when
    - code [ref=f6e946]: newspaper
    - text: is added to the model given that RSS must decrease. In general RSE is defined as
  - generic [ref=f6e947]:
    - 'img "\\mathrm{RSE} = \\sqrt{\\frac{1}{n-p-1}\\mathrm{RSS}}," [ref=f6e948]'
    - text: (3.25)
  - generic [ref=f6e949]:
    - img "figure 3.5" [ref=f6e950]
    - paragraph [ref=f6e951]:
      - text: FIGURE 3.5.
      - emphasis [ref=f6e952]: For the
      - code [ref=f6e953]: Advertising
      - emphasis [ref=f6e954]: data, a linear regression fit to
      - code [ref=f6e955]: sales
      - emphasis [ref=f6e956]: using
      - code [ref=f6e957]: TV
      - emphasis [ref=f6e958]: and
      - code [ref=f6e959]: radio
      - emphasis [ref=f6e960]: as predictors. From the pattern of the residuals, we can see that there is a pronounced non-linear relationship in the data. The positive residuals (those visible above the surface), tend to lie along the 45-degree line, where TV and Radio budgets are split evenly. The negative residuals (most not visible), tend to lie away from this line, where budgets are more lopsided.
  - paragraph [ref=f6e961]:
    - text: which simplifies to (
    - link "3.15" [ref=f6e962] [cursor=pointer]:
      - /url: ch04.xhtml#b74
    - text: ) for a simple linear regression. Thus, models with more variables can have higher RSE if the decrease in RSS is small relative to the increase in p.
  - paragraph [ref=f6e963]:
    - text: In addition to looking at the RSE and R
    - superscript [ref=f6e964]: "2"
    - text: statistics just discussed, it can be useful to plot the data. Graphical summaries can reveal problems with a model that are not visible from numerical statistics. For example, Figure
    - link "3.5" [ref=f6e965] [cursor=pointer]:
      - /url: ch04.xhtml#b155
    - text: displays a three-dimensional plot of
    - code [ref=f6e966]: TV
    - text: and
    - code [ref=f6e967]: radio
    - text: versus
    - code [ref=f6e968]: sales
    - text: . We see that some observations lie above and some observations lie below the least squares regression plane. In particular, the linear model seems to overestimate
    - code [ref=f6e969]: sales
    - text: for instances in which most of the advertising money was spent exclusively on either
    - code [ref=f6e970]: TV
    - text: or
    - code [ref=f6e971]: radio
    - text: . It underestimates
    - code [ref=f6e972]: sales
    - text: for instances where the budget was split between the two media. This pronounced non-linear pattern suggests a
    - emphasis [ref=f6e973]: synergy
    - text: or
    - emphasis [ref=f6e974]: interaction
    - text: effect between the advertising media, whereby combining the media together results in a bigger boost to sales than using any single medium. In Section
    - link "3.3.2" [ref=f6e975] [cursor=pointer]:
      - /url: ch04.xhtml#b204
    - text: ", we will discuss extending the linear model to accommodate such synergistic effects through the use of interaction terms."
  - paragraph [ref=f6e976]: interaction
  - 'heading "Four: Predictions" [level=4] [ref=f6e977]'
  - paragraph [ref=f6e978]:
    - text: Once we have fit the multiple regression model, it is straightforward to apply (
    - link "3.21" [ref=f6e979] [cursor=pointer]:
      - /url: ch04.xhtml#b100
    - text: ) in order to predict the response Y on the basis of a set of values for the predictors X
    - subscript [ref=f6e980]: "1"
    - text: ", X"
    - subscript [ref=f6e981]: "2"
    - text: ", . . . , X"
    - subscript [ref=f6e982]: p
    - text: . However, there are three sorts of uncertainty associated with this prediction.
  - paragraph [ref=f6e983]:
    - text: 1. The coefficient estimates
    - 'img "\\hat{\\beta}_{0}, \\hat{\\beta}_{1}, . . . , \\hat{\\beta}_{p}" [ref=f6e984]'
    - text: are estimates for β
    - subscript [ref=f6e985]: "0"
    - text: ", β"
    - subscript [ref=f6e986]: "1"
    - text: ", . . . , β"
    - subscript [ref=f6e987]: p
    - text: . That is, the
    - emphasis [ref=f6e988]: least squares plane
  - 'img "\\hat{Y} = \\hat{\\beta}_0 + \\hat{\\beta}_1 X_1 + \\cdots + \\hat{\\beta}_p X_p" [ref=f6e990]'
  - paragraph [ref=f6e991]:
    - text: is only an estimate for the
    - emphasis [ref=f6e992]: true population regression plane
  - img "f(X) = \\beta_0 + \\beta_1 X_1 + \\cdots + \\beta_p X_p." [ref=f6e994]
  - paragraph [ref=f6e995]:
    - text: The inaccuracy in the coefficient estimates is related to the
    - emphasis [ref=f6e996]: reducible error
    - text: from Chapter
    - link "2" [ref=f6e997] [cursor=pointer]:
      - /url: ch03.xhtml#b0
    - text: . We can compute a
    - emphasis [ref=f6e998]: confidence interval
    - text: in order to determine how close
    - 'img "\\hat{Y}" [ref=f6e999]'
    - text: will be to f(X).
  - paragraph [ref=f6e1000]:
    - text: 2. Of course, in practice assuming a linear model for f(X) is almost always an approximation of reality, so there is an additional source of potentially reducible error which we call
    - emphasis [ref=f6e1001]: model bias
    - text: . So when we use a linear model, we are in fact estimating the best linear approximation to the true surface. However, here we will ignore this discrepancy, and operate as if the linear model were correct.
  - paragraph [ref=f6e1002]:
    - text: 3. Even if we knew f(X)—that is, even if we knew the true values for β
    - subscript [ref=f6e1003]: "0"
    - text: ", β"
    - subscript [ref=f6e1004]: "1"
    - text: ", . . . , β"
    - subscript [ref=f6e1005]: p
    - text: —the response value cannot be predicted perfectly because of the random error ϵ in the model (
    - link "3.20" [ref=f6e1006] [cursor=pointer]:
      - /url: ch04.xhtml#b98
    - text: ). In Chapter
    - link "2" [ref=f6e1007] [cursor=pointer]:
      - /url: ch03.xhtml#b0
    - text: ", we referred to this as the"
    - emphasis [ref=f6e1008]: irreducible error
    - text: . How much will Y vary from
    - 'img "\\hat{Y}" [ref=f6e1009]'
    - text: "? We use"
    - emphasis [ref=f6e1010]: prediction intervals
    - text: to answer this question. Prediction intervals are always wider than confidence intervals, because they incorporate both the error in the estimate for f(X) (the reducible error) and the uncertainty as to how much an individual point will differ from the population regression plane (the irreducible error).
  - paragraph [ref=f6e1011]:
    - text: We use a
    - emphasis [ref=f6e1012]: confidence interval
    - text: to quantify the uncertainty surrounding the
    - emphasis [ref=f6e1013]: average
    - code [ref=f6e1014]: sales
    - text: over a large number of cities. For example, given that $100,000 is spent on
    - code [ref=f6e1015]: TV
    - text: advertising and $20,000 is spent on
    - code [ref=f6e1016]: radio
    - text: advertising in each city, the 95 % confidence interval is [10,985, 11,528]. We interpret this to mean that 95 % of intervals of this form will contain the true value of f(X).
    - superscript [ref=f6e1017]:
      - link "9" [ref=f6e1018] [cursor=pointer]:
        - /url: ch04.xhtml#b168
    - text: On the other hand, a
    - emphasis [ref=f6e1019]: prediction interval
    - text: can be used to quantify the uncertainty surrounding
    - code [ref=f6e1020]: sales
    - text: for a
    - emphasis [ref=f6e1021]: particular
    - text: city. Given that $100,000 is spent on
    - code [ref=f6e1022]: TV
    - text: advertising and $20,000 is spent on
    - code [ref=f6e1023]: radio
    - text: advertising in that city the 95 % prediction interval is [7,930, 14,580]. We interpret this to mean that 95 % of intervals of this form will contain the true value of Y for this city. Note that both intervals are centered at 11,256, but that the prediction interval is substantially wider than the confidence interval, reflecting the increased uncertainty about
    - code [ref=f6e1024]: sales
    - text: for a given city in comparison to the average
    - code [ref=f6e1025]: sales
    - text: over many locations.
  - paragraph [ref=f6e1026]: confidence interval · prediction interval
  - complementary [ref=f6e1027]:
    - superscript [ref=f6e1028]: "9"
    - text: In other words, if we collect a large number of data sets like the
    - code [ref=f6e1029]: Advertising
    - text: data set, and we construct a confidence interval for the average
    - code [ref=f6e1030]: sales
    - text: on the basis of each data set (given $100,000 in
    - code [ref=f6e1031]: TV
    - text: and $20,000 in
    - code [ref=f6e1032]: radio
    - text: advertising), then 95 % of these confidence intervals will contain the true value of average
    - code [ref=f6e1033]: sales
    - text: .
  - heading "3.3 Other Considerations in the Regression Model" [level=2] [ref=f6e1034]
  - heading "3.3.1 Qualitative Predictors" [level=3] [ref=f6e1035]
  - paragraph [ref=f6e1036]:
    - text: In our discussion so far, we have assumed that all variables in our linear regression model are
    - emphasis [ref=f6e1037]: quantitative
    - text: . But in practice, this is not necessarily the case; often some predictors are
    - emphasis [ref=f6e1038]: qualitative
    - text: .
  - paragraph [ref=f6e1039]:
    - text: For example, the
    - code [ref=f6e1040]: Credit
    - text: data set displayed in Figure
    - link "3.6" [ref=f6e1041] [cursor=pointer]:
      - /url: ch04.xhtml#b181
    - text: records variables for a number of credit card holders. The response is
    - code [ref=f6e1042]: balance
    - text: "(average credit card debt for each individual) and there are several quantitative predictors:"
    - code [ref=f6e1043]: age
    - text: ","
    - code [ref=f6e1044]: cards
    - text: (number of credit cards),
    - code [ref=f6e1045]: education
    - text: (years of education),
    - code [ref=f6e1046]: income
    - text: (in thousands of dollars),
    - code [ref=f6e1047]: limit
    - text: (credit limit), and
    - code [ref=f6e1048]: rating
    - text: (credit rating). Each panel of Figure
    - link "3.6" [ref=f6e1049] [cursor=pointer]:
      - /url: ch04.xhtml#b181
    - text: is a scatterplot for a pair of variables whose identities are given by the corresponding row and column labels. For example, the scatterplot directly to the right of the word “Balance” depicts
    - code [ref=f6e1050]: balance
    - text: versus
    - code [ref=f6e1051]: age
    - text: ", while the plot directly to the right of “Age” corresponds to"
    - code [ref=f6e1052]: age
    - text: versus
    - code [ref=f6e1053]: cards
    - text: ". In addition to these quantitative variables, we also have four qualitative variables:"
    - code [ref=f6e1054]: own
    - text: (house ownership),
    - code [ref=f6e1055]: student
    - text: (student status),
    - code [ref=f6e1056]: status
    - text: (marital status), and
    - code [ref=f6e1057]: region
    - text: (East, West or South).
  - heading "Predictors with Only Two Levels" [level=4] [ref=f6e1058]
  - paragraph [ref=f6e1059]:
    - text: Suppose that we wish to investigate differences in credit card balance between those who own a house and those who don’t, ignoring the other variables for the moment. If a qualitative predictor (also known as a
    - emphasis [ref=f6e1060]: factor
    - text: ) only has two
    - emphasis [ref=f6e1061]: levels
    - text: ", or possible values, then incorporating it into a regression model is very simple. We simply create an indicator or"
    - emphasis [ref=f6e1062]: dummy variable
    - text: that takes on two possible numerical values.
    - superscript [ref=f6e1063]:
      - link "10" [ref=f6e1064] [cursor=pointer]:
        - /url: ch04.xhtml#b180
    - text: For example, based on the
    - code [ref=f6e1065]: own
    - text: variable, we can create a new variable that takes the form
  - paragraph [ref=f6e1066]: factor level dummy variable
  - generic [ref=f6e1067]:
    - 'img "x_i = \\begin{cases} 1 & \\text{if } i\\text{th person owns a house} \\\\ 0 & \\text{if } i\\text{th person does not own a house,} \\end{cases}" [ref=f6e1068]'
    - text: (3.26)
  - paragraph [ref=f6e1069]: and use this variable as a predictor in the regression equation. This results in the model
  - generic [ref=f6e1070]:
    - 'img "y_i = \\beta_0 + \\beta_1 x_i + \\epsilon_i = \\begin{cases} \\beta_0 + \\beta_1 + \\epsilon_i & \\text{if } i\\text{th person owns a house} \\\\ \\beta_0 + \\epsilon_i & \\text{if } i\\text{th person does not.} \\end{cases}" [ref=f6e1071]'
    - text: (3.27)
  - paragraph [ref=f6e1072]:
    - text: Now β
    - subscript [ref=f6e1073]: "0"
    - text: can be interpreted as the average credit card balance among those who do not own, β
    - subscript [ref=f6e1074]: "0"
    - text: + β
    - subscript [ref=f6e1075]: "1"
    - text: as the average credit card balance among those who do own their house, and β
    - subscript [ref=f6e1076]: "1"
    - text: as the average difference in credit card balance between owners and non-owners.
  - paragraph [ref=f6e1077]:
    - text: Table
    - link "3.7" [ref=f6e1078] [cursor=pointer]:
      - /url: ch04.xhtml#b188
    - text: displays the coefficient estimates and other information associated with the model (
    - link "3.27" [ref=f6e1079] [cursor=pointer]:
      - /url: ch04.xhtml#b177
    - text: ). The average credit card debt for non-owners is estimated to be $509.80, whereas owners are estimated to carry $19.73 in additional debt for a total of $509.80 + $19.73 = $529.53. However, we
  - complementary [ref=f6e1080]:
    - superscript [ref=f6e1081]: "10"
    - text: In the machine learning community, the creation of dummy variables to handle qualitative predictors is known as “one-hot encoding”.
  - generic [ref=f6e1082]:
    - img "figure 3.6" [ref=f6e1083]
    - paragraph [ref=f6e1084]:
      - text: FIGURE 3.6.
      - emphasis [ref=f6e1085]: The
      - code [ref=f6e1086]: Credit
      - emphasis [ref=f6e1087]: data set contains information about
      - code [ref=f6e1088]: balance
      - emphasis [ref=f6e1089]: ","
      - code [ref=f6e1090]: age
      - emphasis [ref=f6e1091]: ","
      - code [ref=f6e1092]: cards
      - emphasis [ref=f6e1093]: ","
      - code [ref=f6e1094]: education
      - emphasis [ref=f6e1095]: ","
      - code [ref=f6e1096]: income
      - emphasis [ref=f6e1097]: ","
      - code [ref=f6e1098]: limit
      - emphasis [ref=f6e1099]: ", and"
      - code [ref=f6e1100]: rating
      - emphasis [ref=f6e1101]: for a number of potential cus- tomers.
  - paragraph [ref=f6e1102]: notice that the p-value for the dummy variable is very high. This indicates that there is no statistical evidence of a difference in average credit card balance based on house ownership.
  - paragraph [ref=f6e1103]:
    - text: The decision to code owners as 1 and non-owners as 0 in (
    - link "3.27" [ref=f6e1104] [cursor=pointer]:
      - /url: ch04.xhtml#b177
    - text: ) is arbitrary, and has no effect on the regression fit, but does alter the interpretation of the coefficients. If we had coded non-owners as 1 and owners as 0, then the estimates for β
    - subscript [ref=f6e1105]: "0"
    - text: and β
    - subscript [ref=f6e1106]: "1"
    - text: would have been 529.53 and −19.73, respectively, leading once again to a prediction of credit card debt of $529.53 − $19.73 = $509.80 for non-owners and a prediction of $529.53 for owners. Alternatively, instead of a 0/1 coding scheme, we could create a dummy variable
  - 'img "x_i = \\begin{cases} 1 & \\text{if } i\\text{th person owns a house} \\\\ -1 & \\text{if } i\\text{th person does not own a house} \\end{cases}" [ref=f6e1108]'
  - paragraph [ref=f6e1109]: and use this variable in the regression equation. This results in the model
  - 'img "\\begin{cases} \\beta_0 + \\beta_1 + \\epsilon_i & \\text{if } i\\text{th person owns a house} \\end{cases}" [ref=f6e1111]'
  - paragraph [ref=f6e1112]:
    - text: "y"
    - subscript [ref=f6e1113]: i
    - text: = β
    - subscript [ref=f6e1114]: "0"
    - text: +β
    - subscript [ref=f6e1115]: "1"
    - text: x
    - subscript [ref=f6e1116]: i
    - text: +ϵ
    - subscript [ref=f6e1117]: i
    - text: = β
    - subscript [ref=f6e1118]: "0"
    - text: − β
    - subscript [ref=f6e1119]: "1"
    - text: + ϵ
    - subscript [ref=f6e1120]: i
    - text: if ith person does not own a house.
  - generic [ref=f6e1121]:
