      - emphasis [ref=f6e1231]: Least squares coefficient estimates associated with the regression of
  - paragraph [ref=f6e1232]:
    - code [ref=f6e1233]: balance
    - emphasis [ref=f6e1234]: onto
    - code [ref=f6e1235]: region
    - emphasis [ref=f6e1236]: in the
    - code [ref=f6e1237]: Credit
    - emphasis [ref=f6e1238]: data set. The linear model is given in (
    - link [ref=f6e1239] [cursor=pointer]:
      - /url: ch04.xhtml#b196
      - emphasis [ref=f6e1240]: "3.30"
    - emphasis [ref=f6e1241]: ). That is, region is encoded via two dummy variables (
    - link [ref=f6e1242] [cursor=pointer]:
      - /url: ch04.xhtml#b192
      - emphasis [ref=f6e1243]: "3.28"
    - emphasis [ref=f6e1244]: ) and (
    - link [ref=f6e1245] [cursor=pointer]:
      - /url: ch04.xhtml#b193
      - emphasis [ref=f6e1246]: "3.29"
    - emphasis [ref=f6e1247]: ).
  - paragraph [ref=f6e1248]:
    - text: From Table
    - link "3.8" [ref=f6e1249] [cursor=pointer]:
      - /url: ch04.xhtml#b199
    - text: ", we see that the estimated"
    - code [ref=f6e1250]: balance
    - text: for the baseline, East, is $531.00. It is estimated that those in the South will have $18.69 less debt than those in the East, and that those in the West will have $12.50 less debt than those in the East. However, the p-values associated with the coefficient estimates for the two dummy variables are very large, suggesting no statistical evidence of a real difference in average credit card balance between South and East or between West and East.
    - superscript [ref=f6e1251]:
      - link "12" [ref=f6e1252] [cursor=pointer]:
        - /url: ch04.xhtml#b206
    - text: Once again, the level selected as the baseline category is arbitrary, and the final predictions for each group will be the same regardless of this choice. However, the coefficients and their p-values do depend on the choice of dummy variable coding. Rather than rely on the individual coefficients, we can use an F-test to test H
    - subscript [ref=f6e1253]: "0"
    - text: ": β"
    - subscript [ref=f6e1254]: "1"
    - text: = β
    - subscript [ref=f6e1255]: "2"
    - text: = 0; this does not depend on the coding. This F-test has a p-value of 0.96, indicating that we cannot reject the null hypothesis that there is no relationship between
    - code [ref=f6e1256]: balance
    - text: and
    - code [ref=f6e1257]: region
    - text: .
  - paragraph [ref=f6e1258]:
    - text: Using this dummy variable approach presents no difficulties when incorporating both quantitative and qualitative predictors. For example, to regress
    - code [ref=f6e1259]: balance
    - text: on both a quantitative variable such as
    - code [ref=f6e1260]: income
    - text: and a qualitative variable such as
    - code [ref=f6e1261]: student
    - text: ", we must simply create a dummy variable for"
    - code [ref=f6e1262]: student
    - text: and then fit a multiple regression model using
    - code [ref=f6e1263]: income
    - text: and the dummy variable as predictors for credit card balance.
  - paragraph [ref=f6e1264]:
    - text: There are many different ways of coding qualitative variables besides the dummy variable approach taken here. All of these approaches lead to equivalent model fits, but the coefficients are different and have different interpretations, and are designed to measure particular
    - emphasis [ref=f6e1265]: contrasts
    - text: . This topic is beyond the scope of the book.
  - paragraph [ref=f6e1266]: contrast
  - heading "3.3.2 Extensions of the Linear Model" [level=3] [ref=f6e1267]
  - paragraph [ref=f6e1268]:
    - text: The standard linear regression model (
    - link "3.19" [ref=f6e1269] [cursor=pointer]:
      - /url: ch04.xhtml#b96
    - text: ) provides interpretable results and works quite well on many real-world problems. However, it makes several highly restrictive assumptions that are often violated in practice. Two of the most important assumptions state that the relationship between the predictors and response are
    - emphasis [ref=f6e1270]: additive
    - text: and
    - emphasis [ref=f6e1271]: linear
    - text: . The additivity assumption means that the association between a predictor X
    - subscript [ref=f6e1272]: j
    - text: and the response Y does not depend on the values of the other predictors. The linearity assumption states that the change in the response Y associated with a one-unit change in X
    - subscript [ref=f6e1273]: j
    - text: is constant, regardless of the value of X
    - subscript [ref=f6e1274]: j
    - text: . In later chapters of this book, we examine a number of sophisticated methods that relax these two
  - paragraph [ref=f6e1275]: additive · linear
  - complementary [ref=f6e1276]:
    - superscript [ref=f6e1277]: "12"
    - text: There could still in theory be a difference between South and West, although the data here does not suggest any difference.
  - paragraph [ref=f6e1278]: assumptions. Here, we briefly examine some common classical approaches for extending the linear model.
  - heading "Removing the Additive Assumption" [level=4] [ref=f6e1279]
  - paragraph [ref=f6e1280]:
    - text: In our previous analysis of the
    - code [ref=f6e1281]: Advertising
    - text: data, we concluded that both
    - code [ref=f6e1282]: TV
    - text: and
    - code [ref=f6e1283]: radio
    - text: seem to be associated with
    - code [ref=f6e1284]: sales
    - text: . The linear models that formed the basis for this conclusion assumed that the effect on
    - code [ref=f6e1285]: sales
    - text: of increasing one advertising medium is independent of the amount spent on the other media. For example, the linear model (
    - link "3.20" [ref=f6e1286] [cursor=pointer]:
      - /url: ch04.xhtml#b98
    - text: ) states that the average increase in
    - code [ref=f6e1287]: sales
    - text: associated with a one-unit increase in
    - code [ref=f6e1288]: TV
    - text: is always β
    - subscript [ref=f6e1289]: "1"
    - text: ", regardless of the amount spent on"
    - code [ref=f6e1290]: radio
    - text: .
  - paragraph [ref=f6e1291]:
    - text: However, this simple model may be incorrect. Suppose that spending money on radio advertising actually increases the effectiveness of TV advertising, so that the slope term for
    - code [ref=f6e1292]: TV
    - text: should increase as
    - code [ref=f6e1293]: radio
    - text: increases. In this situation, given a fixed budget of $100,000, spending half on
    - code [ref=f6e1294]: radio
    - text: and half on
    - code [ref=f6e1295]: TV
    - text: may increase
    - code [ref=f6e1296]: sales
    - text: more than allocating the entire amount to either
    - code [ref=f6e1297]: TV
    - text: or to
    - code [ref=f6e1298]: radio
    - text: . In marketing, this is known as a
    - emphasis [ref=f6e1299]: synergy
    - text: effect, and in statistics it is referred to as an
    - emphasis [ref=f6e1300]: interaction
    - text: effect. Figure
    - link "3.5" [ref=f6e1301] [cursor=pointer]:
      - /url: ch04.xhtml#b155
    - text: suggests that such an effect may be present in the advertising data. Notice that when levels of either
    - code [ref=f6e1302]: TV
    - text: or
    - code [ref=f6e1303]: radio
    - text: are low, then the true
    - code [ref=f6e1304]: sales
    - text: are lower than predicted by the linear model. But when advertising is split between the two media, then the model tends to underestimate
    - code [ref=f6e1305]: sales
    - text: .
  - paragraph [ref=f6e1306]: Consider the standard linear regression model with two variables,
  - img "Y = \\beta_0 + \\beta_1 X_1 + \\beta_2 X_2 + \\epsilon." [ref=f6e1308]
  - paragraph [ref=f6e1309]:
    - text: According to this model, a one-unit increase in X
    - subscript [ref=f6e1310]: "1"
    - text: is associated with an average increase in Y of β
    - subscript [ref=f6e1311]: "1"
    - text: units. Notice that the presence of X
    - subscript [ref=f6e1312]: "2"
    - text: does not alter this statement—that is, regardless of the value of X
    - subscript [ref=f6e1313]: "2"
    - text: ", a oneunit increase in X"
    - subscript [ref=f6e1314]: "1"
    - text: is associated with a β
    - subscript [ref=f6e1315]: "1"
    - text: "-unit increase in Y . One way of extending this model is to include a third predictor, called an"
    - emphasis [ref=f6e1316]: interaction term
    - text: ", which is constructed by computing the product of X"
    - subscript [ref=f6e1317]: "1"
    - text: and X
    - subscript [ref=f6e1318]: "2"
    - text: . This results in the model
  - generic [ref=f6e1319]:
    - img "Y = \\beta_0 + \\beta_1 X_1 + \\beta_2 X_2 + \\beta_3 X_1 X_2 + \\epsilon." [ref=f6e1320]
    - text: (3.31)
  - paragraph [ref=f6e1321]:
    - text: How does inclusion of this interaction term relax the additive assumption? Notice that (
    - link "3.31" [ref=f6e1322] [cursor=pointer]:
      - /url: ch04.xhtml#b214
    - text: ) can be rewritten as
  - generic [ref=f6e1323]:
    - 'img "\\begin{aligned} Y &= \\beta_0 + (\\beta_1 + \\beta_3 X_2)X_1 + \\beta_2 X_2 + \\epsilon \\\\ &= \\beta_0 + \\tilde{\\beta}_1 X_1 + \\beta_2 X_2 + \\epsilon \\end{aligned}" [ref=f6e1324]'
    - text: (3.32)
  - paragraph [ref=f6e1325]:
    - text: where
    - 'img "\\tilde{\\beta}_{1} = \\beta_{1} + \\beta_{3}X_{2}" [ref=f6e1326]'
    - text: . Since
    - 'img "\\tilde{\\beta}_{1}" [ref=f6e1327]'
    - text: is now a function of X
    - subscript [ref=f6e1328]: "2"
    - text: ", the association between X"
    - subscript [ref=f6e1329]: "1"
    - text: "and Y is no longer constant: a change in the value of X"
    - subscript [ref=f6e1330]: "2"
    - text: will change the association between X
    - subscript [ref=f6e1331]: "1"
    - text: and Y . A similar argument shows that a change in the value of X
    - subscript [ref=f6e1332]: "1"
    - text: changes the association between X
    - subscript [ref=f6e1333]: "2"
    - text: and Y .
