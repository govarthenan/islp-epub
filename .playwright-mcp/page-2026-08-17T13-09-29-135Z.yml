          - rowheader [ref=f6e1210]:
            - code [ref=f6e1211]: Intercept
          - cell "531.00" [ref=f6e1212]
          - cell "46.32" [ref=f6e1213]
          - cell "11.464" [ref=f6e1214]
          - cell "< 0.0001" [ref=f6e1215]
