          - rowheader [ref=f6e1217]:
            - code [ref=f6e1218]: region[South]
          - cell "−12.50" [ref=f6e1219]
          - cell "56.68" [ref=f6e1220]
          - cell "−0.221" [ref=f6e1221]
          - cell "0.8260" [ref=f6e1222]
