- generic [active] [ref=f6e1]:
  - heading "Chapter 3 Linear Regression" [level=1] [ref=f6e2]:
    - generic [ref=f6e3]: Chapter 3
    - text: Linear Regression
  - paragraph [ref=f6e4]:
    - text: This chapter is about
    - emphasis [ref=f6e5]: linear regression
    - text: ", a very simple approach for supervised learning. In particular, linear regression is a useful tool for predicting a quantitative response. It has been around for a long time and is the topic of innumerable textbooks. Though it may seem somewhat dull compared to some of the more modern statistical learning approaches described in later chapters of this book, linear regression is still a useful and widely used statistical learning method. Moreover, it serves as a good jumping-off point for newer approaches: as we will see in later chapters, many fancy statistical learning approaches can be seen as generalizations or extensions of linear regression. Consequently, the importance of having a good understanding of linear regression before studying more complex learning methods cannot be overstated. In this chapter, we review some of the key ideas underlying the linear regression model, as well as the least squares approach that is most commonly used to fit this model."
  - paragraph [ref=f6e6]:
    - text: Recall the
    - code [ref=f6e7]: Advertising
    - text: data from Chapter
    - link "2" [ref=f6e8] [cursor=pointer]:
      - /url: ch03.xhtml#b0
    - text: . Figure
    - link "2.1" [ref=f6e9] [cursor=pointer]:
      - /url: ch03.xhtml#b6
    - text: displays
    - code [ref=f6e10]: sales
    - text: (in thousands of units) for a particular product as a function of advertising budgets (in thousands of dollars) for
    - code [ref=f6e11]: TV
    - text: ","
    - code [ref=f6e12]: radio
    - text: ", and"
    - code [ref=f6e13]: newspaper
    - text: "media. Suppose that in our role as statistical consultants we are asked to suggest, on the basis of this data, a marketing plan for next year that will result in high product sales. What information would be useful in order to provide such a recommendation? Here are a few important questions that we might seek to address:"
  - paragraph [ref=f6e14]:
    - text: "1."
    - emphasis [ref=f6e15]: Is there a relationship between advertising budget and sales?
    - text: Our first goal should be to determine whether the data provide evidence of an association between advertising expenditure and sales. If the evidence is weak, then one might argue that no money should be spent on advertising!
  - paragraph [ref=f6e16]:
    - text: "2."
    - emphasis [ref=f6e17]: How strong is the relationship between advertising budget and sales?
    - text: Assuming that there is a relationship between advertising and sales, we would like to know the strength of this relationship. Does knowledge of the advertising budget provide a lot of information about product sales?
  - paragraph [ref=f6e18]:
    - text: "3."
    - emphasis [ref=f6e19]: Which media are associated with sales?
    - text: Are all three media—TV, radio, and newspaper—associated with sales, or are just one or two of the media associated? To answer this question, we must find a way to separate out the individual contribution of each medium to sales when we have spent money on all three media.
  - paragraph [ref=f6e20]:
    - text: "4."
    - emphasis [ref=f6e21]: How large is the association between each medium and sales?
    - text: For every dollar spent on advertising in a particular medium, by what amount will sales increase? How accurately can we predict this amount of increase?
  - paragraph [ref=f6e22]:
    - text: "5."
    - emphasis [ref=f6e23]: How accurately can we predict future sales?
    - text: For any given level of television, radio, or newspaper advertising, what is our prediction for sales, and what is the accuracy of this prediction?
  - paragraph [ref=f6e24]:
    - text: "6."
    - emphasis [ref=f6e25]: Is the relationship linear?
    - text: If there is approximately a straight-line relationship between advertising expenditure in the various media and sales, then linear regression is an appropriate tool. If not, then it may still be possible to transform the predictor or the response so that linear regression can be used.
  - paragraph [ref=f6e26]:
    - text: "7."
    - emphasis [ref=f6e27]: Is there synergy among the advertising media?
    - text: Perhaps spending $50,000 on television advertising and $50,000 on radio advertising is associated with higher sales than allocating $100,000 to either television or radio individually. In marketing, this is known as a
    - emphasis [ref=f6e28]: synergy
    - text: effect, while in statistics it is called an
    - emphasis [ref=f6e29]: interaction
    - text: effect. It turns out that linear regression can be used to answer each of these questions. We will first discuss all of these questions in a g
    - link "ene" [ref=f6e30] [cursor=pointer]:
      - /url: ch04.xhtml#b306
    - text: ral context, and then return to them in this specific context in Section
    - link "3.4" [ref=f6e31] [cursor=pointer]:
      - /url: ch04.xhtml#b306
    - text: .
  - paragraph [ref=f6e32]: synergy interaction
  - heading "3.1 Simple Linear Regression" [level=2] [ref=f6e33]
  - paragraph [ref=f6e34]:
    - emphasis [ref=f6e35]: Simple linear regression
    - text: "lives up to its name: it is a very straightforward approach for predicting a quantitative response Y on the basis of a single predictor variable X. It assumes that there is approximately a linear relationship between X and Y . Mathematically, we can write this linear relationship as"
  - paragraph [ref=f6e36]: simple linear regression
  - generic [ref=f6e37]:
    - img "Y \\approx \\beta_0 + \\beta_1 X." [ref=f6e38]
    - text: (3.1)
  - paragraph [ref=f6e39]:
    - text: You migh
    - link "t re" [ref=f6e40] [cursor=pointer]:
