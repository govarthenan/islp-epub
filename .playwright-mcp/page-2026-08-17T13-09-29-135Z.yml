  - paragraph [ref=f6e2210]: to that of KNN for low values of K. However, for K ≥ 4, KNN outperforms linear regression. The second row illustrates a more substantial deviation from linearity. In this situation, KNN substantially outperforms linear regression for all values of K. Note that as the extent of non-linearity increases, there is little change in the test set MSE for the non-parametric KNN method, but there is a large increase in the test set MSE of linear regression.
  - paragraph [ref=f6e2211]:
    - text: Figures
    - link "3.18" [ref=f6e2212] [cursor=pointer]:
      - /url: ch04.xhtml#b328
    - text: and
    - link "3.19" [ref=f6e2213] [cursor=pointer]:
      - /url: ch04.xhtml#b329
    - text: display situations in which KNN performs slightly worse than linear regression when the relationship is linear, but much better than linear regression for nonlinear situations. In a real life situation in which the true relationship is unknown, one might suspect that KNN should be favored over linear regression because it will at worst be slightly inferior to linear regression if the true relationship is linear, and may give substantially better results if the true relationship is non-linear. But in reality, even when the true relationship is highly non-linear, KNN may still provide inferior results to linear regression. In particular, both Figures
    - link "3.18" [ref=f6e2214] [cursor=pointer]:
      - /url: ch04.xhtml#b328
