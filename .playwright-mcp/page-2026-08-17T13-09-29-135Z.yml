      - code [ref=f6e1881]: balance
      - emphasis [ref=f6e1882]: onto
      - code [ref=f6e1883]: age
      - emphasis [ref=f6e1884]: and
      - code [ref=f6e1885]: limit
      - emphasis [ref=f6e1886]: . The minimum value is well defined.
      - text: "Right:"
      - emphasis [ref=f6e1887]: A contour plot of RSS for the regression of
      - code [ref=f6e1888]: balance
      - emphasis [ref=f6e1889]: onto
      - code [ref=f6e1890]: rating
      - emphasis [ref=f6e1891]: and
      - code [ref=f6e1892]: limit
      - emphasis [ref=f6e1893]: . Because of the collinearity, there are many pairs
      - text: (β
      - subscript [ref=f6e1894]: Limit
      - text: ", β"
      - subscript [ref=f6e1895]: Rating
      - text: )
      - emphasis [ref=f6e1896]: with a similar value for RSS.
  - paragraph [ref=f6e1897]:
    - text: that correspond to the same RSS, with ellipses nearest to the center taking on the lowest values of RSS. The black dots and associated dashed lines represent the coefficient estimates that result in the smallest possible RSS—in other words, these are the least squares estimates. The axes for
    - code [ref=f6e1898]: limit
    - text: and
    - code [ref=f6e1899]: age
    - text: have been scaled so that the plot includes possible coefficient estimates that are up to four standard errors on either side of the least squares estimates. Thus the plot includes all plausible values for the coefficients. For example, we see that the true
    - code [ref=f6e1900]: limit
    - text: coefficient is almost certainly somewhere between 0.15 and 0.20.
  - paragraph [ref=f6e1901]:
    - text: In contrast, the right-hand panel of Figure
    - link "3.15" [ref=f6e1902] [cursor=pointer]:
      - /url: ch04.xhtml#b294
    - text: displays contour plots of the RSS associated with possible coefficient estimates for the regression of
    - code [ref=f6e1903]: balance
    - text: onto
    - code [ref=f6e1904]: limit
    - text: and
    - code [ref=f6e1905]: rating
    - text: ", which we know to be highly collinear. Now the contours run along a narrow valley; there is a broad range of values for the coefficient estimates that result in equal values for RSS. Hence a small change in the data could cause the pair of coefficient values that yield the smallest RSS—that is, the least squares estimates—to move anywhere along this valley. This results in a great deal of uncertainty in the coefficient estimates. Notice that the scale for the"
    - code [ref=f6e1906]: limit
    - text: coefficient now runs from roughly −0.2 to 0.2; this is an eight-fold increase over the plausible range of the
    - code [ref=f6e1907]: limit
    - text: coefficient in the regression with
    - code [ref=f6e1908]: age
    - text: . Interestingly, even though the
    - code [ref=f6e1909]: limit
    - text: and
    - code [ref=f6e1910]: rating
    - text: coefficients now have much more individual uncertainty, they will almost certainly lie somewhere in this contour valley. For example, we would not expect the true value of the
    - code [ref=f6e1911]: limit
    - text: and
    - code [ref=f6e1912]: rating
    - text: coefficients to be −0.1 and 1 respectively, even though such a value is plausible for each coefficient individually.
  - paragraph [ref=f6e1913]:
    - text: Since collinearity reduces the accuracy of the estimates of the regression coefficients, it causes the standard error for
    - 'img "\\hat{\\beta}_{j}" [ref=f6e1914]'
    - text: to grow. Recall that the t-statistic for each predictor is calculated by dividing
    - 'img "\\hat{\\beta}_{j}" [ref=f6e1915]'
    - text: by its standard
