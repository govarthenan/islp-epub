    - superscript [ref=f6e551]: "2"
    - text: fills this role.
  - heading "3.2 Multiple Linear Regression" [level=2] [ref=f6e552]
  - paragraph [ref=f6e553]:
    - text: Simple linear regression is a useful approach for predicting a response on the basis of a single predictor variable. However, in practice we often have more than one predictor. For example, in the
    - code [ref=f6e554]: Advertising
    - text: data, we have examined the relationship between sales and TV advertising. We also have data for the amount of money spent advertising on the radio and in newspapers, and we may want to know whether either of these two media is associated with sales. How can we extend our analysis of the advertising data in order to accommodate these two additional predictors?
  - paragraph [ref=f6e555]:
    - text: One option is to run three separate simple linear regressions, each of which uses a different advertising medium as a predictor. For instance, we can fit a simple linear regression to predict sales on the basis of the amount spent on radio advertisements. Results are shown in Table
    - link "3.3" [ref=f6e556] [cursor=pointer]:
      - /url: ch04.xhtml#b89
    - text: (top table). We find that a $1,000 increase in spending on radio advertising is associated with an increase in sales of around 203 units. Table
    - link "3.3" [ref=f6e557] [cursor=pointer]:
      - /url: ch04.xhtml#b89
    - text: (bottom table) contains the least squares coefficients for a simple linear regression of sales onto newspaper advertising budget. A $1,000 increase in newspaper advertising budget is associated with an increase in sales of approximately 55 units.
  - paragraph [ref=f6e558]: However, the approach of fitting a separate simple linear regression model for each predictor is not entirely satisfactory. First of all, it is unclear how to make a single prediction of sales given the three advertising media budgets, since each of the budgets is associated with a separate regression equation. Second, each of the three regression equations ignores the other two media in forming estimates for the regression coefficients. We will see shortly that if the media budgets are correlated with each other in the 200 markets in our data set, then this can lead to very misleading estimates of the association between each media budget and sales.
  - paragraph [ref=f6e559]:
    - text: Instead of fitting a separate simple linear regression model for each predictor, a better approach is to extend the simple linear regression model (
    - link "3.5" [ref=f6e560] [cursor=pointer]:
      - /url: ch04.xhtml#b33
    - text: ) so that it can directly accommodate multiple predictors. We can do this by giving each predictor a separate slope coefficient in a single model. In general, suppose that we have p distinct predictors. Then the multiple linear regression model takes the form
  - generic [ref=f6e561]:
    - img "Y = \\beta_0 + \\beta_1 X_1 + \\beta_2 X_2 + \\cdots + \\beta_p X_p + \\epsilon," [ref=f6e562]
    - text: (3.19)
  - paragraph [ref=f6e563]:
    - text: where X
    - subscript [ref=f6e564]: j
    - text: represents the jth predictor and β
    - subscript [ref=f6e565]: j
    - text: quantifies the association between that variable and the response. We interpret β
    - subscript [ref=f6e566]: j
    - text: as the
    - emphasis [ref=f6e567]: average
    - text: effect on Y of a one unit increase in X
    - subscript [ref=f6e568]: j
    - text: ","
    - emphasis [ref=f6e569]: holding all other predictors fixed
    - text: . In the advertising example, (
    - link "3.19" [ref=f6e570] [cursor=pointer]:
      - /url: ch04.xhtml#b96
    - text: ) becomes
    - code [ref=f6e571]: sales
    - text: = β
    - subscript [ref=f6e572]: "0"
    - text: + β
    - subscript [ref=f6e573]: "1"
    - text: ×
    - code [ref=f6e574]: TV
    - text: + β
    - subscript [ref=f6e575]: "2"
    - text: ×
    - code [ref=f6e576]: radio
    - text: + β
    - subscript [ref=f6e577]: "3"
    - text: ×
    - code [ref=f6e578]: newspaper
    - text: + ϵ.
  - heading "3.2.1 Estimating the Regression Coefficients" [level=3] [ref=f6e579]
  - paragraph [ref=f6e580]:
    - text: As was the case in the simple linear regression setting, the regression coefficients β
    - subscript [ref=f6e581]: "0"
    - text: ", β"
    - subscript [ref=f6e582]: "1"
    - text: ", . . . , β"
    - subscript [ref=f6e583]: p
    - text: in (
    - link "3.19" [ref=f6e584] [cursor=pointer]:
      - /url: ch04.xhtml#b96
    - text: ) are unknown, and must be estimated. Given estimates
    - 'img "\\hat{\\beta}_{0}, \\hat{\\beta}_{1}, . . . , \\hat{\\beta}_{p}" [ref=f6e585]'
    - text: ", we can make predictions using the formula"
  - generic [ref=f6e586]:
    - 'img "\\hat{y} = \\hat{\\beta}_0 + \\hat{\\beta}_1 x_1 + \\hat{\\beta}_2 x_2 + \\cdots + \\hat{\\beta}_p x_p." [ref=f6e587]'
    - text: (3.21)
  - paragraph [ref=f6e588]:
    - text: The parameters are estimated using the same least squares approach that we saw in the context of simple linear regression. We choose β
    - subscript [ref=f6e589]: "0"
    - text: ", β"
    - subscript [ref=f6e590]: "1"
    - text: ", . . . , β"
    - subscript [ref=f6e591]: p
    - text: to minimize the sum of squared residuals
  - generic [ref=f6e592]:
    - 'img "\\begin{aligned} \\mathrm{RSS} &= \\sum_{i=1}^{n}(y_i - \\hat{y}_i)^2 \\\\ &= \\sum_{i=1}^{n}(y_i - \\hat{\\beta}_0 - \\hat{\\beta}_1 x_{i1} - \\hat{\\beta}_2 x_{i2} - \\cdots - \\hat{\\beta}_p x_{ip})^2. \\end{aligned}" [ref=f6e593]'
    - text: (3.22)
  - paragraph [ref=f6e594]:
    - text: The values
    - 'img "\\hat{\\beta}_{0}, \\hat{\\beta}_{1}, . . . , \\hat{\\beta}_{p}" [ref=f6e595]'
    - text: that minimize (
    - link "3.22" [ref=f6e596] [cursor=pointer]:
      - /url: ch04.xhtml#b102
    - text: ) are the multiple least squares regression coefficient estimates. Unlike the simple linear regression estimates given in (
    - link "3.4" [ref=f6e597] [cursor=pointer]:
      - /url: ch04.xhtml#b27
    - text: ), the multiple regression coefficient estimates have somewhat complicated forms that are most easily represented using matrix algebra. For this reason, we do not provide them here. Any statistical software package can be used to compute these coefficient estimates, and later in this chapter we will show how this can be done in
    - code [ref=f6e598]: R
