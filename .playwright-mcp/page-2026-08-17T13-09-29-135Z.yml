    - text: ). We note that the slope for students is lower than the slope for non-students. This suggests that increases in income are associated with smaller increases in credit card balance among students as compared to non-students.
  - heading "Non-linear Relationships" [level=4] [ref=f6e1546]
  - paragraph [ref=f6e1547]:
    - text: As discussed previously, the linear regression model (
    - link "3.19" [ref=f6e1548] [cursor=pointer]:
      - /url: ch04.xhtml#b96
    - text: ) assumes a linear relationship between the response and predictors. But in some cases, the true relationship between the response and the predictors may be nonlinear. Here we present a very simple way to directly extend the linear model to accommodate non-linear relationships, using
    - emphasis [ref=f6e1549]: polynomial regression
    - text: . In later chapters, we will present more complex approaches for performing non-linear fits in more general settings.
  - paragraph [ref=f6e1550]: polynomial regression
  - paragraph [ref=f6e1551]:
    - text: Consider Figure
    - link "3.8" [ref=f6e1552] [cursor=pointer]:
      - /url: ch04.xhtml#b243
    - text: ", in which the"
    - code [ref=f6e1553]: mpg
    - text: (gas mileage in miles per gallon) versus
    - code [ref=f6e1554]: horsepower
    - text: is shown for a number of cars in the
    - code [ref=f6e1555]: Auto
    - text: data set. The orange line represents the linear regression fit. There is a pronounced relationship between
    - code [ref=f6e1556]: mpg
    - text: and
    - code [ref=f6e1557]: horsepower
    - text: ", but it seems clear that this relationship is in fact non-linear: the data suggest a curved relationship. A simple approach for incorporating non-linear associations in a linear model is to include transformed versions of the predictors. For example, the points in Figure"
    - link "3.8" [ref=f6e1558] [cursor=pointer]:
      - /url: ch04.xhtml#b243
    - text: seem to have a
    - emphasis [ref=f6e1559]: quadratic
    - text: shape, suggesting that a model of the form
    - code [ref=f6e1560]: mpg
    - text: = β
    - subscript [ref=f6e1561]: "0"
    - text: + β
    - subscript [ref=f6e1562]: "1"
    - text: ×
    - code [ref=f6e1563]: horsepower
    - text: + β
    - subscript [ref=f6e1564]: "2"
    - text: ×
    - code [ref=f6e1565]: horsepower
    - superscript [ref=f6e1566]: "2"
    - text: + ϵ may provide a better fit. Equation
    - link "3.36" [ref=f6e1567] [cursor=pointer]:
      - /url: ch04.xhtml#b242
    - text: involves predicting
    - code [ref=f6e1568]: mpg
    - text: using a non-linear function of
    - code [ref=f6e1569]: horsepower
    - text: .
    - emphasis [ref=f6e1570]: But it is still a linear model!
    - text: That is, (
    - link "3.36" [ref=f6e1571] [cursor=pointer]:
      - /url: ch04.xhtml#b242
    - text: ) is simply a multiple linear regression model with X
    - subscript [ref=f6e1572]: "1"
    - text: =
    - code [ref=f6e1573]: horsepower
    - text: and X
    - subscript [ref=f6e1574]: "2"
    - text: =
    - code [ref=f6e1575]: horsepower
    - superscript [ref=f6e1576]: "2"
    - text: . So we can use standard linear regression software to estimate β
    - subscript [ref=f6e1577]: "0"
    - text: ", β"
    - subscript [ref=f6e1578]: "1"
    - text: ", and β"
    - subscript [ref=f6e1579]: "2"
    - text: in order to produce a non-linear fit. The blue curve in Figure
    - link "3.8" [ref=f6e1580] [cursor=pointer]:
      - /url: ch04.xhtml#b243
    - text: shows the resulting quadratic fit to the data. The quadratic
  - paragraph [ref=f6e1581]: quadratic
