  - heading "3.6.2 Simple Linear Regression" [level=3] [ref=f6e2291]
  - paragraph [ref=f6e2292]:
    - text: In this section we will construct model matrices (also called design matrices) using the
    - code [ref=f6e2293]: ModelSpec()
    - text: transform from
    - code [ref=f6e2294]: ISLP.models
    - text: .
  - paragraph [ref=f6e2295]:
    - text: We will use the
    - code [ref=f6e2296]: Boston
    - text: housing data set, which is contained in the
    - code [ref=f6e2297]: ISLP
    - text: package. The
    - code [ref=f6e2298]: Boston
    - text: dataset records
    - code [ref=f6e2299]: medv
    - text: (median house value) for 506 neighborhoods around Boston. We will build a regression model to predict
    - code [ref=f6e2300]: medv
    - text: using 13 predictors such as
    - code [ref=f6e2301]: rmvar
    - text: (average number of rooms per house),
    - code [ref=f6e2302]: age
    - text: (proportion of owner-occupied units built prior to 1940), and
    - code [ref=f6e2303]: lstat
    - text: (percent of households with low socioeconomic status). We will use
    - code [ref=f6e2304]: statsmodels
    - text: for this task, a
    - code [ref=f6e2305]: Python
    - text: package that implements several commonly used regression methods.
  - paragraph [ref=f6e2306]:
    - text: We have included a simple loading function
    - code [ref=f6e2307]: load_data()
    - text: in the
    - code [ref=f6e2308]: ISLP
    - text: "package:"
  - paragraph [ref=f6e2309]:
    - code [ref=f6e2310]: load_data()
  - generic [ref=f6e2311]: "In [8]: Boston = load_data(\"Boston\") Boston.columns"
  - generic [ref=f6e2313]: "Out[8]: Index(['crim', 'zn', 'indus', 'chas', 'nox', 'rm', 'age', 'dis', 'rad', 'tax', 'ptratio', 'black', 'lstat', 'medv'], dtype='object')"
  - paragraph [ref=f6e2315]:
    - text: Type
    - code [ref=f6e2316]: Boston?
    - text: to find out more about these data.
  - paragraph [ref=f6e2317]:
    - text: We start by using the
    - code [ref=f6e2318]: sm.OLS()
    - text: function to fit a simple linear regression model. Our response will be
    - code [ref=f6e2319]: medv
    - text: and
    - code [ref=f6e2320]: lstat
    - text: will be the single predictor. For this model, we can create the model matrix by hand.
  - paragraph [ref=f6e2321]:
    - code [ref=f6e2322]: sm.OLS()
  - generic [ref=f6e2323]: "In [9]: X = pd.DataFrame({'intercept': np.ones(Boston.shape[0]), 'lstat': Boston['lstat']}) X[:4]"
  - generic [ref=f6e2325]: "Out[9]: intercept lstat 0 1.0 4.98 1 1.0 9.14 2 1.0 4.03 3 1.0 2.94"
  - paragraph [ref=f6e2327]: We extract the response, and fit the model.
  - generic [ref=f6e2328]: "In [10]: y = Boston['medv'] model = sm.OLS(y, X) results = model.fit()"
  - paragraph [ref=f6e2330]:
    - text: Note that
    - code [ref=f6e2331]: sm.OLS()
    - text: does not fit the model; it specifies the model, and then
    - code [ref=f6e2332]: model.fit()
    - text: does the actual fitting.
  - paragraph [ref=f6e2333]:
    - text: Our
    - code [ref=f6e2334]: ISLP
    - text: function
    - code [ref=f6e2335]: summarize()
    - text: produces a simple table of the parameter estimates, their standard errors, t-statistics and p-values. The function takes a single argument, such as the object
    - code [ref=f6e2336]: results
    - text: returned here by the
    - code [ref=f6e2337]: fit
    - text: method, and returns such a summary.
  - paragraph [ref=f6e2338]:
    - code [ref=f6e2339]: summarize()
  - generic [ref=f6e2340]: "In [11]: summarize(results)"
  - generic [ref=f6e2342]: "Out[11]: coef std err t P>|t| intercept 34.5538 0.563 61.415 0.0 lstat -0.9500 0.039 -24.528 0.0"
  - paragraph [ref=f6e2344]:
    - text: Before we describe other methods for working with fitted models, we outline a more useful and general framework for constructing a model matrix
    - code [ref=f6e2345]: X
    - text: .
  - 'heading "Using Transformations: Fit and Transform" [level=4] [ref=f6e2346]'
  - paragraph [ref=f6e2347]:
    - text: Our model above has a single predictor, and constructing
    - code [ref=f6e2348]: X
    - text: was straightforward. In practice we often fit models with more than one predictor, typically selected from an array or data frame. We may wish to introduce transformations to the variables before fitting the model, specify interactions between variables, and expand some particular variables into sets of variables (e.g. polynomials). The
    - code [ref=f6e2349]: sklearn
    - text: "package has a particular notion for this type of task: a"
    - emphasis [ref=f6e2350]: transform
    - text: ". A transform is an object that is created with some parameters as arguments. The object has two main methods:"
    - code [ref=f6e2351]: fit()
    - text: and
    - code [ref=f6e2352]: transform()
    - text: .
  - paragraph [ref=f6e2353]:
    - code [ref=f6e2354]: sklearn
    - text: ·
    - code [ref=f6e2355]: .fit() .transform() ModelSpec()
  - paragraph [ref=f6e2356]:
    - text: We provide a general approach for specifying models and constructing the model matrix through the transform
    - code [ref=f6e2357]: ModelSpec()
    - text: in the
    - code [ref=f6e2358]: ISLP
    - text: library.
    - code [ref=f6e2359]: ModelSpec()
    - text: (renamed
    - code [ref=f6e2360]: MS()
    - text: in the preamble) creates a transform object, and then a pair of methods
    - code [ref=f6e2361]: transform()
    - text: and
    - code [ref=f6e2362]: fit()
    - text: are used to construct a corresponding model matrix.
  - paragraph [ref=f6e2363]:
    - text: We first describe this process for our simple regression model using a single predictor
    - code [ref=f6e2364]: lstat
    - text: in the
    - code [ref=f6e2365]: Boston
    - text: data frame, but will use it repeatedly in more complex tasks in this and other labs in this book. In our case the transform is created by the expression
    - code [ref=f6e2366]: design = MS(['lstat'])
    - text: .
  - paragraph [ref=f6e2367]:
    - text: The
    - code [ref=f6e2368]: fit()
    - text: method takes the original array and may do some initial computations on it, as specified in the transform object. For example, it may compute means and standard deviations for centering and scaling. The
    - code [ref=f6e2369]: transform()
    - text: method applies the fitted transformation to the array of data, and produces the model matrix.
  - generic [ref=f6e2370]: "In [12]: design = MS(['lstat']) design = design.fit(Boston) X = design.transform(Boston) X[:4]"
  - generic [ref=f6e2372]: "Out[12]: intercept lstat 0 1.0 4.98 1 1.0 9.14 2 1.0 4.03 3 1.0 2.94"
  - paragraph [ref=f6e2374]:
    - text: In this simple case, the
    - code [ref=f6e2375]: fit()
    - text: method does very little; it simply checks that the variable
    - code [ref=f6e2376]: "'lstat'"
    - text: specified in
    - code [ref=f6e2377]: design
    - text: exists in
    - code [ref=f6e2378]: Boston
    - text: . Then
    - code [ref=f6e2379]: transform()
    - text: "constructs the model matrix with two columns: an"
    - code [ref=f6e2380]: intercept
    - text: and the variable
    - code [ref=f6e2381]: lstat
    - text: .
  - paragraph [ref=f6e2382]:
    - text: These two operations can be combined with the
    - code [ref=f6e2383]: fit_transform()
    - text: method.
  - paragraph [ref=f6e2384]:
    - code [ref=f6e2385]: .fit_ transform()
  - generic [ref=f6e2386]: "In [13]: design = MS(['lstat']) X = design.fit_transform(Boston) X[:4]"
  - generic [ref=f6e2388]: "Out[13]: intercept lstat 0 1.0 4.98 1 1.0 9.14 2 1.0 4.03 3 1.0 2.94"
  - paragraph [ref=f6e2390]:
    - text: Note that, as in the previous code chunk when the two steps were done separately, the
    - code [ref=f6e2391]: design
    - text: object is changed as a result of the
    - code [ref=f6e2392]: fit()
    - text: operation. The power of this pipeline will become clearer when we fit more complex models that involve interactions and transformations.
  - paragraph [ref=f6e2393]:
    - text: Let’s return to our fitted regression model. The object
    - code [ref=f6e2394]: results
    - text: has several methods that can be used for inference. We already presented a function
    - code [ref=f6e2395]: summarize()
    - text: for showing the essentials of the fit. For a full and somewhat exhaustive summary of the fit, we can use the
    - code [ref=f6e2396]: summary()
    - text: method (output not shown).
  - generic [ref=f6e2397]: "In [14]: results.summary()"
  - paragraph [ref=f6e2399]:
    - text: The fitted coefficients can also be retrieved as the
    - code [ref=f6e2400]: params
    - text: attribute of
  - generic [ref=f6e2401]: results.
  - generic [ref=f6e2403]: "In [15]: results.params"
  - generic [ref=f6e2405]: "Out[15]: intercept 34.553841 lstat -0.950049 dtype: float64"
