  - paragraph [ref=f6e1995]: power
  - paragraph [ref=f6e1996]:
    - text: Table
    - link "3.11" [ref=f6e1997] [cursor=pointer]:
      - /url: ch04.xhtml#b298
    - text: compares the coefficient estimates obtained from two separate multiple regression models. The first is a regression of
    - code [ref=f6e1998]: balance
    - text: "on"
    - code [ref=f6e1999]: age
    - text: and
    - code [ref=f6e2000]: limit
    - text: ", and the second is a regression of"
    - code [ref=f6e2001]: balance
    - text: "on"
    - code [ref=f6e2002]: rating
    - text: and
    - code [ref=f6e2003]: limit
    - text: . In the first regression, both
    - code [ref=f6e2004]: age
    - text: and
    - code [ref=f6e2005]: limit
    - text: are highly significant with very small pvalues. In the second, the collinearity between
    - code [ref=f6e2006]: limit
    - text: and
    - code [ref=f6e2007]: rating
    - text: has caused the standard error for the
    - code [ref=f6e2008]: limit
    - text: coefficient estimate to increase by a factor of 12 and the p-value to increase to 0.701. In other words, the importance of the
    - code [ref=f6e2009]: limit
    - text: variable has been masked due to the presence of collinearity. To avoid such a situation, it is desirable to identify and address potential collinearity problems while fitting the model.
  - paragraph [ref=f6e2010]:
    - text: "A simple way to detect collinearity is to look at the correlation matrix of the predictors. An element of this matrix that is large in absolute value indicates a pair of highly correlated variables, and therefore a collinearity problem in the data. Unfortunately, not all collinearity problems can be detected by inspection of the correlation matrix: it is possible for collinearity to exist between three or more variables even if no pair of variables has a particularly high correlation. We call this situation"
    - emphasis [ref=f6e2011]: multicollinearity
    - text: . Instead of inspecting the correlation matrix, a better way to assess multicollinearity is to compute the
    - emphasis [ref=f6e2012]: variance inflation factor
    - text: (VIF). The VIF is the ratio of the variance of
    - 'img "\\hat{\\beta}_{j}" [ref=f6e2013]'
    - text: when fitting the full model divided by the variance of
    - 'img "\\hat{\\beta}_{j}" [ref=f6e2014]'
    - text: if fit on its own. The smallest possible value for VIF is 1, which indicates the complete absence of collinearity. Typically in practice there is a small amount of collinearity among the predictors. As a rule of thumb, a VIF value that exceeds 5 or 10 indicates a problematic amount of collinearity. The VIF for each variable can be computed using the formula
  - paragraph [ref=f6e2015]: multicollinearity variance inflation factor
  - 'img "\\mathrm{VIF}(\\hat{\\beta}_j) = \\frac{1}{1 - R^2_{X_j|X_{-j}}}," [ref=f6e2017]'
  - paragraph [ref=f6e2018]:
    - text: where R
    - subscript [ref=f6e2019]:
      - text: X
      - subscript [ref=f6e2020]: j
      - text: "|X"
      - subscript [ref=f6e2021]: −j
    - superscript [ref=f6e2022]: "2"
    - text: is the R
    - superscript [ref=f6e2023]: "2"
    - text: from a regression of X
    - subscript [ref=f6e2024]: j
    - text: onto all of the other predictors. If R
    - subscript [ref=f6e2025]:
      - text: X
      - subscript [ref=f6e2026]: j
      - text: "|X"
      - subscript [ref=f6e2027]: −j
    - superscript [ref=f6e2028]: "2"
    - text: is close to one, then collinearity is present, and so the VIF will be large.
  - paragraph [ref=f6e2029]:
    - text: In the
    - code [ref=f6e2030]: Credit
    - text: data, a regression of
    - code [ref=f6e2031]: balance
    - text: "on"
    - code [ref=f6e2032]: age
    - text: ","
    - code [ref=f6e2033]: rating
    - text: ", and"
    - code [ref=f6e2034]: limit
    - text: indicates that the predictors have VIF values of 1.01, 160.67, and 160.59. As we suspected, there is considerable collinearity in the data!
  - paragraph [ref=f6e2035]:
    - text: When faced with the problem of collinearity, there are two simple solutions. The first is to drop one of the problematic variables from the regression. This can usually be done without much compromise to the regression fit, since the presence of collinearity implies that the information that this variable provides about the response is redundant in the presence of the other variables. For instance, if we regress
    - code [ref=f6e2036]: balance
    - text: onto
    - code [ref=f6e2037]: age
    - text: and
    - code [ref=f6e2038]: limit
    - text: ", without the"
    - code [ref=f6e2039]: rating
    - text: predictor, then the resulting VIF values are close to the minimum possible value of 1, and the R
    - superscript [ref=f6e2040]: "2"
    - text: drops from 0.754 to 0.75. So dropping
    - code [ref=f6e2041]: rating
    - text: from the set of predictors has effectively solved the collinearity problem without compromising the fit. The second solution is to combine the collinear variables together into a single predictor. For instance, we might take the average of standardized versions of
    - code [ref=f6e2042]: limit
    - text: and
    - code [ref=f6e2043]: rating
    - text: in order to create a new variable that measures
    - emphasis [ref=f6e2044]: credit worthiness
    - text: .
  - heading "3.4 The Marketing Plan" [level=2] [ref=f6e2045]
  - paragraph [ref=f6e2046]:
    - text: We now briefly return to the seven questions about the
    - code [ref=f6e2047]: Advertising
    - text: data that we set out to answer at the beginning of this chapter.
  - paragraph [ref=f6e2048]:
    - text: "1."
    - emphasis [ref=f6e2049]: Is there a relationship between sales and advertising budget?
    - text: This question can be answered by fitting a multiple regression model of
    - code [ref=f6e2050]: sales
    - text: onto
    - code [ref=f6e2051]: TV
    - text: ","
    - code [ref=f6e2052]: radio
    - text: ", and"
    - code [ref=f6e2053]: newspaper
    - text: ", as in ("
    - link "3.20" [ref=f6e2054] [cursor=pointer]:
      - /url: ch04.xhtml#b98
    - text: ), and testing the hypothesis H
    - subscript [ref=f6e2055]: "0"
    - text: ": β"
    - subscript [ref=f6e2056]:
      - code [ref=f6e2057]: TV
    - text: = β
    - subscript [ref=f6e2058]:
      - code [ref=f6e2059]: radio
    - text: = β
    - subscript [ref=f6e2060]:
      - code [ref=f6e2061]: newspaper
    - text: = 0. In Section
    - link "3.2.2" [ref=f6e2062] [cursor=pointer]:
      - /url: ch04.xhtml#b112
    - text: ", we showed that the F-statistic can be used to determine whether or not we should reject this null hypothesis. In this case the p-value corresponding to the F-statistic in Table"
    - link "3.6" [ref=f6e2063] [cursor=pointer]:
      - /url: ch04.xhtml#b129
    - text: is very low, indicating clear evidence of a relationship between advertising and sales.
  - paragraph [ref=f6e2064]:
    - text: "2."
    - emphasis [ref=f6e2065]: How strong is the relationship?
    - text: We discussed two measures of model accuracy in Section
    - link "3.1.3" [ref=f6e2066] [cursor=pointer]:
      - /url: ch04.xhtml#b67
    - text: . First, the RSE estimates the standard deviation of the response from the population regression line. For the
    - code [ref=f6e2067]: Advertising
    - text: data, the RSE is 1.69 units while the mean value for the response is 14.022, indicating a percentage error of roughly 12 %. Second, the R
    - superscript [ref=f6e2068]: "2"
    - text: statistic records the percentage of variability in the response that is explained by the predictors. The predictors explain almost 90 % of the variance in
    - code [ref=f6e2069]: sales
    - text: . The RSE and R
    - superscript [ref=f6e2070]: "2"
    - text: statistics are displayed in Table
    - link "3.6" [ref=f6e2071] [cursor=pointer]:
      - /url: ch04.xhtml#b129
    - text: .
  - paragraph [ref=f6e2072]:
    - text: "3."
    - emphasis [ref=f6e2073]: Which media are associated with sales?
    - text: To answer this question, we can examine the p-values associated with each predictor’s t-statistic (Section
    - link "3.1.2" [ref=f6e2074] [cursor=pointer]:
      - /url: ch04.xhtml#b31
    - text: ). In the multiple linear regression displayed in Table
    - link "3.4" [ref=f6e2075] [cursor=pointer]:
      - /url: ch04.xhtml#b108
    - text: ", the p-values for"
    - code [ref=f6e2076]: TV
    - text: and
    - code [ref=f6e2077]: radio
    - text: are low, but the p-value for
    - code [ref=f6e2078]: newspaper
    - text: is not. This suggests that only
    - code [ref=f6e2079]: TV
    - text: and
    - code [ref=f6e2080]: radio
    - text: are related to
    - code [ref=f6e2081]: sales
    - text: . In Chapter
    - link "6" [ref=f6e2082] [cursor=pointer]:
      - /url: ch07.xhtml#b0
    - text: we explore this question in greater detail.
  - paragraph [ref=f6e2083]:
    - text: "4."
    - emphasis [ref=f6e2084]: How large is the association between each medium and sales?
    - text: We saw in Section
    - link "3.1.2" [ref=f6e2085] [cursor=pointer]:
      - /url: ch04.xhtml#b31
    - text: that the standard error of
    - 'img "\\hat{\\beta}_{j}" [ref=f6e2086]'
    - text: can be used to construct confidence intervals for β
    - subscript [ref=f6e2087]: j
    - text: . For the
    - code [ref=f6e2088]: Advertising
    - text: data, we can use the results in Table
    - link "3.4" [ref=f6e2089] [cursor=pointer]:
      - /url: ch04.xhtml#b108
    - text: "to compute the 95 % confidence intervals for the coefficients in a multiple regression model using all three media budgets as predictors. The confidence intervals are as follows:"
  - 'img "(0.043, 0.049) \\text{ for } \\texttt{TV}, (0.172, 0.206) \\text{ for } \\texttt{radio}, \\text{ and } (-0.013, 0.011) \\text{ for}" [ref=f6e2091]'
  - paragraph [ref=f6e2092]:
    - code [ref=f6e2093]: newspaper
    - text: . The confidence intervals for
    - code [ref=f6e2094]: TV
    - text: and
    - code [ref=f6e2095]: radio
    - text: are narrow and far from zero, providing evidence that these media are related to
    - code [ref=f6e2096]: sales
    - text: . But the interval for
    - code [ref=f6e2097]: newspaper
    - text: includes zero, indicating that the variable is not statistically significant given the values of
    - code [ref=f6e2098]: TV
    - text: and
    - code [ref=f6e2099]: radio
    - text: . We saw in Section
    - link "3.3.3" [ref=f6e2100] [cursor=pointer]:
      - /url: ch04.xhtml#b247
    - text: that collinearity can result in very wide standard errors. Could collinearity be the reason that the confidence interval associated with
    - code [ref=f6e2101]: newspaper
    - text: is so wide? The VIF scores are 1.005, 1.145, and 1.145 for
    - code [ref=f6e2102]: TV
    - text: ","
    - code [ref=f6e2103]: radio
    - text: ", and"
    - code [ref=f6e2104]: newspaper
    - text: ", suggesting no evidence of collinearity. In order to assess the association of each medium individually on sales, we can perform three separate simple linear regressions. Results are shown in Tables"
    - link "3.1" [ref=f6e2105] [cursor=pointer]:
      - /url: ch04.xhtml#b64
    - text: and
    - link "3.3" [ref=f6e2106] [cursor=pointer]:
      - /url: ch04.xhtml#b89
    - text: . There is evidence of an extremely strong association between
    - code [ref=f6e2107]: TV
    - text: and
    - code [ref=f6e2108]: sales
    - text: and between
    - code [ref=f6e2109]: radio
    - text: and
    - code [ref=f6e2110]: sales
    - text: . There is evidence of a mild association between
    - code [ref=f6e2111]: newspaper
    - text: and
    - code [ref=f6e2112]: sales
    - text: ", when the values of"
    - code [ref=f6e2113]: TV
    - text: and
    - code [ref=f6e2114]: radio
    - text: are ignored.
  - paragraph [ref=f6e2115]:
    - text: "5."
    - emphasis [ref=f6e2116]: How accurately can we predict future sales?
    - text: The response can be predicted using (
    - link "3.21" [ref=f6e2117] [cursor=pointer]:
      - /url: ch04.xhtml#b100
    - text: ). The accuracy associated with this estimate depends on whether we wish to predict an individual response, Y = f(X) + ϵ, or the average response, f(X) (Section
    - link "3.2.2" [ref=f6e2118] [cursor=pointer]:
      - /url: ch04.xhtml#b112
    - text: ). If the former, we use a prediction interval, and if the latter, we use a confidence interval. Prediction intervals will always be wider than confidence intervals because they account for the uncertainty associated with ϵ, the irreducible error.
  - paragraph [ref=f6e2119]:
    - text: "6."
    - emphasis [ref=f6e2120]: Is the relationship linear?
    - text: In Section
    - link "3.3.3" [ref=f6e2121] [cursor=pointer]:
      - /url: ch04.xhtml#b247
    - text: ", we saw that residual plots can be used in order to identify non-linearity. If the relationships are linear, then the residual plots should display no pattern. In the case of the"
    - code [ref=f6e2122]: Advertising
    - text: data, we observe a non-linear effect in Figure
    - link "3.5" [ref=f6e2123] [cursor=pointer]:
      - /url: ch04.xhtml#b155
    - text: ", though this effect could also be observed in a residual plot. In Section"
    - link "3.3.2" [ref=f6e2124] [cursor=pointer]:
      - /url: ch04.xhtml#b204
    - text: ", we discussed the inclusion of transformations of the predictors in the linear regression model in order to accommodate non-linear relationships."
  - paragraph [ref=f6e2125]:
    - text: "7."
    - emphasis [ref=f6e2126]: Is there synergy among the advertising media?
    - text: The standard linear regression model assumes an additive relationship between the predictors and the response. An additive model is easy to interpret because the association between each predictor and the response is unrelated to the values of the other predictors. However, the additive assumption may be unrealistic for certain data sets. In Section
    - link "3.3.2" [ref=f6e2127] [cursor=pointer]:
      - /url: ch04.xhtml#b204
    - text: ", we showed how to include an interaction term"
  - paragraph [ref=f6e2128]:
    - text: in the regression model in order to accommodate non-additive relationships. A small p-value associated with the interaction term indicates the presence of such relationships. Figure
    - link "3.5" [ref=f6e2129] [cursor=pointer]:
      - /url: ch04.xhtml#b155
    - text: suggested that the
    - code [ref=f6e2130]: Advertising
    - text: data may not be additive. Including an interaction term in the model results in a substantial increase in R
    - superscript [ref=f6e2131]: "2"
    - text: ", from around 90 % to almost 97 %."
  - heading "3.5 Comparison of Linear Regression with K-Nearest Neighbors" [level=2] [ref=f6e2132]
  - paragraph [ref=f6e2133]:
    - text: As discussed in Chapter
    - link "2" [ref=f6e2134] [cursor=pointer]:
      - /url: ch03.xhtml#b0
    - text: ", linear regression is an example of a"
    - emphasis [ref=f6e2135]: parametric
    - text: "approach because it assumes a linear functional form for f(X). Parametric methods have several advantages. They are often easy to fit, because one need estimate only a small number of coefficients. In the case of linear regression, the coefficients have simple interpretations, and tests of statistical significance can be easily performed. But parametric methods do have a disadvantage: by construction, they make strong assumptions about the form of f(X). If the specified functional form is far from the truth, and prediction accuracy is our goal, then the parametric method will perform poorly. For instance, if we assume a linear relationship between X and Y but the true relationship is far from linear, then the resulting model will provide a poor fit to the data, and any conclusions drawn from it will be suspect."
  - paragraph [ref=f6e2136]:
    - text: In contrast,
    - emphasis [ref=f6e2137]: non-parametric
    - text: methods do not explicitly assume a parametric form for f(X), and thereby provide an alternative and more flexible approach for performing regression. We discuss various non-parametric methods in this book. Here we consider one of the simplest and best-known non-parametric methods, K
    - emphasis [ref=f6e2138]: "-nearest neighbors regression"
    - text: (KNN regression). The KNN regression method is closely related to the KNN classifier discussed in Chapter
    - link "2" [ref=f6e2139] [cursor=pointer]:
      - /url: ch03.xhtml#b0
    - text: . Given a value for K and a prediction point x
    - subscript [ref=f6e2140]: "0"
    - text: ", KNN regression first identifies the K training observations that are closest to x"
    - subscript [ref=f6e2141]: "0"
    - text: ", represented by"
    - 'img "\\mathcal{N}_{0}" [ref=f6e2142]'
    - text: . It then estimates f(x
    - subscript [ref=f6e2143]: "0"
    - text: ) using the average of all the training responses in
    - 'img "\\mathcal{N}_{0}" [ref=f6e2144]'
    - text: . In other words,
  - paragraph [ref=f6e2145]: K-nearest neighbors regression
  - 'img "\\hat{f}(x_0) = \\frac{1}{K}\\sum_{x_i \\in \\mathcal{N}_0} y_i." [ref=f6e2147]'
  - paragraph [ref=f6e2148]:
    - text: Figure
    - link "3.16" [ref=f6e2149] [cursor=pointer]:
      - /url: ch04.xhtml#b323
    - text: illustrates two KNN fits on a data set with p = 2 predictors. The fit with K = 1 is shown in the left-hand panel, while the right-hand panel corresponds to K = 9. We see that when K = 1, the KNN fit perfectly interpolates the training observations, and consequently takes the form of a step function. When K = 9, the KNN fit still is a step function, but averaging over nine observations results in much smaller regions of constant prediction, and consequently a smoother fit. In general, the optimal value for K will depend on the
    - emphasis [ref=f6e2150]: bias-variance tradeoff
    - text: ", which we introduced in Chapter"
    - link "2" [ref=f6e2151] [cursor=pointer]:
      - /url: ch03.xhtml#b0
    - text: . A small value for K provides the most flexible fit, which will have low bias but high variance. This variance is due to the fact that the prediction in a given region is entirely dependent on just one observation.
  - generic [ref=f6e2152]:
    - img "figure 3.16" [ref=f6e2153]
    - paragraph [ref=f6e2154]:
      - text: FIGURE 3.16.
      - emphasis [ref=f6e2155]: Plots of
      - 'img "\\hat{f}(X)" [ref=f6e2156]'
      - emphasis [ref=f6e2157]: using KNN regression on a two-dimensional data set with
      - text: "64"
      - emphasis [ref=f6e2158]: observations (orange dots).
      - text: "Left: K = 1"
      - emphasis [ref=f6e2159]: results in a rough step function fit.
      - text: "Right: K = 9"
      - emphasis [ref=f6e2160]: produces a much smoother fit.
  - paragraph [ref=f6e2161]:
    - text: In contrast, larger values of K provide a smoother and less variable fit; the prediction in a region is an average of several points, and so changing one observation has a smaller effect. However, the smoothing may cause bias by masking some of the structure in f(X). In Chapter
    - link "5" [ref=f6e2162] [cursor=pointer]:
      - /url: ch06.xhtml#b0
    - text: ", we introduce several approaches for estimating test error rates. These methods can be used to identify the optimal value of K in KNN regression."
  - paragraph [ref=f6e2163]:
    - text: "In what setting will a parametric approach such as least squares linear regression outperform a non-parametric approach such as KNN regression? The answer is simple:"
    - emphasis [ref=f6e2164]: the parametric approach will outperform the nonparametric approach if the parametric form that has been selected is close to the true form of
    - text: f. Figure
    - link "3.17" [ref=f6e2165] [cursor=pointer]:
      - /url: ch04.xhtml#b327
    - text: "provides an example with data generated from a one-dimensional linear regression model. The black solid lines represent f(X), while the blue curves correspond to the KNN fits using K = 1 and K = 9. In this case, the K = 1 predictions are far too variable, while the smoother K = 9 fit is much closer to f(X). However, since the true relationship is linear, it is hard for a non-parametric approach to compete with linear regression: a non-parametric approach incurs a cost in variance that is not offset by a reduction in bias. The blue dashed line in the lefthand panel of Figure"
    - link "3.18" [ref=f6e2166] [cursor=pointer]:
      - /url: ch04.xhtml#b328
    - text: represents the linear regression fit to the same data. It is almost perfect. The right-hand panel of Figure
    - link "3.18" [ref=f6e2167] [cursor=pointer]:
      - /url: ch04.xhtml#b328
    - text: reveals that linear regression outperforms KNN for this data. The green solid line, plotted as a function of 1/K, represents the test set mean squared error (MSE) for KNN. The KNN errors are well above the black dashed line, which is the test MSE for linear regression. When the value of K is large, then KNN performs only a little worse than least squares regression in terms of MSE. It performs far worse when K is small.
  - paragraph [ref=f6e2168]:
    - text: In practice, the true relationship between X and Y is rarely exactly linear. Figure
    - link "3.19" [ref=f6e2169] [cursor=pointer]:
      - /url: ch04.xhtml#b329
    - text: examines the relative performances of least squares regression and KNN under increasing levels of non-linearity in the relationship between X and Y . In the top row, the true relationship is nearly linear. In this case we see that the test MSE for linear regression is still superior
  - generic [ref=f6e2170]:
