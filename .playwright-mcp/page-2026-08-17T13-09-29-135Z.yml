  - paragraph [ref=f6e1447]: main effect
  - paragraph [ref=f6e1448]:
    - text: In this example, the p-values associated with
    - code [ref=f6e1449]: TV
    - text: ","
    - code [ref=f6e1450]: radio
    - text: ", and the interaction term all are statistically significant (Table"
    - link "3.9" [ref=f6e1451] [cursor=pointer]:
      - /url: ch04.xhtml#b219
    - text: ), and so it is obvious that all three variables should be included in the model. However, it is sometimes the case that an interaction term has a very small p-value, but the associated main effects (in this case,
    - code [ref=f6e1452]: TV
    - text: and
    - code [ref=f6e1453]: radio
    - text: ) do not. The
    - emphasis [ref=f6e1454]: hierarchical principle
    - text: states that
    - emphasis [ref=f6e1455]: if we include an interaction in a model, we
    - emphasis [ref=f6e1456]: should also include the main effects, even if the
    - text: p
    - emphasis [ref=f6e1457]: "-values associated with their coefficients are not significant."
    - text: In other words, if the interaction between X
    - subscript [ref=f6e1458]: "1"
    - text: and X
    - subscript [ref=f6e1459]: "2"
    - text: seems important, then we should include both X
    - subscript [ref=f6e1460]: "1"
    - text: and X
    - subscript [ref=f6e1461]: "2"
    - text: in the model even if their coefficient estimates have large p-values. The rationale for this principle is that if X
    - subscript [ref=f6e1462]: "1"
    - text: × X
    - subscript [ref=f6e1463]: "2"
    - text: is related to the response, then whether or not the coefficients of X
    - subscript [ref=f6e1464]: "1"
    - text: or X
    - subscript [ref=f6e1465]: "2"
    - text: are exactly zero is of little interest. Also X
    - subscript [ref=f6e1466]: "1"
    - text: × X
    - subscript [ref=f6e1467]: "2"
    - text: is typically correlated with X
    - subscript [ref=f6e1468]: "1"
    - text: and X
    - subscript [ref=f6e1469]: "2"
    - text: ", and so leaving them out tends to alter the meaning of the interaction."
  - paragraph [ref=f6e1470]: hierarchical
  - paragraph [ref=f6e1471]:
    - text: In the previous example, we considered an interaction between
    - code [ref=f6e1472]: TV
    - text: and
    - code [ref=f6e1473]: radio
