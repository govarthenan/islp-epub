  - heading "Defining Functions" [level=4] [ref=f6e2449]
  - paragraph [ref=f6e2450]:
    - text: While there is a function within the
    - code [ref=f6e2451]: ISLP
    - text: package that adds a line to an existing plot, we take this opportunity to define our first function to do so.
  - paragraph [ref=f6e2452]:
    - code [ref=f6e2453]: def
  - generic [ref=f6e2454]: "In [20]: def abline(ax, b, m): \"Add a line with slope m and intercept b to ax\" xlim = ax.get_xlim() ylim = [m * xlim[0] + b, m * xlim[1] + b] ax.plot(xlim, ylim)"
  - paragraph [ref=f6e2456]:
    - text: "A few things are illustrated above. First we see the syntax for defining a function:"
    - code [ref=f6e2457]: def funcname(...)
    - text: . The function has arguments
    - code [ref=f6e2458]: ax, b, m
    - text: where
    - code [ref=f6e2459]: ax
    - text: is an axis object for an exisiting plot,
    - code [ref=f6e2460]: b
    - text: is the intercept and
    - code [ref=f6e2461]: m
    - text: is the slope of the desired line. Other plotting options can be passed on to
    - code [ref=f6e2462]: ax.plot
    - text: "by including additional optional arguments as follows:"
  - generic [ref=f6e2463]: "In [21]: def abline(ax, b, m, *args, **kwargs): \"Add a line with slope m and intercept b to ax\" xlim = ax.get_xlim() ylim = [m * xlim[0] + b, m * xlim[1] + b] ax.plot(xlim, ylim, *args, **kwargs)"
  - paragraph [ref=f6e2465]:
    - text: The addition of
    - code [ref=f6e2466]: "*args"
    - text: allows any number of non-named arguments to
    - code [ref=f6e2467]: abline
    - text: ", while"
    - code [ref=f6e2468]: "*kwargs"
    - text: allows any number of named arguments (such as
    - code [ref=f6e2469]: linewidth=3
    - text: ) to
    - code [ref=f6e2470]: abline
    - text: . In our function, we pass these arguments verbatim to
    - code [ref=f6e2471]: ax.plot
    - text: above. Readers interested in learning more about functions are referred to the section on defining functions in
    - link "docs.python.org/tutorial" [ref=f6e2472] [cursor=pointer]:
      - /url: https://docs.python.org/3/tutorial/controlflow.html#defining-functions
    - text: .
  - paragraph [ref=f6e2473]:
    - text: Let’s use our new function to add this regression line to a plot of
