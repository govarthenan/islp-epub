  - heading "3.1.1 Estimating the Coefficients" [level=3] [ref=f6e70]
  - paragraph [ref=f6e71]:
    - text: In practice, β
    - subscript [ref=f6e72]: "0"
    - text: and β
    - subscript [ref=f6e73]: "1"
    - text: are unknown. So before we can use (
    - link "3.1" [ref=f6e74] [cursor=pointer]:
      - /url: ch04.xhtml#b12
    - text: ) to make predictions, we must use data to estimate the coefficients. Let
  - img "(x_1, y_1),\\ (x_2, y_2),\\ \\ldots,\\ (x_n, y_n)" [ref=f6e76]
  - paragraph [ref=f6e77]:
    - text: represent n observation pairs, each of which consists of a measurement of X and a measurement of Y . In the
    - code [ref=f6e78]: Advertising
    - text: example, this data set consists of the TV advertising budget and product sales in n = 200 different markets. (Recall that the data are displayed in Figure
    - link "2.1" [ref=f6e79] [cursor=pointer]:
      - /url: ch03.xhtml#b6
    - text: .) Our goal is to obtain coefficient estimates
    - 'img "\\hat{\\beta}_{0}" [ref=f6e80]'
    - text: and
    - 'img "\\hat{\\beta}_{1}" [ref=f6e81]'
    - text: such that the linear model (
    - link "3.1" [ref=f6e82] [cursor=pointer]:
      - /url: ch04.xhtml#b12
    - text: ) fits the available data well—that is, so that
    - 'img "y_{i} \\approx \\hat{\\beta}_{0} + \\hat{\\beta}_{1}x_{i}" [ref=f6e83]'
    - text: for i = 1, . . . , n. In other words, we want to find an intercept
    - 'img "\\hat{\\beta}_{0}" [ref=f6e84]'
    - text: and a slope
    - 'img "\\hat{\\beta}_{1}" [ref=f6e85]'
    - text: such that the resulting line is as close as possible to the n = 200 data points. There are a number of ways of measuring
    - emphasis [ref=f6e86]: closeness
    - text: . However, by far the most common approach involves minimizing the
    - emphasis [ref=f6e87]: least squares
    - text: criterion, and we take that approach in this chapter. Alternative approaches will be considered in Chapter
    - link "6" [ref=f6e88] [cursor=pointer]:
      - /url: ch07.xhtml#b0
    - text: .
  - paragraph [ref=f6e89]: least squares
  - paragraph [ref=f6e90]:
    - text: Let
    - 'img "\\hat{y}_{i} = \\hat{\\beta}_{0} + \\hat{\\beta}_{1}x_{i}" [ref=f6e91]'
    - text: be the prediction for Y based on the ith value of X. Then
    - 'img "e_{i} = y_{i} -\\hat{y}_{i}" [ref=f6e92]'
    - text: represents the ith
    - emphasis [ref=f6e93]: residual
    - text: —this is the difference between the ith observed response value and the ith response value that is predicted by our linear model. We define the
    - emphasis [ref=f6e94]: residual sum of squares
    - text: (RSS) as
  - paragraph [ref=f6e95]: residual · residual sum of squares
  - 'img "\\mathrm{RSS} = e_1^2 + e_2^2 + \\cdots + e_n^2," [ref=f6e97]'
  - paragraph [ref=f6e98]: or equivalently as
  - 'img "\\mathrm{RSS} = (y_1 - \\hat{\\beta}_0 - \\hat{\\beta}_1 x_1)^2 + (y_2 - \\hat{\\beta}_0 - \\hat{\\beta}_1 x_2)^2 + \\cdots + (y_n - \\hat{\\beta}_0 - \\hat{\\beta}_1 x_n)^2." [ref=f6e100]'
  - paragraph [ref=f6e101]:
    - text: The least squares approach chooses
    - 'img "\\hat{\\beta}_{0}" [ref=f6e102]'
    - text: and
    - 'img "\\hat{\\beta}_{1}" [ref=f6e103]'
    - text: to minimize the RSS. Using some calculus, one can show that the minimizers are
  - generic [ref=f6e104]:
    - 'img "\\begin{aligned} \\hat{\\beta}_1 &= \\frac{\\sum_{i=1}^{n}(x_i - \\bar{x})(y_i - \\bar{y})}{\\sum_{i=1}^{n}(x_i - \\bar{x})^2}, \\\\ \\hat{\\beta}_0 &= \\bar{y} - \\hat{\\beta}_1 \\bar{x}, \\end{aligned}" [ref=f6e105]'
    - text: (3.4)
  - generic [ref=f6e106]:
