    - text: in the multiple regression model is close to zero, and the corresponding pvalue is no longer significant, with a value around 0.86. This illustrates that the simple and multiple regression coefficients can be quite different. This difference stems from the fact that in the simple regression case, the slope term represents the average increase in product sales associated with a $1,000 increase in newspaper advertising, ignoring other predictors such as
    - code [ref=f6e615]: TV
