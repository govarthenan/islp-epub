    - text: This suggests that we might be able to use r = Cor(X, Y ) instead of R
    - superscript [ref=f6e481]: "2"
    - text: in order to assess the fit of the linear model. In fact, it can be shown that in the simple
  - complementary [ref=f6e482]:
