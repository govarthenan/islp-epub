      - code [ref=f6e114]: TV
      - emphasis [ref=f6e115]: is shown. The fit is found by minimizing the residual sum of squares. Each grey line segment represents a residual. In this case a linear fit captures the essence of the relationship, although it overestimates the trend in the left of the plot.
  - paragraph [ref=f6e116]:
    - text: where
    - 'img "\\bar{y} \\equiv \\frac{1}{n}\\sum_{i=1}^{n} y_i" [ref=f6e117]'
    - text: and
    - 'img "\\bar{x} \\equiv \\frac{1}{n}\\sum_{i=1}^{n} x_i" [ref=f6e118]'
    - text: are the sample means. In other words, (
    - link "3.4" [ref=f6e119] [cursor=pointer]:
      - /url: ch04.xhtml#b27
