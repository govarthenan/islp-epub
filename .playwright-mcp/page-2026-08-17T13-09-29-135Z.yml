        - emphasis [ref=f6e1154]: "3.27"
      - emphasis [ref=f6e1155]: ). That is, ownership is encoded as a dummy variable, as in (
      - link [ref=f6e1156] [cursor=pointer]:
        - /url: ch04.xhtml#b175
        - emphasis [ref=f6e1157]: "3.26"
      - emphasis [ref=f6e1158]: ).
  - paragraph [ref=f6e1159]:
    - text: Now β
    - subscript [ref=f6e1160]: "0"
    - text: can be interpreted as the overall average credit card balance (ignoring the house ownership effect), and β
    - subscript [ref=f6e1161]: "1"
    - text: is the amount by which house owners and non-owners have credit card balances that are above and below the average, respectively.
    - superscript [ref=f6e1162]:
      - link "11" [ref=f6e1163] [cursor=pointer]:
        - /url: ch04.xhtml#b198
    - text: In this example, the estimate for β
    - subscript [ref=f6e1164]: "0"
    - text: is $519.665, halfway between the non-owner and owner averages of $509.80 and $529.53. The estimate for β
    - subscript [ref=f6e1165]: "1"
    - text: is $9.865, which is half of $19.73, the average difference between owners and non-owners. It is important to note that the final predictions for the credit balances of owners and non-owners will be identical regardless of the coding scheme used. The only difference is in the way that the coefcfi ients are interpreted.
  - heading "Qualitative Predictors with More than Two Levels" [level=4] [ref=f6e1166]
  - paragraph [ref=f6e1167]:
    - text: When a qualitative predictor has more than two levels, a single dummy variable cannot represent all possible values. In this situation, we can create additional dummy variables. For example, for the
    - code [ref=f6e1168]: region
    - text: variable we create two dummy variables. The first could be
  - generic [ref=f6e1169]:
    - 'img "x_{i1} = \\begin{cases} 1 & \\text{if } i\\text{th person is from the South} \\\\ 0 & \\text{if } i\\text{th person is not from the South,} \\end{cases}" [ref=f6e1170]'
    - text: (3.28)
  - paragraph [ref=f6e1171]: and the second could be
  - generic [ref=f6e1172]:
    - 'img "x_{i2} = \\begin{cases} 1 & \\text{if } i\\text{th person is from the West} \\\\ 0 & \\text{if } i\\text{th person is not from the West.} \\end{cases}" [ref=f6e1173]'
    - text: (3.29)
  - paragraph [ref=f6e1174]: Then both of these variables can be used in the regression equation, in order to obtain the model
  - generic [ref=f6e1175]:
    - 'img "\\begin{cases} \\beta_0 + \\beta_1 + \\epsilon_i & \\text{if } i\\text{th person is from the South} \\end{cases}" [ref=f6e1176]'
    - text: (3.30)
  - paragraph [ref=f6e1177]:
    - text: "y"
    - subscript [ref=f6e1178]: i
    - text: = β
    - subscript [ref=f6e1179]: "0"
    - text: +β
    - subscript [ref=f6e1180]: "1"
    - text: x
    - subscript [ref=f6e1181]: i1
    - text: +β
    - subscript [ref=f6e1182]: "2"
    - text: x
    - subscript [ref=f6e1183]: i2
    - text: +ϵ
    - subscript [ref=f6e1184]: i
    - text: = β
    - subscript [ref=f6e1185]: "0"
    - text: +β
    - subscript [ref=f6e1186]: "2"
    - text: +ϵ
    - subscript [ref=f6e1187]: i
    - text: if ith person is from the West β
    - subscript [ref=f6e1188]: "0"
    - text: +ϵ
    - subscript [ref=f6e1189]: i
    - text: if ith person is from the East. Now β
    - subscript [ref=f6e1190]: "0"
    - text: can be interpreted as the average credit card balance for individuals from the East, β
    - subscript [ref=f6e1191]: "1"
    - text: can be interpreted as the difference in the average balance between people from the South versus the East, and β
    - subscript [ref=f6e1192]: "2"
    - text: can be interpreted as the difef rence in the average balance between those from the West versus the East. There will always be one fewer dummy variable than the number of levels. The level with no dummy variable—East in this example—is known as the
    - emphasis [ref=f6e1193]: baseline
    - text: .
  - paragraph [ref=f6e1194]: baseline
  - complementary [ref=f6e1195]:
    - superscript [ref=f6e1196]: "11"
    - text: Technically β
    - subscript [ref=f6e1197]: "0"
    - text: is half the sum of the average debt for house owners and the average debt for non-house owners. Hence, β
    - subscript [ref=f6e1198]: "0"
    - text: is exactly equal to the overall average only if the two groups have an equal number of members.
  - generic [ref=f6e1199]:
