    - emphasis [ref=f6e44]: "on"
    - text: X (or Y
    - emphasis [ref=f6e45]: onto
    - text: X). For example, X may represent
    - code [ref=f6e46]: TV
    - text: advertising and Y may represent
    - code [ref=f6e47]: sales
    - text: . Then we can regress
    - code [ref=f6e48]: sales
    - text: onto
    - code [ref=f6e49]: TV
    - text: by fitting the model
  - 'img "\\texttt{sales} \\approx \\beta_0 + \\beta_1 \\times \\texttt{TV}." [ref=f6e51]'
