    - text: and
    - link "3.19" [ref=f6e2225] [cursor=pointer]:
      - /url: ch04.xhtml#b329
    - text: illustrate settings with p = 1 predictor. But in higher dimensions, KNN often performs worse than linear regression.
  - paragraph [ref=f6e2226]:
    - text: Figure
    - link "3.20" [ref=f6e2227] [cursor=pointer]:
      - /url: ch04.xhtml#b332
    - text: considers the same strongly non-linear situation as in the second row of Figure
    - link "3.19" [ref=f6e2228] [cursor=pointer]:
      - /url: ch04.xhtml#b329
    - text: ", except that we have added additional"
    - emphasis [ref=f6e2229]: noise
    - text: predictors that are not associated with the response. When p = 1 or p = 2, KNN outperforms linear regression. But for p = 3 the results are mixed, and for p ≥ 4 linear regression is superior to KNN. In fact, the increase in dimension has only caused a small deterioration in the linear regression test set MSE, but it has caused more than a ten-fold increase in the MSE for KNN. This decrease in performance as the dimension increases is a common problem for KNN, and results from the fact that in higher dimensions there is effectively a reduction in sample size. In this data set there are 50 training observations; when p = 1, this provides enough information to accurately estimate f(X). However, spreading 50 observations over p = 20 dimensions results in a phenomenon in which a given observation has no
    - emphasis [ref=f6e2230]: nearby neighbors
    - text: —this is the so-called
    - emphasis [ref=f6e2231]: curse of dimensionality
    - text: . That is, the K observations that are nearest to a given test observation x
    - subscript [ref=f6e2232]: "0"
    - text: may be very far away from x
    - subscript [ref=f6e2233]: "0"
    - text: in p-dimensional space when p is large, leading to a very poor prediction of f(x
    - subscript [ref=f6e2234]: "0"
    - text: ) and hence a poor KNN fit. As a general rule, parametric methods will tend to outperform non-parametric approaches when there is a small number of observations per predictor.
  - paragraph [ref=f6e2235]: curse of dimensionality
  - paragraph [ref=f6e2236]: Even when the dimension is small, we might prefer linear regression to KNN from an interpretability standpoint. If the test MSE of KNN is only slightly lower than that of linear regression, we might be willing to forego a little bit of prediction accuracy for the sake of a simple model that can be described in terms of just a few coefficients, and for which p-values are available.
