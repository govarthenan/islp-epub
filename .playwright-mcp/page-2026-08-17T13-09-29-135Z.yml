        - /url: ch04.xhtml#b27
        - emphasis [ref=f6e157]: "3.4"
      - emphasis [ref=f6e158]: ).
  - paragraph [ref=f6e159]:
    - text: The model given by (
    - link "3.5" [ref=f6e160] [cursor=pointer]:
      - /url: ch04.xhtml#b33
    - text: ) defines the
    - emphasis [ref=f6e161]: population regression line
    - text: ", which is the best linear approximation to the true relationship between X and Y ."
    - superscript [ref=f6e162]:
      - link "1" [ref=f6e163] [cursor=pointer]:
        - /url: ch04.xhtml#b40
    - text: The least squares regression coefficient estimates (
    - link "3.4" [ref=f6e164] [cursor=pointer]:
      - /url: ch04.xhtml#b27
    - text: ) characterize the
    - emphasis [ref=f6e165]: least squares line
    - text: (
    - link "3.2" [ref=f6e166] [cursor=pointer]:
      - /url: ch04.xhtml#b16
    - text: ). The left-hand panel of Figure
    - link "3.3" [ref=f6e167] [cursor=pointer]:
      - /url: ch04.xhtml#b41
    - text: displays these two lines in a simple simulated example. We created 100 random Xs, and generated 100 corresponding Y s from the model
  - paragraph [ref=f6e168]: population regression line least squares line
  - generic [ref=f6e169]:
    - img "Y = 2 + 3X + \\epsilon," [ref=f6e170]
    - text: (3.6)
  - paragraph [ref=f6e171]:
    - text: where ϵ was generated from a normal distribution with mean zero. The red line in the left-hand panel of Figure
    - link "3.3" [ref=f6e172] [cursor=pointer]:
      - /url: ch04.xhtml#b41
    - text: displays the
    - emphasis [ref=f6e173]: "true"
    - text: relationship, f(X) = 2 + 3X, while the blue line is the least squares estimate based on the observed data. The true relationship is generally not known for real data, but the least squares line can always be computed using the coefficient estimates given in (
    - link "3.4" [ref=f6e174] [cursor=pointer]:
      - /url: ch04.xhtml#b27
    - text: ). In other words, in real applications, we have access to a set of observations from which we can compute the least squares line; however, the population regression line is unobserved. In the right-hand panel of Figure
    - link "3.3" [ref=f6e175] [cursor=pointer]:
      - /url: ch04.xhtml#b41
    - text: we have generated ten different data sets from the model given by (
    - link "3.6" [ref=f6e176] [cursor=pointer]:
      - /url: ch04.xhtml#b37
    - text: ) and plotted the corresponding ten least squares lines. Notice that different data sets generated from the same true model result in slightly different least squares lines, but the unobserved population regression line does not change.
  - paragraph [ref=f6e177]: At first glance, the difference between the population regression line and the least squares line may seem subtle and confusing. We only have one data set, and so what does it mean that two different lines describe the relationship between the predictor and the response? Fundamentally, the concept of these two lines is a natural extension of the standard statistical approach of using information from a sample to estimate characteristics of a large population. For example, suppose that we are interested in knowing
  - complementary [ref=f6e178]:
    - superscript [ref=f6e179]: "1"
    - text: The assumption of linearity is often a useful working model. However, despite what many textbooks might tell us, we seldom believe that the true relationship is linear.
  - generic [ref=f6e180]:
    - img "figure 3.3" [ref=f6e181]
    - paragraph [ref=f6e182]:
      - text: FIGURE 3.3.
      - emphasis [ref=f6e183]: A simulated data set.
      - text: "Left:"
      - emphasis [ref=f6e184]: The red line represents the true relationship,
      - text: f(X) = 2 + 3X
      - emphasis [ref=f6e185]: ", which is known as the population regression line. The blue line is the least squares line; it is the least squares estimate for"
      - text: f(X)
      - emphasis [ref=f6e186]: based on the observed data, shown in black.
      - text: "Right:"
      - emphasis [ref=f6e187]: The population regression line is again shown in red, and the least squares line in dark blue. In light blue, ten least squares lines are shown, each computed on the basis of a separate random set of observations. Each least squares line is different, but on average, the least squares lines are quite close to the population regression line.
  - paragraph [ref=f6e188]:
    - text: the population mean μ of some random variable Y . Unfortunately, μ is unknown, but we do have access to n observations from Y , y
    - subscript [ref=f6e189]: "1"
    - text: ", . . . , y"
    - subscript [ref=f6e190]: "n"
    - text: ", which we can use to estimate μ. A reasonable estimate is"
    - 'img "\\hat{\\mu} = \\bar{y}" [ref=f6e191]'
    - text: ", where"
    - 'img "\\bar{y} = \\frac{1}{n}\\sum_{i=1}^{n} y_i" [ref=f6e192]'
    - text: is the sample mean. The sample mean and the population mean are different, but in general the sample mean will provide a good estimate of the population mean. In the same way, the unknown coefficients β
    - subscript [ref=f6e193]: "0"
    - text: and β
    - subscript [ref=f6e194]: "1"
    - text: in linear regression define the population regression line. We seek to estimate these unknown coefficients using
    - 'img "\\hat{\\beta}_{0}" [ref=f6e195]'
    - text: and
    - 'img "\\hat{\\beta}_{1}" [ref=f6e196]'
    - text: given in (
    - link "3.4" [ref=f6e197] [cursor=pointer]:
      - /url: ch04.xhtml#b27
    - text: ). These coefficient estimates define the least squares line.
  - paragraph [ref=f6e198]:
    - text: The analogy between linear regression and estimation of the mean of a random variable is an apt one based on the concept of
    - emphasis [ref=f6e199]: bias
    - text: . If we use the sample mean
    - 'img "\\hat{\\mu}" [ref=f6e200]'
    - text: to estimate μ, this estimate is
    - emphasis [ref=f6e201]: unbiased
    - text: ", in the sense that on average, we expect"
    - 'img "\\hat{\\mu}" [ref=f6e202]'
    - text: to equal μ. What exactly does this mean? It means that on the basis of one particular set of observations y
    - subscript [ref=f6e203]: "1"
    - text: ", . . . , y"
    - subscript [ref=f6e204]: "n"
    - text: ","
    - 'img "\\hat{\\mu}" [ref=f6e205]'
    - text: might overestimate μ, and on the basis of another set of observations,
    - 'img "\\hat{\\mu}" [ref=f6e206]'
    - text: might underestimate μ. But if we could average a huge number of estimates of μ obtained from a huge number of sets of observations, then this average would
    - emphasis [ref=f6e207]: exactly
    - text: equal μ. Hence, an unbiased estimator does not
    - emphasis [ref=f6e208]: systematically
    - text: over- or under-estimate the true parameter. The property of unbiasedness holds for the least squares coefficient estimates given by (
    - link "3.4" [ref=f6e209] [cursor=pointer]:
      - /url: ch04.xhtml#b27
    - text: ") as well: if we estimate β"
    - subscript [ref=f6e210]: "0"
    - text: and β
    - subscript [ref=f6e211]: "1"
    - text: on the basis of a particular data set, then our estimates won’t be exactly equal to β
    - subscript [ref=f6e212]: "0"
    - text: and β
    - subscript [ref=f6e213]: "1"
    - text: . But if we could average the estimates obtained over a huge number of data sets, then the average of these estimates would be spot on! In fact, we can see from the righthand panel of Figure
    - link "3.3" [ref=f6e214] [cursor=pointer]:
      - /url: ch04.xhtml#b41
    - text: that the average of many least squares lines, each estimated from a separate data set, is pretty close to the true population regression line.
  - paragraph [ref=f6e215]: bias unbiased
  - paragraph [ref=f6e216]:
    - text: "We continue the analogy with the estimation of the population mean μ of a random variable Y . A natural question is as follows: how accurate is the sample mean"
    - 'img "\\hat{\\mu}" [ref=f6e217]'
    - text: as an estimate of μ? We have established that the average of
    - 'img "\\hat{\\mu}" [ref=f6e218]'
    - text: ’s over many data sets will be very close to μ, but that a single estimate
    - 'img "\\hat{\\mu}" [ref=f6e219]'
    - text: may be a substantial underestimate or overestimate of μ. How far off will that single estimate of
    - 'img "\\hat{\\mu}" [ref=f6e220]'
    - text: be? In general, we answer this question by computing the
    - emphasis [ref=f6e221]: standard error
    - text: of
    - 'img "\\hat{\\mu}" [ref=f6e222]'
    - text: ", written as"
    - 'img "\\mathrm{SE}(\\hat{\\mu})" [ref=f6e223]'
    - text: . We have the well-known formula
  - paragraph [ref=f6e224]: standard error
  - generic [ref=f6e225]:
    - 'img "\\mathrm{Var}(\\hat{\\mu}) = \\mathrm{SE}(\\hat{\\mu})^2 = \\frac{\\sigma^2}{n}," [ref=f6e226]'
    - text: (3.7)
  - paragraph [ref=f6e227]:
    - text: where σ is the standard deviation of each of the realizations y
    - subscript [ref=f6e228]: i
    - text: of Y .
    - superscript [ref=f6e229]:
      - link "2" [ref=f6e230] [cursor=pointer]:
        - /url: ch04.xhtml#b50
    - text: Roughly speaking, the standard error tells us the average amount that this estimate
    - 'img "\\hat{\\mu}" [ref=f6e231]'
    - text: differs from the actual value of μ. Equation
    - link "3.7" [ref=f6e232] [cursor=pointer]:
      - /url: ch04.xhtml#b45
    - text: also tells us how this deviation shrinks with n—the more observations we have, the smaller the standard error of
    - 'img "\\hat{\\mu}" [ref=f6e233]'
    - text: . In a similar vein, we can wonder how close
    - 'img "\\hat{\\beta}_{0}" [ref=f6e234]'
    - text: and
    - 'img "\\hat{\\beta}_{1}" [ref=f6e235]'
    - text: are to the true values β
    - subscript [ref=f6e236]: "0"
    - text: and β
    - subscript [ref=f6e237]: "1"
    - text: . To compute the standard errors associated with
    - 'img "\\hat{\\beta}_{0}" [ref=f6e238]'
    - text: and
    - 'img "\\hat{\\beta}_{1}" [ref=f6e239]'
    - text: ", we use the following formulas:"
  - 'img "\\mathrm{SE}(\\hat{\\beta}_0)^2 = \\sigma^2\\left[\\frac{1}{n} + \\frac{\\bar{x}^2}{\\sum_{i=1}^{n}(x_i - \\bar{x})^2}\\right], \\quad \\mathrm{SE}(\\hat{\\beta}_1)^2 = \\frac{\\sigma^2}{\\sum_{i=1}^{n}(x_i - \\bar{x})^2}," [ref=f6e241]'
  - paragraph [ref=f6e242]:
    - text: where σ
    - superscript [ref=f6e243]: "2"
    - text: = Var(ϵ). For these formulas to be strictly valid, we need to assume that the errors ϵ
    - subscript [ref=f6e244]: i
    - text: for each observation have common variance σ
    - superscript [ref=f6e245]: "2"
    - text: and are uncorrelated. This is clearly not true in Figure
    - link "3.1" [ref=f6e246] [cursor=pointer]:
      - /url: ch04.xhtml#b28
    - text: ", but the formula still turns out to be a good approximation. Notice in the formula that"
    - 'img "\\mathrm{SE}(\\hat{\\beta}_{1})" [ref=f6e247]'
    - text: is smaller when the x
    - subscript [ref=f6e248]: i
    - text: are more spread out; intuitively we have more
    - emphasis [ref=f6e249]: leverage
    - text: to estimate a slope when this is the case. We also see that
    - 'img "\\mathrm{SE}(\\hat{\\beta}_{0})" [ref=f6e250]'
    - text: would be the same as
    - 'img "\\mathrm{SE}(\\hat{\\mu})" [ref=f6e251]'
    - text: if
    - 'img "\\bar{x}" [ref=f6e252]'
    - text: were zero (in which case
    - 'img "\\hat{\\beta}_{0}" [ref=f6e253]'
    - text: would be equal to
    - 'img "\\bar{y}" [ref=f6e254]'
    - text: ). In general, σ
    - superscript [ref=f6e255]: "2"
    - text: is not known, but can be estimated from the data. This estimate of σ is known as the
    - emphasis [ref=f6e256]: residual standard error
    - text: ", and is given by the formula"
    - 'img "\\mathrm{RSE} = \\sqrt{\\mathrm{RSS}/(n - 2)}." [ref=f6e257]'
    - text: . Strictly speaking, when σ
    - superscript [ref=f6e258]: "2"
    - text: is estimated from the data we should write
    - 'img "\\widehat{\\mathrm{SE}}(\\hat{\\beta}_1)" [ref=f6e259]'
    - text: to indicate that an estimate has been made, but for simplicity of notation we will drop this extra “hat”.
  - paragraph [ref=f6e260]: residual standard error
  - paragraph [ref=f6e261]:
    - text: Standard errors can be used to compute
    - emphasis [ref=f6e262]: confidence intervals
    - text: ". A 95 % confidence interval is defined as a range of values such that with 95 % probability, the range will contain the true unknown value of the parameter. The range is defined in terms of lower and upper limits computed from the sample of data. A 95% confidence interval has the following property: if we take repeated samples and construct the confidence interval for each sample, 95% of the intervals will contain the true unknown value of the parameter. For linear regression, the 95 % confidence interval for β"
    - subscript [ref=f6e263]: "1"
    - text: approximately takes the form
  - paragraph [ref=f6e264]: confidence interval
  - generic [ref=f6e265]:
    - 'img "\\hat{\\beta}_1 \\pm 2 \\cdot \\mathrm{SE}(\\hat{\\beta}_1)." [ref=f6e266]'
    - text: (3.9)
  - complementary [ref=f6e267]:
    - superscript [ref=f6e268]: "2"
    - text: This formula holds provided that the n observations are uncorrelated.
  - paragraph [ref=f6e269]: That is, there is approximately a 95 % chance that the interval
  - generic [ref=f6e270]:
    - 'img "\\left[\\hat{\\beta}_1 - 2 \\cdot \\mathrm{SE}(\\hat{\\beta}_1),\\ \\hat{\\beta}_1 + 2 \\cdot \\mathrm{SE}(\\hat{\\beta}_1)\\right]" [ref=f6e271]'
    - text: (3.10)
  - paragraph [ref=f6e272]:
    - text: will contain the true value of β
    - subscript [ref=f6e273]: "1"
    - text: .
    - superscript [ref=f6e274]:
      - link "3" [ref=f6e275] [cursor=pointer]:
        - /url: ch04.xhtml#b62
    - text: Similarly, a confidence interval for β
    - subscript [ref=f6e276]: "0"
    - text: approximately takes the form
  - generic [ref=f6e277]:
    - 'img "\\hat{\\beta}_0 \\pm 2 \\cdot \\mathrm{SE}(\\hat{\\beta}_0)." [ref=f6e278]'
    - text: (3.11)
  - paragraph [ref=f6e279]:
    - text: In the case of the advertising data, the 95 % confidence interval for β
    - subscript [ref=f6e280]: "0"
    - text: is [6.130, 7.935] and the 95 % confidence interval for β
    - subscript [ref=f6e281]: "1"
    - text: is [0.042, 0.053]. Therefore, we can conclude that in the absence of any advertising, sales will, on average, fall somewhere between 6,130 and 7,935 units. Furthermore, for each $1,000 increase in television advertising, there will be an average increase in sales of between 42 and 53 units.
  - paragraph [ref=f6e282]:
    - text: Standard errors can also be used to perform
    - emphasis [ref=f6e283]: hypothesis tests
    - text: on the coefficients. The most common hypothesis test involves testing the
    - emphasis [ref=f6e284]: null hypothesis
    - text: of H
    - subscript [ref=f6e285]: "0"
    - text: ": There is no relationship between X and Y versus the"
    - emphasis [ref=f6e286]: alternative hypothesis
    - text: H
    - subscript [ref=f6e287]: a
    - text: ": There is some relationship between X and Y . Mathematically, this corresponds to testing"
  - paragraph [ref=f6e288]: hypothesis test null hypothesis · alternative hypothesis
  - 'img "H_0 : \\beta_1 = 0" [ref=f6e290]'
  - paragraph [ref=f6e291]: versus
  - 'img "H_a : \\beta_1 \\neq 0," [ref=f6e293]'
  - paragraph [ref=f6e294]:
    - text: since if β
    - subscript [ref=f6e295]: "1"
    - text: = 0 then the model (
    - link "3.5" [ref=f6e296] [cursor=pointer]:
      - /url: ch04.xhtml#b33
    - text: ) reduces to Y = β
    - subscript [ref=f6e297]: "0"
    - text: + ϵ, and X is not associated with Y . To test the null hypothesis, we need to determine whether
    - 'img "\\hat{\\beta}_{1}" [ref=f6e298]'
    - text: ", our estimate for β"
    - subscript [ref=f6e299]: "1"
    - text: ", is sufficiently far from zero that we can be confident that β"
    - subscript [ref=f6e300]: "1"
    - text: is non-zero. How far is far enough? This of course depends on the accuracy of
    - 'img "\\hat{\\beta}_{1}" [ref=f6e301]'
    - text: —that is, it depends on
    - 'img "\\mathrm{SE}(\\hat{\\beta}_{1})" [ref=f6e302]'
    - text: . If
    - 'img "\\mathrm{SE}(\\hat{\\beta}_{1})" [ref=f6e303]'
    - text: is small, then even relatively small values of
    - 'img "\\hat{\\beta}_{1}" [ref=f6e304]'
    - text: may provide strong evidence that
    - img "\\beta_1 \\neq 0" [ref=f6e305]
    - text: ", and hence that there is a relationship between X and Y . In contrast, if"
    - 'img "\\mathrm{SE}(\\hat{\\beta}_{1})" [ref=f6e306]'
    - text: is large, then
    - 'img "\\hat{\\beta}_{1}" [ref=f6e307]'
    - text: must be large in absolute value in order for us to reject the null hypothesis. In practice, we compute a t
    - emphasis [ref=f6e308]: "-statistic"
    - text: ", given by"
  - paragraph [ref=f6e309]: t-statistic
  - generic [ref=f6e310]:
    - 'img "t = \\frac{\\hat{\\beta}_1 - 0}{\\mathrm{SE}(\\hat{\\beta}_1)}," [ref=f6e311]'
    - text: (3.14)
  - complementary [ref=f6e312]:
    - superscript [ref=f6e313]: "3"
    - emphasis [ref=f6e314]: Approximately
    - text: for several reasons. Equation
    - link "3.10" [ref=f6e315] [cursor=pointer]:
      - /url: ch04.xhtml#b52
    - text: relies on the assumption that the errors are Gaussian. Also, the factor of 2 in front of the
    - 'img "\\mathrm{SE}(\\hat{\\beta}_{1})" [ref=f6e316]'
    - text: term will vary slightly depending on the number of observations n in the linear regression. To be precise, rather than the number 2, (
    - link "3.10" [ref=f6e317] [cursor=pointer]:
      - /url: ch04.xhtml#b52
    - text: ) should contain the 97.5 % quantile of a t-distribution with n−2 degrees of freedom. Details of how to compute the 95 % confidence interval precisely in
    - code [ref=f6e318]: R
    - text: will be provided later in this chapter.
  - generic [ref=f6e319]:
    - table [ref=f6e320]:
      - rowgroup [ref=f6e321]:
        - row [ref=f6e322]:
          - columnheader [ref=f6e323]
          - columnheader "Coefficient" [ref=f6e324]
          - columnheader "Std. error" [ref=f6e325]
          - columnheader "t-statistic" [ref=f6e326]
          - columnheader "p-value" [ref=f6e327]
      - rowgroup [ref=f6e328]:
        - row [ref=f6e329]:
          - rowheader [ref=f6e330]:
            - code [ref=f6e331]: Intercept
          - cell "7.0325" [ref=f6e332]
          - cell "0.4578" [ref=f6e333]
          - cell "15.36" [ref=f6e334]
          - cell "< 0.0001" [ref=f6e335]
        - row [ref=f6e336]:
          - rowheader [ref=f6e337]:
            - code [ref=f6e338]: TV
          - cell "0.0475" [ref=f6e339]
          - cell "0.0027" [ref=f6e340]
          - cell "17.67" [ref=f6e341]
          - cell "< 0.0001" [ref=f6e342]
    - paragraph [ref=f6e343]:
      - text: TABLE 3.1.
      - emphasis [ref=f6e344]: For the
      - code [ref=f6e345]: Advertising
      - emphasis [ref=f6e346]: data, coefficients of the least squares model for the regression of number of units sold on TV advertising budget. An increase of
      - text: $1,000
      - emphasis [ref=f6e347]: in the TV advertising budget is associated with an increase in sales by around 50 units. (Recall that the
      - code [ref=f6e348]: sales
      - emphasis [ref=f6e349]: variable is in thousands of units, and the
      - code [ref=f6e350]: TV
      - emphasis [ref=f6e351]: variable is in thousands of dollars.)
  - paragraph [ref=f6e352]:
    - text: which measures the number of standard deviations that
    - 'img "\\hat{\\beta}_{1}" [ref=f6e353]'
    - text: is away from 0. If there really is no relationship between X and Y , then we expect that (
    - link "3.14" [ref=f6e354] [cursor=pointer]:
      - /url: ch04.xhtml#b62
    - text: ) will have a t-distribution with n −2 degrees of freedom. The t-distribution has a bell shape and for values of n greater than approximately 30 it is quite similar to the standard normal distribution. Consequently, it is a simple matter to compute the probability of observing any number equal to |t| or larger in absolute value, assuming β
    - subscript [ref=f6e355]: "1"
    - text: = 0. We call this probability the p
    - emphasis [ref=f6e356]: "-value"
    - text: ". Roughly speaking, we interpret the p-value as follows: a small p-value indicates that it is unlikely to observe such a substantial association between the predictor and the response due to chance, in the absence of any real association between the predictor and the response. Hence, if we see a small p-value, then we can infer that there is an association between the predictor and the response. We"
    - emphasis [ref=f6e357]: reject the null hypothesis
    - text: —that is, we declare a relationship to exist between X and Y —if the p-value is small enough. Typical p-value cutoffs for rejecting the null hypothesis are 5% or 1%, although this topic will be explored in much greater detail in Chapter
    - link "13" [ref=f6e358] [cursor=pointer]:
      - /url: ch14.xhtml#b0
    - text: . When n = 30, these correspond to t-statistics (
    - link "3.14" [ref=f6e359] [cursor=pointer]:
      - /url: ch04.xhtml#b62
    - text: ) of around 2 and 2.75, respectively.
  - paragraph [ref=f6e360]: p-value
  - paragraph [ref=f6e361]:
    - text: Table
    - link "3.1" [ref=f6e362] [cursor=pointer]:
      - /url: ch04.xhtml#b64
    - text: provides details of the least squares model for the regression of number of units sold on TV advertising budget for the
    - code [ref=f6e363]: Advertising
    - text: data. Notice that the coefficients for
    - 'img "\\hat{\\beta}_{0}" [ref=f6e364]'
    - text: and
    - 'img "\\hat{\\beta}_{1}" [ref=f6e365]'
    - text: are very large relative to their standard errors, so the t-statistics are also large; the probabilities of seeing such values if H
    - subscript [ref=f6e366]: "0"
    - text: is true are virtually zero. Hence we can conclude that
    - img "\\beta_0 \\neq 0" [ref=f6e367]
    - text: and
    - img "\\beta_1 \\neq 0" [ref=f6e368]
    - text: .
    - superscript [ref=f6e369]:
      - link "4" [ref=f6e370] [cursor=pointer]:
        - /url: ch04.xhtml#b69
  - heading "3.1.3 Assessing the Accuracy of the Model" [level=3] [ref=f6e371]
  - paragraph [ref=f6e372]:
    - text: Once we have rejected the null hypothesis (
    - link "3.12" [ref=f6e373] [cursor=pointer]:
      - /url: ch04.xhtml#b58
    - text: ) in favor of the alternative hypothesis (
    - link "3.13" [ref=f6e374] [cursor=pointer]:
      - /url: ch04.xhtml#b58
    - text: ), it is natural to want to quantify
    - emphasis [ref=f6e375]: the extent to which the model fits the data
    - text: ". The quality of a linear regression fit is typically assessed using two related quantities: the"
    - emphasis [ref=f6e376]: residual standard error
    - text: (RSE) and the R
    - superscript [ref=f6e377]: "2"
    - text: statistic.
  - paragraph [ref=f6e378]:
    - text: R
    - superscript [ref=f6e379]: "2"
  - complementary [ref=f6e380]:
    - superscript [ref=f6e381]: "4"
    - text: In Table
    - link "3.1" [ref=f6e382] [cursor=pointer]:
      - /url: ch04.xhtml#b64
    - text: ", a small p-value for the intercept indicates that we can reject the null hypothesis that β"
    - subscript [ref=f6e383]: "0"
    - text: = 0, and a small p-value for
    - code [ref=f6e384]: TV
    - text: indicates that we can reject the null hypothesis that β
    - subscript [ref=f6e385]: "1"
    - text: = 0. Rejecting the latter null hypothesis allows us to conclude that there is a relationship between
    - code [ref=f6e386]: TV
    - text: and
    - code [ref=f6e387]: sales
    - text: . Rejecting the former allows us to conclude that in the absence of
    - code [ref=f6e388]: TV
    - text: expenditure,
    - code [ref=f6e389]: sales
    - text: are non-zero.
  - generic [ref=f6e390]:
    - table [ref=f6e391]:
      - rowgroup [ref=f6e392]:
        - row [ref=f6e393]:
          - columnheader "Quantity" [ref=f6e394]
          - columnheader "Value" [ref=f6e395]
      - rowgroup [ref=f6e396]:
        - row [ref=f6e397]:
          - rowheader "Residual standard error" [ref=f6e398]
          - cell "3.26" [ref=f6e399]
        - row [ref=f6e400]:
          - rowheader [ref=f6e401]:
            - text: R
            - superscript [ref=f6e402]: "2"
          - cell "0.612" [ref=f6e403]
        - row [ref=f6e404]:
          - rowheader "F-statistic" [ref=f6e405]
          - cell "312.1" [ref=f6e406]
    - paragraph [ref=f6e407]:
      - text: TABLE 3.2.
      - emphasis [ref=f6e408]: For the
      - code [ref=f6e409]: Advertising
      - emphasis [ref=f6e410]: data, more information about the least squares model for the regression of number of units sold on TV advertising budget.
  - paragraph [ref=f6e411]:
    - text: Table
    - link "3.2" [ref=f6e412] [cursor=pointer]:
      - /url: ch04.xhtml#b70
    - text: displays the RSE, the R
    - superscript [ref=f6e413]: "2"
    - text: statistic, and the F-statistic (to be described in Section
    - link "3.2.2" [ref=f6e414] [cursor=pointer]:
      - /url: ch04.xhtml#b112
    - text: ) for the linear regression of number of units sold on TV advertising budget.
  - heading "Residual Standard Error" [level=4] [ref=f6e415]
  - paragraph [ref=f6e416]:
    - text: Recall from the model (
    - link "3.5" [ref=f6e417] [cursor=pointer]:
      - /url: ch04.xhtml#b33
    - text: ) that associated with each observation is an error term ϵ. Due to the presence of these error terms, even if we knew the true regression line (i.e. even if β
    - subscript [ref=f6e418]: "0"
    - text: and β
    - subscript [ref=f6e419]: "1"
    - text: were known), we would not be able to perfectly predict Y from X. The RSE is an estimate of the standard deviation of ϵ. Roughly speaking, it is the average amount that the response will deviate from the true regression line. It is computed using the formula
  - generic [ref=f6e420]:
    - 'img "\\mathrm{RSE} = \\sqrt{\\frac{1}{n-2}\\mathrm{RSS}} = \\sqrt{\\frac{1}{n-2}\\sum_{i=1}^{n}(y_i - \\hat{y}_i)^2}." [ref=f6e421]'
    - text: (3.15)
  - paragraph [ref=f6e422]:
    - text: Note that RSS was defined in Section
    - link "3.1.1" [ref=f6e423] [cursor=pointer]:
      - /url: ch04.xhtml#b18
    - text: ", and is given by the formula"
  - generic [ref=f6e424]:
    - 'img "\\mathrm{RSS} = \\sum_{i=1}^{n}(y_i - \\hat{y}_i)^2." [ref=f6e425]'
    - text: (3.16)
  - paragraph [ref=f6e426]:
    - text: In the case of the advertising data, we see from the linear regression output in Table
    - link "3.2" [ref=f6e427] [cursor=pointer]:
      - /url: ch04.xhtml#b70
    - text: that the RSE is 3.26. In other words, actual sales in each market deviate from the true regression line by approximately 3,260 units, on average. Another way to think about this is that even if the model were correct and the true values of the unknown coefficients β
    - subscript [ref=f6e428]: "0"
    - text: and β
    - subscript [ref=f6e429]: "1"
    - text: were known exactly, any prediction of sales on the basis of TV advertising would still be off by about 3,260 units on average. Of course, whether or not 3,260 units is an acceptable prediction error depends on the problem context. In the advertising data set, the mean value of
    - code [ref=f6e430]: sales
    - text: over all markets is approximately 14,000 units, and so the percentage error is 3,260/14,000 = 23 %.
  - paragraph [ref=f6e431]:
    - text: The RSE is considered a measure of the
    - emphasis [ref=f6e432]: lack of fit
    - text: of the model (
    - link "3.5" [ref=f6e433] [cursor=pointer]:
      - /url: ch04.xhtml#b33
    - text: ) to the data. If the predictions obtained using the model are very close to the true outcome values—that is, if
    - 'img "\\hat{y}_{i} \\approx y_{i}" [ref=f6e434]'
    - text: for i = 1, . . . , n—then (
    - link "3.15" [ref=f6e435] [cursor=pointer]:
      - /url: ch04.xhtml#b74
    - text: ) will be small, and we can conclude that the model fits the data very well. On the other hand, if
    - 'img "\\hat{y}_{i}" [ref=f6e436]'
    - text: is very far from y
    - subscript [ref=f6e437]: i
    - text: for one or more observations, then the RSE may be quite large, indicating that the model doesn’t fit the data well.
  - heading [level=4] [ref=f6e438]:
    - text: R
    - superscript [ref=f6e439]: "2"
    - text: Statistic
  - paragraph [ref=f6e440]:
    - text: The RSE provides an absolute measure of lack of fit of the model (
    - link "3.5" [ref=f6e441] [cursor=pointer]:
      - /url: ch04.xhtml#b33
    - text: ) to the data. But since it is measured in the units of Y , it is not always clear what constitutes a good RSE. The R
    - superscript [ref=f6e442]: "2"
    - text: statistic provides an alternative measure of fit. It takes the form of a
    - emphasis [ref=f6e443]: proportion
    - text: —the proportion of variance explained—and so it always takes on a value between 0 and 1, and is independent of the scale of Y .
  - paragraph [ref=f6e444]:
    - text: To calculate R
    - superscript [ref=f6e445]: "2"
    - text: ", we use the formula"
  - generic [ref=f6e446]:
    - 'img "R^2 = \\frac{\\mathrm{TSS} - \\mathrm{RSS}}{\\mathrm{TSS}} = 1 - \\frac{\\mathrm{RSS}}{\\mathrm{TSS}}" [ref=f6e447]'
    - text: (3.17)
  - paragraph [ref=f6e448]:
    - text: where
    - 'img "\\mathrm{TSS} = \\sum(y_i - \\bar{y})^2" [ref=f6e449]'
    - text: is the
    - emphasis [ref=f6e450]: total sum of squares
    - text: ", and RSS is defined in ("
    - link "3.16" [ref=f6e451] [cursor=pointer]:
      - /url: ch04.xhtml#b74
    - text: ). TSS measures the total variance in the response Y , and can be thought of as the amount of variability inherent in the response before the regression is performed. In contrast, RSS measures the amount of variability that is left unexplained after performing the regression. Hence, TSS −RSS measures the amount of variability in the response that is explained (or removed) by performing the regression, and R
    - superscript [ref=f6e452]: "2"
    - text: measures the
    - emphasis [ref=f6e453]: proportion of variability in
    - text: "Y"
    - emphasis [ref=f6e454]: that can be explained using
    - text: X. An R
    - superscript [ref=f6e455]: "2"
    - text: statistic that is close to 1 indicates that a large proportion of the variability in the response is explained by the regression. A number near 0 indicates that the regression does not explain much of the variability in the response; this might occur because the linear model is wrong, or the error variance σ
    - superscript [ref=f6e456]: "2"
    - text: is high, or both. In Table
    - link "3.2" [ref=f6e457] [cursor=pointer]:
      - /url: ch04.xhtml#b70
    - text: ", the R"
    - superscript [ref=f6e458]: "2"
    - text: was 0.61, and so just under two-thirds of the variability in
    - code [ref=f6e459]: sales
    - text: is explained by a linear regression on
    - code [ref=f6e460]: TV
    - text: .
  - paragraph [ref=f6e461]: total sum of squares
  - paragraph [ref=f6e462]:
    - text: The R
    - superscript [ref=f6e463]: "2"
    - text: statistic (
    - link "3.17" [ref=f6e464] [cursor=pointer]:
      - /url: ch04.xhtml#b81
    - text: ) has an interpretational advantage over the RSE (
    - link "3.15" [ref=f6e465] [cursor=pointer]:
      - /url: ch04.xhtml#b74
    - text: ), since unlike the RSE, it always lies between 0 and 1. However, it can still be challenging to determine what is a
    - emphasis [ref=f6e466]: good
    - text: R
    - superscript [ref=f6e467]: "2"
    - text: value, and in general, this will depend on the application. For instance, in certain problems in physics, we may know that the data truly comes from a linear model with a small residual error. In this case, we would expect to see an R
    - superscript [ref=f6e468]: "2"
    - text: value that is extremely close to 1, and a substantially smaller R
    - superscript [ref=f6e469]: "2"
    - text: value might indicate a serious problem with the experiment in which the data were generated. On the other hand, in typical applications in biology, psychology, marketing, and other domains, the linear model (
    - link "3.5" [ref=f6e470] [cursor=pointer]:
      - /url: ch04.xhtml#b33
    - text: ) is at best an extremely rough approximation to the data, and residual errors due to other unmeasured factors are often very large. In this setting, we would expect only a very small proportion of the variance in the response to be explained by the predictor, and an R
    - superscript [ref=f6e471]: "2"
    - text: value well below 0.1 might be more realistic!
  - paragraph [ref=f6e472]:
    - text: The R
    - superscript [ref=f6e473]: "2"
    - text: statistic is a measure of the linear relationship between X and Y . Recall that
    - emphasis [ref=f6e474]: correlation
