    - code [ref=e108]: seniority
    - text: . Here f is a two-dimensional surface that must be estimated based on the observed data.
  - paragraph [ref=e109]: In essence, statistical learning refers to a set of approaches for estimating f. In this chapter we outline some of the key theoretical concepts that arise in estimating f, as well as tools for evaluating the estimates obtained.
  - heading "2.1.1 Why Estimate f?" [level=3] [ref=e110]
  - paragraph [ref=e111]:
    - text: "There are two main reasons that we may wish to estimate f:"
    - emphasis [ref=e112]: prediction
    - text: and
    - emphasis [ref=e113]: inference
    - text: . We discuss each in turn.
  - heading "Prediction" [level=4] [ref=e114]
  - paragraph [ref=e115]: In many situations, a set of inputs X are readily available, but the output Y cannot be easily obtained. In this setting, since the error term averages to zero, we can predict Y using
  - generic [ref=e116]:
    - img "Yˆ = fˆ(X)," [ref=e117]
    - text: (2.2)
  - paragraph [ref=e118]:
    - text: where
    - 'img "\\hat{f}" [ref=e119]'
    - text: represents our estimate for f, and
    - 'img "\\hat{Y}" [ref=e120]'
    - text: represents the resulting prediction for Y . In this setting,
    - 'img "\\hat{f}" [ref=e121]'
    - text: is often treated as a
    - emphasis [ref=e122]: black box
    - text: ", in the sense that one is not typically concerned with the exact form of"
    - 'img "\\hat{f}" [ref=e123]'
    - text: ", provided that it yields accurate predictions for Y ."
  - paragraph [ref=e124]:
    - text: As an example, suppose that X
    - subscript [ref=e125]: "1"
    - text: ", . . . , X"
    - subscript [ref=e126]: p
    - text: are characteristics of a patient’s blood sample that can be easily measured in a lab, and Y is a variable encoding the patient’s risk for a severe adverse reaction to a particular drug. It is natural to seek to predict Y using X, since we can then avoid giving the drug in question to patients who are at high risk of an adverse reaction—that is, patients for whom the estimate of Y is high.
  - paragraph [ref=e127]:
    - text: The accuracy of
    - 'img "\\hat{Y}" [ref=e128]'
    - text: as a prediction for Y depends on two quantities, which we will call the
    - emphasis [ref=e129]: reducible error
    - text: and the
    - emphasis [ref=e130]: irreducible error
    - text: . In general,
    - 'img "\\hat{f}" [ref=e131]'
    - text: will not be a perfect estimate for f, and this inaccuracy will introduce some error. This error is
    - emphasis [ref=e132]: reducible
    - text: because we can potentially improve the accuracy of
    - 'img "\\hat{f}" [ref=e133]'
    - text: by using the most appropriate statistical learning technique to estimate f. However, even if it were possible to form a perfect estimate for f, so that our estimated response took the form
    - 'img "\\hat{Y} = f(X)" [ref=e134]'
    - text: ", our prediction would still have some error in it! This is because Y is also a function of ϵ, which, by definition, cannot be predicted using X. Therefore, variability associated with ϵ also affects the accuracy of our predictions. This is known as the"
    - emphasis [ref=e135]: irreducible
    - text: error, because no matter how well we estimate f, we cannot reduce the error introduced by ϵ.
  - paragraph [ref=e136]: reducible
  - paragraph [ref=e137]: error
  - paragraph [ref=e138]: irreducible
  - paragraph [ref=e139]: error
  - paragraph [ref=e140]: "Why is the irreducible error larger than zero? The quantity ϵ may contain unmeasured variables that are useful in predicting Y : since we don’t"
  - generic [ref=e141]:
    - img "figure 2.3" [ref=e142]
