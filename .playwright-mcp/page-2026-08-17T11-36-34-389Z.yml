  - paragraph [ref=e516]: In contrast, the orange least squares line is relatively inflexible and has low variance, because moving any single observation will likely cause only a small shift in the position of the line.
  - paragraph [ref=e517]:
    - text: On the other hand,
    - emphasis [ref=e518]: bias
    - text: refers to the error that is introduced by approximating a real-life problem, which may be extremely complicated, by a much simpler model. For example, linear regression assumes that there is a linear relationship between Y and X
    - subscript [ref=e519]: "1"
    - text: ", X"
