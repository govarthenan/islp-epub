  - paragraph [ref=e275]:
    - text: Since we have assumed a linear relationship between the response and the two predictors, the entire fitting problem reduces to estimating β
    - subscript [ref=e276]: "0"
    - text: ", β"
    - subscript [ref=e277]: "1"
    - text: ", and β"
    - subscript [ref=e278]: "2"
    - text: ", which we do using least squares linear regression. Comparing Figure 2.3 to Figure 2.4, we can see that the linear fit given in Figure 2.4 is not quite right: the true f has some curvature that is not captured in the linear fit. However, the linear fit still appears to do a reasonable job of capturing the positive relationship between"
    - code [ref=e279]: years of education
    - text: and
