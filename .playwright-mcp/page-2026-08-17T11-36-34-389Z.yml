  - heading "2.1.5 Regression Versus Classification Problems" [level=3] [ref=e366]
  - paragraph [ref=e367]:
    - text: Variables can be characterized as either
    - emphasis [ref=e368]: quantitative
    - text: or
    - emphasis [ref=e369]: qualitative
    - text: (also known as
    - emphasis [ref=e370]: categorical
    - text: ). Quantitative variables take on numerical values. Examples include a person’s age, height, or income, the value of a house, and the price of a stock. In contrast, qualitative variables take on values in one of K different
    - emphasis [ref=e371]: classes
    - text: ", or categories. Examples of qualitative variables include a person’s marital status (married or not), the brand of product purchased (brand A, B, or C), whether a person defaults on a debt (yes or no), or a cancer diagnosis (Acute Myelogenous Leukemia, Acute Lymphoblastic Leukemia, or No Leukemia). We tend to refer to problems with a quantitative response as"
    - emphasis [ref=e372]: regression
    - text: problems, while those involving a qualitative response are often referred to as
    - emphasis [ref=e373]: classification
    - text: problems. However, the distinction is not always that crisp. Least squares linear regression (Chapter 3) is used with a quantitative response, whereas logistic regression (Chapter 4) is typically used with a qualitative (two-class, or
    - emphasis [ref=e374]: binary
    - text: ) response. Thus, despite its name, logistic regression is a classification method. But since it estimates class probabilities, it can be thought of as a regression method as well. Some statistical methods, such as K-nearest neighbors (Chapters 2 and 4) and boosting (Chapter 8), can be used in the case of either quantitative or qualitative responses.
  - paragraph [ref=e375]: quantitative
  - paragraph [ref=e376]: qualitative
  - paragraph [ref=e377]: categorical
  - paragraph [ref=e378]: class
  - paragraph [ref=e379]: regression
  - paragraph [ref=e380]: classification
  - paragraph [ref=e381]: binary
  - paragraph [ref=e382]:
    - text: We tend to select statistical learning methods on the basis of whether the response is quantitative or qualitative; i.e. we might use linear regression when quantitative and logistic regression when qualitative. However, whether the
    - emphasis [ref=e383]: predictors
    - text: are qualitative or quantitative is generally considered less important. Most of the statistical learning methods discussed in this book can be applied regardless of the predictor variable type, provided that any qualitative predictors are properly
    - emphasis [ref=e384]: coded
    - text: before the analysis is performed. This is discussed in Chapter 3.
  - heading "2.2 Assessing Model Accuracy" [level=2] [ref=e385]
  - paragraph [ref=e386]:
    - text: One of the key aims of this book is to introduce the reader to a wide range of statistical learning methods that extend far beyond the standard linear regression approach. Why is it necessary to introduce so many different statistical learning approaches, rather than just a single
    - emphasis [ref=e387]: best
    - text: method?
    - emphasis [ref=e388]: "There is no free lunch in statistics:"
    - text: no one method dominates all others over all possible data sets. On a particular data set, one specific method may work best, but some other method may work better on a similar but different data set. Hence it is an important task to decide for any given set of data which method produces the best results. Selecting the best approach can be one of the most challenging parts of performing statistical learning in practice.
  - paragraph [ref=e389]: In this section, we discuss some of the most important concepts that arise in selecting a statistical learning procedure for a specific data set. As the book progresses, we will explain how the concepts presented here can be applied in practice.
