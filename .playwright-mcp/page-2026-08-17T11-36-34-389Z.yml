  - paragraph [ref=e328]: vector
  - paragraph [ref=e329]: We have established that when inference is the goal, there are clear advantages to using simple and relatively inflexible statistical learning methods. In some settings, however, we are only interested in prediction, and the interpretability of the predictive model is simply not of interest. For instance, if we seek to develop an algorithm to predict the price of a stock, our sole requirement for the algorithm is that it predict accurately— interpretability is not a concern. In this setting, we might expect that it will be best to use the most flexible model available. Surprisingly, this is not always the case! We will often obtain more accurate predictions using a less flexible method. This phenomenon, which may seem counterintuitive at first glance, has to do with the potential for overfitting in highly flexible methods. We saw an example of overfitting in Figure 2.6. We will discuss this very important concept further in Section 2.2 and throughout this book.
  - heading "2.1.4 Supervised Versus Unsupervised Learning" [level=3] [ref=e330]
  - paragraph [ref=e331]:
    - text: "Most statistical learning problems fall into one of two categories:"
    - emphasis [ref=e332]: supervised
    - text: or
    - emphasis [ref=e333]: unsupervised
    - text: . The examples that we have discussed so far in this chapter all fall into the supervised learning domain. For each observation of the predictor measurement(s) x
    - subscript [ref=e334]: i
    - text: ", i = 1, . . . , n there is an associated response measurement y"
    - subscript [ref=e335]: i
    - text: . We wish to fit a model that relates the response to the predictors, with the aim of accurately predicting the response for future observations (prediction) or better understanding the relationship between the response and the predictors (inference). Many classical statistical learning methods such as linear regression and
    - emphasis [ref=e336]: logistic regression
    - text: (Chapter 4), as well as more modern approaches such as GAM, boosting, and support vector machines, operate in the supervised learning domain. The vast majority of this book is devoted to this setting.
  - paragraph [ref=e337]: supervised
  - paragraph [ref=e338]: unsupervised
  - paragraph [ref=e339]: logistic
  - paragraph [ref=e340]: regression
  - paragraph [ref=e341]:
    - text: By contrast, unsupervised learning describes the somewhat more challenging situation in which for every observation i = 1, . . . , n, we observe a vector of measurements x
    - subscript [ref=e342]: i
    - text: but no associated response y
    - subscript [ref=e343]: i
    - text: . It is not possible to fit a linear regression model, since there is no response variable to predict. In this setting, we are in some sense working blind; the situation is referred to as
    - emphasis [ref=e344]: unsupervised
    - text: because we lack a response variable that can supervise our analysis. What sort of statistical analysis is possible? We can seek to understand the relationships between the variables or between the observations. One statistical learning tool that we may use in this setting is
    - emphasis [ref=e345]: cluster analysis
    - text: ", or clustering. The goal of cluster analysis is to ascertain, on the basis of x"
    - subscript [ref=e346]: "1"
    - text: ", . . . , x"
    - subscript [ref=e347]: "n"
    - text: ", whether the observations fall into relatively distinct groups. For example, in a market segmentation study we might observe multiple characteristics (variables) for potential customers, such as zip code, family income, and shopping habits. We might believe that the customers fall into different groups, such as big spenders versus low spenders. If the information about each customer’s spending patterns were available, then a supervised analysis would be possible. However, this information is not available—that is, we do not know whether each potential customer is a big spender or not. In this setting, we can try to cluster the customers on the basis of the variables measured, in order to identify"
  - paragraph [ref=e348]: cluster
