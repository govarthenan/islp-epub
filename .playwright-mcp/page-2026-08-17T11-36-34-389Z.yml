    - text: The MSE in (2.5) is computed using the training data that was used to fit the model, and so should more accurately be referred to as the
    - emphasis [ref=e404]: training MSE
    - text: . But in general, we do not really care how well the method works on the training data. Rather,
    - emphasis [ref=e405]: we are interested in the accuracy of the predictions that we obtain when we apply our method to previously unseen test data
    - text: . Why is this what we care about? Suppose that we are interested in developing an algorithm to predict a stock’s price based on previous stock returns. We can train the method using stock returns from the past 6 months. But we don’t really care how well our method predicts last week’s stock price. We instead care about how well it will predict tomorrow’s price or next month’s price. On a similar note, suppose that we have clinical measurements (e.g. weight, blood pressure, height, age, family history of disease) for a number of patients, as well as information about whether each patient has diabetes. We can use these patients to train a statistical learning method to predict risk of diabetes based on clinical measurements. In practice, we want this method to accurately predict diabetes risk for
    - emphasis [ref=e406]: future patients
