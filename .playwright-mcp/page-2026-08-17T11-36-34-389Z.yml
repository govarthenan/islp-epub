  - paragraph [ref=e311]:
    - text: Figure 2.7 provides an illustration of the trade-off between flexibility and interpretability for some of the methods that we cover in this book. Least squares linear regression, discussed in Chapter 3, is relatively inflexible but is quite interpretable. The
    - emphasis [ref=e312]: lasso
