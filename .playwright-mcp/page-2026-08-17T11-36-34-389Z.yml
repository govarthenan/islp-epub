  - paragraph [ref=e160]: measure them, f cannot use them for its prediction. The quantity ϵ may also contain unmeasurable variation. For example, the risk of an adverse reaction might vary for a given patient on a given day, depending on manufacturing variation in the drug itself or the patient’s general feeling of well-being on that day.
  - paragraph [ref=e161]:
    - text: Consider a given estimate
    - 'img "\\hat{f}" [ref=e162]'
    - text: and a set of predictors X, which yields the prediction
    - 'img "\\hat{Y} = \\hat{f}(X)" [ref=e163]'
    - text: . Assume for a moment that both
    - 'img "\\hat{f}" [ref=e164]'
    - text: and X are fixed, so that the only variability comes from ϵ. Then, it is easy to show that
  - generic [ref=e165]:
    - img "E(Y −Yˆ )2=E[f(X) + ϵ −fˆ(X)]2 =[f(X) −fˆ(X)]2+Var(ϵ), ��������" [ref=e166]
    - text: (2.3)
  - paragraph [ref=e167]:
    - text: Reducible Irreducible where
    - 'img "\\mathrm{E}(Y - \\hat{Y} )^{2}" [ref=e168]'
    - text: represents the average, or
    - emphasis [ref=e169]: expected value
    - text: ", of the squared difference between the predicted and actual value of Y , and Var(ϵ) represents the"
    - emphasis [ref=e170]: variance
    - text: associated with the error term ϵ.
  - paragraph [ref=e171]: expected
  - paragraph [ref=e172]: value
  - paragraph [ref=e173]: variance
  - paragraph [ref=e174]: The focus of this book is on techniques for estimating f with the aim of minimizing the reducible error. It is important to keep in mind that the irreducible error will always provide an upper bound on the accuracy of our prediction for Y . This bound is almost always unknown in practice.
  - heading "Inference" [level=4] [ref=e175]
  - paragraph [ref=e176]:
    - text: We are often interested in understanding the association between Y and X
    - subscript [ref=e177]: "1"
    - text: ", . . . , X"
    - subscript [ref=e178]: p
    - text: . In this situation we wish to estimate f, but our goal is not necessarily to make predictions for Y . Now
    - 'img "\\hat{f}" [ref=e179]'
    - text: "cannot be treated as a black box, because we need to know its exact form. In this setting, one may be interested in answering the following questions: •"
    - emphasis [ref=e180]: Which predictors are associated with the response?
    - text: It is often the case that only a small fraction of the available predictors are substantially associated with Y . Identifying the few
    - emphasis [ref=e181]: important
    - text: predictors among a large set of possible variables can be extremely useful, depending on the application. •
    - emphasis [ref=e182]: What is the relationship between the response and each predictor?
    - text: Some predictors may have a positive relationship with Y , in the sense that larger values of the predictor are associated with larger values of Y . Other predictors may have the opposite relationship. Depending on the complexity of f, the relationship between the response and a given predictor may also depend on the values of the other predictors. •
    - emphasis [ref=e183]: Can the relationship between
    - text: "Y"
    - emphasis [ref=e184]: and each predictor be adequately summarized using a linear equation, or is the relationship more complicated?
    - text: Historically, most methods for estimating f have taken a linear form. In some situations, such an assumption is reasonable or even desirable. But often the true relationship is more complicated, in which case a linear model may not provide an accurate representation of the relationship between the input and output variables.
  - paragraph [ref=e185]: In this book, we will see a number of examples that fall into the prediction setting, the inference setting, or a combination of the two.
  - paragraph [ref=e186]: For instance, consider a company that is interested in conducting a direct-marketing campaign. The goal is to identify individuals who are likely to respond positively to a mailing, based on observations of demographic variables measured on each individual. In this case, the demographic variables serve as predictors, and response to the marketing campaign (either positive or negative) serves as the outcome. The company is not interested in obtaining a deep understanding of the relationships between each individual predictor and the response; instead, the company simply wants to accurately predict the response using the predictors. This is an example of modeling for prediction.
  - paragraph [ref=e187]:
    - text: In contrast, consider the
    - code [ref=e188]: Advertising
    - text: "data illustrated in Figure 2.1. One may be interested in answering questions such as: –"
    - emphasis [ref=e189]: Which media are associated with sales?
    - text: –
    - emphasis [ref=e190]: Which media generate the biggest boost in sales?
    - text: or –
    - emphasis [ref=e191]: How large of an increase in sales is associated with a given increase in TV advertising?
    - text: This situation falls into the inference paradigm. Another example involves modeling the brand of a product that a customer might purchase based on variables such as price, store location, discount levels, competition price, and so forth. In this situation one might really be most interested in the association between each variable and the probability of purchase. For instance,
    - emphasis [ref=e192]: to what extent is the product’s price associated with sales?
    - text: This is an example of modeling for inference.
  - paragraph [ref=e193]:
    - text: Finally, some modeling could be conducted both for prediction and inference. For example, in a real estate setting, one may seek to relate values of homes to inputs such as crime rate, zoning, distance from a river, air quality, schools, income level of community, size of houses, and so forth. In this case one might be interested in the association between each individual input variable and housing price—for instance,
    - emphasis [ref=e194]: how much extra will a house be worth if it has a view of the river?
    - text: "This is an inference problem. Alternatively, one may simply be interested in predicting the value of a home given its characteristics:"
    - emphasis [ref=e195]: is this house under- or over-valued?
    - text: This is a prediction problem.
  - paragraph [ref=e196]:
    - text: Depending on whether our ultimate goal is prediction, inference, or a combination of the two, different methods for estimating f may be appropriate. For example,
    - emphasis [ref=e197]: linear models
    - text: allow for relatively simple and interpretable inference, but may not yield as accurate predictions as some other approaches. In contrast, some of the highly non-linear approaches that we discuss in the later chapters of this book can potentially provide quite accurate predictions for Y , but this comes at the expense of a less interpretable model for which inference is more challenging.
  - paragraph [ref=e198]: linear model
  - heading "2.1.2 How Do We Estimate f?" [level=3] [ref=e199]
  - paragraph [ref=e200]:
    - text: Throughout this book, we explore many linear and non-linear approaches for estimating f. However, these methods generally share certain characteristics. We provide an overview of these shared characteristics in this section. We will always assume that we have observed a set of n different data points. For example in Figure 2.2 we observed n = 30 data points. These observations are called the
    - emphasis [ref=e201]: training data
    - text: because we will use these observations to train, or teach, our method how to estimate f. Let x
    - subscript [ref=e202]: ij
    - text: represent the value of the jth predictor, or input, for observation i, where i = 1, 2, . . . , n and j = 1, 2, . . . , p. Correspondingly, let y
    - subscript [ref=e203]: i
    - text: "represent the response variable for the ith observation. Then our training data consist of {(x"
    - subscript [ref=e204]: "1"
    - text: ", y"
    - subscript [ref=e205]: "1"
    - text: ), (x
    - subscript [ref=e206]: "2"
    - text: ", y"
    - subscript [ref=e207]: "2"
    - text: ), . . . , (x
    - subscript [ref=e208]: "n"
    - text: ", y"
    - subscript [ref=e209]: "n"
    - text: ")} where x"
    - subscript [ref=e210]: i
    - text: = (x
    - subscript [ref=e211]: i1
    - text: ", x"
    - subscript [ref=e212]: i2
    - text: ", . . . , x"
    - subscript [ref=e213]: ip
    - text: )
    - superscript [ref=e214]: T
    - text: .
  - paragraph [ref=e215]: training
  - paragraph [ref=e216]: data
  - paragraph [ref=e217]:
    - text: Our goal is to apply a statistical learning method to the training data in order to estimate the unknown function f. In other words, we want to find a function
    - 'img "\\hat{f}" [ref=e218]'
    - text: such that
    - 'img "Y \\approx \\hat{f}(X)" [ref=e219]'
    - text: for any observation (X, Y ). Broadly speaking, most statistical learning methods for this task can be characterized as either
    - emphasis [ref=e220]: parametric
    - text: or
    - emphasis [ref=e221]: non-parametric
    - text: . We now briefly discuss these two types of approaches.
  - paragraph [ref=e222]: parametric
  - paragraph [ref=e223]: non-
  - paragraph [ref=e224]: parametric
  - heading "Parametric Methods" [level=4] [ref=e225]
  - paragraph [ref=e226]: Parametric methods involve a two-step model-based approach.
  - paragraph [ref=e227]: "1. First, we make an assumption about the functional form, or shape, of f. For example, one very simple assumption is that f is linear in X:"
  - generic [ref=e228]:
    - img "f(X) = β0 + β1X1 + β2X2 + · · · + βpXp." [ref=e229]
    - text: (2.4)
  - paragraph [ref=e230]:
    - text: This is a
    - emphasis [ref=e231]: linear model
    - text: ", which will be discussed extensively in Chapter 3. Once we have assumed that f is linear, the problem of estimating f is greatly simplified. Instead of having to estimate an entirely arbitrary p-dimensional function f(X), one only needs to estimate the p + 1 coefficients β"
    - subscript [ref=e232]: "0"
    - text: ", β"
    - subscript [ref=e233]: "1"
    - text: ", . . . , β"
    - subscript [ref=e234]: p
    - text: .
  - generic [ref=e235]:
    - img "figure 2.4" [ref=e236]
    - paragraph [ref=e237]:
      - text: FIGURE 2.4.
      - emphasis [ref=e238]: A linear model fit by least squares to the
      - code [ref=e239]: Income
      - emphasis [ref=e240]: data from Figure 2.3. The observations are shown in red, and the yellow plane indicates the least squares fit to the data.
  - paragraph [ref=e241]:
    - text: 2. After a model has been selected, we need a procedure that uses the training data to
    - emphasis [ref=e242]: fit
    - text: or
    - emphasis [ref=e243]: train
    - text: the model. In the case of the linear model (2.4), we need to estimate the parameters β
    - subscript [ref=e244]: "0"
    - text: ", β"
    - subscript [ref=e245]: "1"
    - text: ", . . . , β"
    - subscript [ref=e246]: p
    - text: . That is, we want to find values of these parameters such that
  - paragraph [ref=e247]: fit
  - paragraph [ref=e248]: train
  - img "Y ≈β0 + β1X1 + β2X2 + · · · + βpXp." [ref=e250]
  - paragraph [ref=e251]:
    - text: The most common approach to fitting the model (2.4) is referred to as
    - emphasis [ref=e252]: (ordinary) least squares
    - text: ", which we discuss in Chapter 3. However, least squares is one of many possible ways to fit the linear model. In Chapter 6, we discuss other approaches for estimating the parameters in (2.4)."
  - paragraph [ref=e253]: least squares
  - paragraph [ref=e254]:
    - text: The model-based approach just described is referred to as
    - emphasis [ref=e255]: parametric
    - text: ; it reduces the problem of estimating f down to one of estimating a set of parameters. Assuming a parametric form for f simplifies the problem of estimating f because it is generally much easier to estimate a set of parameters, such as β
    - subscript [ref=e256]: "0"
    - text: ", β"
    - subscript [ref=e257]: "1"
    - text: ", . . . , β"
    - subscript [ref=e258]: p
    - text: in the linear model (2.4), than it is to fit an entirely arbitrary function f. The potential disadvantage of a parametric approach is that the model we choose will usually not match the true unknown form of f. If the chosen model is too far from the true f, then our estimate will be poor. We can try to address this problem by choosing
    - emphasis [ref=e259]: flexible
    - text: models that can fit many different possible functional forms for f. But in general, fitting a more flexible model requires estimating a greater number of parameters. These more complex models can lead to a phenomenon known as
    - emphasis [ref=e260]: overfitting
    - text: the data, which essentially means they follow the errors, or
    - emphasis [ref=e261]: noise
    - text: ", too closely. These issues are discussed throughout this book."
  - paragraph [ref=e262]: flexible
  - paragraph [ref=e263]: overfitting
  - paragraph [ref=e264]: noise
  - paragraph [ref=e265]:
    - text: Figure 2.4 shows an example of the parametric approach applied to the
    - code [ref=e266]: Income
    - text: data from Figure 2.3. We have fit a linear model of the form
