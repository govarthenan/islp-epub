    - emphasis [ref=e505]: bias
    - text: of a statistical learning method?
    - emphasis [ref=e506]: Variance
    - text: refers to the amount by which
    - 'img "\\hat{f}" [ref=e507]'
    - text: would change if we estimated it using a different training data set. Since the training data are used to fit the statistical learning method, different training data sets will result in a different
    - 'img "\\hat{f}" [ref=e508]'
    - text: . But ideally the estimate for f should not vary too much between training sets. However, if a method has high variance then small changes in the training data can result in large changes in
    - 'img "\\hat{f}" [ref=e509]'
    - text: . In general, more flexible statistical methods have higher variance. Consider the green and orange curves in Figure 2.9. The flexible green curve is following the observations very closely. It has high variance because changing any one of these data points may cause the estimate
    - 'img "\\hat{f}" [ref=e510]'
