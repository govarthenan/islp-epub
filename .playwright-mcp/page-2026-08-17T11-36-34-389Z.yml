    - text: using
    - code [ref=e103]: years of education
    - text: . However, the function f that connects the input variable to the output variable is in general unknown. In this situation one must estimate f based on the observed points. Since
    - code [ref=e104]: Income
    - text: is a simulated data set, f is known and is shown by the blue curve in the right-hand panel of Figure 2.2. The vertical lines represent the error terms ϵ. We note that some of the 30 observations lie above the blue curve and some lie below it; overall, the errors have approximately mean zero.
  - paragraph [ref=e105]:
    - text: In general, the function f may involve more than one input variable. In Figure 2.3 we plot
    - code [ref=e106]: income
