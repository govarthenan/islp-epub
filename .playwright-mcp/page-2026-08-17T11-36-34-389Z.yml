    - text: ", as well as the slightly less positive relationship between"
    - code [ref=e281]: seniority
    - text: and
    - code [ref=e282]: income
    - text: . It may be that with such a small number of observations, this is the best we can do.
  - heading "Non-Parametric Methods" [level=4] [ref=e283]
  - paragraph [ref=e284]: "Non-parametric methods do not make explicit assumptions about the functional form of f. Instead they seek an estimate of f that gets as close to the data points as possible without being too rough or wiggly. Such approaches can have a major advantage over parametric approaches: by avoiding the assumption of a particular functional form for f, they have the potential to accurately fit a wider range of possible shapes for f. Any parametric approach brings with it the possibility that the functional form used to estimate f is very different from the true f, in which case the resulting model will not fit the data well. In contrast, non-parametric approaches completely avoid this danger, since essentially no assumption about the form of f is made. But non-parametric approaches do suffer from a major disadvantage: since they do not reduce the problem of estimating f to a small number of parameters, a very large number of observations (far more than is typically needed for a parametric approach) is required in order to obtain an accurate estimate for f."
