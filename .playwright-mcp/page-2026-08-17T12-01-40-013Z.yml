  - heading "How the book is taken apart" [level=2] [ref=f2e37]
  - paragraph [ref=f2e38]: "Six stages. Nothing here guesses at the layout: every rule below was measured from the file itself before it was written down."
  - img "Conversion pipeline in 6 stages" [ref=f2e40]:
    - generic [ref=f2e41]:
      - generic [ref=f2e43]: "1"
      - generic [ref=f2e44]: Read the PDF's own structureFonts, outline, colours and geometry, measured rather than guessed.
    - generic [ref=f2e47]:
      - generic [ref=f2e49]: "2"
      - generic [ref=f2e50]: Build a page modelSplit each page into text column, margin notes, prompts, code cells and figures.
    - generic [ref=f2e53]:
      - generic [ref=f2e55]: "3"
      - generic [ref=f2e56]: Recover the documentHeadings, paragraphs, lists, captions, code cells and display equations.
    - generic [ref=f2e59]:
      - generic [ref=f2e61]: "4"
      - generic [ref=f2e62]: Triage the mathematicsThree routes, chosen by what the character stream can and cannot carry.
    - generic [ref=f2e65]:
      - generic [ref=f2e67]: "5"
      - generic [ref=f2e68]: Check the mathematics adversariallyTypeset every candidate, put it under the original, and ask whether they agree.
    - generic [ref=f2e71]:
      - generic [ref=f2e73]: "6"
      - generic [ref=f2e74]: Package for the deviceEPUB 3 with an NCX, 300 ppi grayscale figures, no imposed font.
  - heading "The mathematics, triaged" [level=2] [ref=f2e76]
  - paragraph [ref=f2e77]: The starting assumption was that no mathematics could be recovered as LaTeX and that all of it would have to be read back out of images. That turned out to be true for only part of it. Sub- and superscripts are recorded in the PDF as a font-size drop plus a baseline shift, so most inline mathematics can be rebuilt exactly, for free, and stays as reflowing text. A vision model is spent only where the structure is genuinely absent.
  - list
  - heading "Where the crops went wrong" [level=2] [ref=f2e79]
  - paragraph [ref=f2e80]: "Cutting an expression out of the page was the hardest single problem in this conversion, and it took four attempts. A fraction is not on one line: its numerator, its rule and its denominator sit on three different baselines, and the text layer files them as three unrelated lines."
  - generic [ref=f2e81]:
    - figure "Attempt 1. Box taken from the text line. The fraction is sliced through the middle." [ref=f2e82]:
      - img "<b>Attempt 1.</b> Box taken from the text line. The fraction is sliced through the middle." [ref=f2e83]
    - figure "Attempt 2. Box grown greedily. It swallows the equation number and the next paragraph." [ref=f2e85]:
      - img "<b>Attempt 2.</b> Box grown greedily. It swallows the equation number and the next paragraph." [ref=f2e86]
    - figure "Attempt 4. Growth restricted to connected mathematics glyphs, never sideways along the base line." [ref=f2e88]:
      - img "<b>Attempt 4.</b> Growth restricted to connected mathematics glyphs, never sideways along the base line." [ref=f2e89]
    - figure "A fraction inside a sentence. No rectangle can hold it without also catching the line below." [ref=f2e91]:
      - img "A fraction inside a sentence. No rectangle can hold it without also catching the line below." [ref=f2e92]
    - figure "The answer. Keep the rectangle, paint the foreign ink out. Only prose is painted, so no glyph of the expression can be lost." [ref=f2e94]:
      - img "<b>The answer.</b> Keep the rectangle, paint the foreign ink out. Only prose is painted, so no glyph of the expression can be lost." [ref=f2e95]
  - heading "Every attempt, in order" [level=2] [ref=f2e97]
  - paragraph [ref=f2e98]: "4 worked, 2 partly worked, 4 failed outright. The failures are the interesting ones: each was caused by a rule that sounded reasonable and did not survive contact with the page."
  - list [ref=f2e99]:
    - listitem [ref=f2e100]:
      - generic [ref=f2e101]:
        - generic [ref=f2e102]: "01"
        - heading "Survey the tooling" [level=3] [ref=f2e103]
        - generic [ref=f2e104]: worked
      - paragraph [ref=f2e105]: "Tried Check what is installed: poppler, qpdf, ghostscript, python, node, codex."
      - paragraph [ref=f2e106]: Result No pandoc, no calibre, no Java. Decided to write the EPUB directly in Python for full control of the markup, and to write a structural validator because epubcheck needs Java.
    - listitem [ref=f2e107]:
      - generic [ref=f2e108]:
        - generic [ref=f2e109]: "02"
        - heading "Probe fonts and outline" [level=3] [ref=f2e110]
        - generic [ref=f2e111]: worked
      - paragraph [ref=f2e112]: Tried Count every font and character in the file; read the PDF bookmarks.
      - paragraph [ref=f2e113]: "Result 309 correct outline entries to build navigation from. Prose in Latin Modern, mathematics in Computer Modern: two disjoint families. Only 44 raster images in the whole book, so nearly every figure is vector art."
    - listitem [ref=f2e114]:
      - generic [ref=f2e115]:
        - generic [ref=f2e116]: "03"
        - heading "Extract mathematics as LaTeX from the text layer" [level=3] [ref=f2e117]
        - generic [ref=f2e118]: partly worked
      - paragraph [ref=f2e119]: Tried Try to rebuild LaTeX directly from the PDF character stream.
      - paragraph [ref=f2e120]: "Result Symbols come out correctly, structure does not: x_ij arrives as 'xij', a summation as ')d k=1'. But sub- and superscripts ARE recoverable geometrically, from the font-size drop plus the baseline shift."
      - paragraph [ref=f2e121]: Why The PDF stores glyphs and pen positions, not mathematical structure. Two-dimensional constructs (fractions, radicals, large operators, matrices) leave no trace in the character stream.
    - listitem [ref=f2e122]:
      - generic [ref=f2e123]:
        - generic [ref=f2e124]: "04"
        - heading "Deterministic LaTeX for accents and script letters" [level=3] [ref=f2e125]
        - generic [ref=f2e126]: worked
      - paragraph [ref=f2e127]: Tried Generate LaTeX from character data for the cases where structure IS recoverable.
      - paragraph [ref=f2e128]: "Result 497 occurrences solved with no model call at all, producing exactly right output such as \\hat{Y} = \\hat{f}(X) and \\mathbf{A} \\in \\mathbb{R}^{r\\times s}."
    - listitem [ref=f2e129]:
      - generic [ref=f2e130]:
        - generic [ref=f2e131]: "05"
        - heading "First end-to-end EPUB" [level=3] [ref=f2e132]
        - generic [ref=f2e133]: partly worked
      - paragraph [ref=f2e134]: Tried Run the whole chain over the first 100 pages and read the result in a browser at the Kobo's 1264 x 1680 panel size.
      - paragraph [ref=f2e135]: "Result A valid EPUB, but six visible faults: words glued together across spans, a ligature splitting 'fit' into 'f it' inside code, split captions, a column of stacked margin notes, a broken margin-note hyphenation, and paragraph indents that disagreed with the book."
      - paragraph [ref=f2e136]: Why Every one of them came from trusting a convenient rule instead of what the page actually measures.
    - listitem [ref=f2e137]:
      - generic [ref=f2e138]:
        - generic [ref=f2e139]: "06"
        - 'heading "Crop mathematics: box from one text line" [level=3] [ref=f2e140]'
        - generic [ref=f2e141]: failed
      - paragraph [ref=f2e142]: Tried Cut each expression out using the bounding box of its text line.
      - paragraph [ref=f2e143]: "Result Fractions came out sliced through the middle: numerator and denominator missing."
      - paragraph [ref=f2e144]: Why A fraction puts its numerator, rule and denominator on three different baselines, and the extractor files those as three separate lines.
    - listitem [ref=f2e145]:
      - generic [ref=f2e146]:
        - generic [ref=f2e147]: "07"
        - 'heading "Crop mathematics: grow the box greedily" [level=3] [ref=f2e148]'
        - generic [ref=f2e149]: failed
      - paragraph [ref=f2e150]: Tried Grow the box to absorb any nearby mathematical glyph.
      - paragraph [ref=f2e151]: Result Crops swallowed the equation number (3.4) and two whole lines of the following paragraph.
      - paragraph [ref=f2e152]: Why Equation numbers are set in a Computer Modern font, so they count as mathematics; and once the box touches the next line it keeps growing.
    - listitem [ref=f2e153]:
      - generic [ref=f2e154]:
        - generic [ref=f2e155]: "08"
        - 'heading "Crop mathematics: clamp to the neighbouring baselines" [level=3] [ref=f2e156]'
        - generic [ref=f2e157]: failed
      - paragraph [ref=f2e158]: Tried Stop the box at the baselines of the paragraph lines above and below.
      - paragraph [ref=f2e159]: Result The denominator and the summation limits were cut off, and two expressions on one line swallowed each other.
      - paragraph [ref=f2e160]: Why An inline fraction genuinely reaches into the vertical band of the line below it, so no clean horizontal cut exists.
    - listitem [ref=f2e161]:
      - generic [ref=f2e162]:
        - generic [ref=f2e163]: "09"
        - 'heading "Crop mathematics: connected growth plus painted-out ink" [level=3] [ref=f2e164]'
        - generic [ref=f2e165]: worked
      - paragraph [ref=f2e166]: Tried Grow only along connected mathematical glyphs, never sideways along the base line; match stray numerator and limit fragments back to their host paragraph line; then paint over whatever foreign ink remains inside the rectangle.
      - paragraph [ref=f2e167]: Result Every expression is captured whole, with nothing else in the picture.
    - listitem [ref=f2e168]:
      - generic [ref=f2e169]:
        - generic [ref=f2e170]: "10"
        - heading "Painting out foreign ink erased the summation limits" [level=3] [ref=f2e171]
        - generic [ref=f2e172]: failed
      - paragraph [ref=f2e173]: Tried Cover each foreign character with its bounding box.
      - paragraph [ref=f2e174]: Result Half of every summation limit disappeared.
      - paragraph [ref=f2e175]: Why The extractor reports each character's full em box, about 14.5 pt tall for 10 pt text, which reaches well into the neighbouring lines. Painting only the band from baseline - 0.78 x size to baseline + 0.24 x size fixed it.
